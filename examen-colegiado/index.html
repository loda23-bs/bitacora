<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fundamentos de Administración · Examen colegiado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#14213d; --muted:#5d6577; --line:#e4dfd3;
  --navy:#14213d; --gold:#c9972b; --gold-soft:#f6e9c8;
  --ok:#1e9e62; --ok-soft:#dff3e8; --bad:#d64545; --bad-soft:#fbe3e3;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1424;--card:#172038;--ink:#eef1f8;--muted:#a3abc0;--line:#26304b;--navy:#0b1120;--gold:#e0b04a;--gold-soft:#3a3220;--ok-soft:#163a2a;--bad-soft:#3d1d22;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:720px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0}
h1{font-size:28px;line-height:1.15}
h2{font-size:22px}
h3{font-size:18px}
p{margin:.4em 0}
small,.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .back{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.top .ttl{flex:1;min-width:0}
.top .ttl h2{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(201,151,43,.55),rgba(201,151,43,0) 70%)}
.hero h1{color:#fff}
.hero .sub{color:#c9d1e6;font-size:14px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-family:Fraunces,serif}
.stat span{font-size:11px;color:#c9d1e6}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid var(--line)}
.grid{display:grid;gap:12px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.mode .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none}
.mode h3{font-size:17px}
.mode p{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.sec{margin:22px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-weight:700;background:var(--navy);color:#fff;width:100%;font-size:16px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--gold);color:#1b1407}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;border:2px solid var(--line);font-size:14px;font-weight:600;background:var(--card)}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{border-color:var(--gold);background:var(--gold);color:#1b1407}.btn{background:#2a3a66}}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
/* path */
.unit{margin-top:22px}
.unit-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.unit-h .n{width:34px;height:34px;border-radius:10px;color:#fff;display:grid;place-items:center;font-weight:800;font-family:Fraunces,serif;flex:none}
.unit-h h3{font-size:16px;line-height:1.2}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px}
.lesson .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none;border:3px solid var(--line);background:var(--bg)}
.lesson .dot.done{border-color:var(--gold);background:var(--gold-soft)}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block;font-size:15px;line-height:1.25}
.lesson .t small{font-size:12px}
.stars{color:var(--gold);letter-spacing:1px;font-size:14px;flex:none}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;vertical-align:middle}
.tag.mat{background:var(--gold-soft);color:#7a5a10}
.tag.gen{background:#e3e9f7;color:#2b3f73}
@media (prefers-color-scheme:dark){.tag.mat{color:var(--gold)}.tag.gen{background:#22305a;color:#b9c7f0}}
/* concept card */
.concept{padding:22px}
.concept h3{font-size:21px;margin-bottom:10px}
.concept .body{font-size:16px;line-height:1.6}
.concept .body ul,.concept .body ol{padding-left:20px;margin:.4em 0}
.concept .body li{margin:.25em 0}
.concept b{color:var(--ink)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
/* question */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qhead .bar{flex:1}
.hearts{font-size:18px;flex:none}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);flex:none}
.timer.warn{background:var(--bad-soft);color:var(--bad)}
.qtext{font-size:18px;font-weight:600;line-height:1.45;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:15.5px;line-height:1.4;transition:border-color .12s,background .12s}
.opt .k{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.opt.sel{border-color:var(--navy)}
.opt.sel .k{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme:dark){.opt.sel{border-color:var(--gold)}.opt.sel .k{background:var(--gold);border-color:var(--gold);color:#1b1407}}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:14px;padding:14px 16px;border:2px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb h4{margin:0 0 4px;font-size:16px}
.fb .src{font-size:12px;color:var(--muted);margin-top:8px}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.sticky .in{max-width:720px;margin:0 auto}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(31px,1fr));gap:6px}
.navgrid button{min-width:0;padding:0;aspect-ratio:1;border-radius:7px;border:2px solid var(--line);font-size:11px;font-weight:700;background:var(--card)}
.navgrid button.ans{background:var(--navy);color:#fff;border-color:var(--navy)}
.navgrid button.flag{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.navgrid button.cur{outline:3px solid var(--gold);outline-offset:1px}
.navgrid button.r{background:var(--ok);border-color:var(--ok);color:#fff}
.navgrid button.w{background:var(--bad);border-color:var(--bad);color:#fff}
.navgrid button.e{background:var(--line)}
.big{font-family:Fraunces,serif;font-size:56px;font-weight:800;line-height:1}
.ubar{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.list li{margin:.45em 0}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--gold-soft);font-weight:700;font-size:13px}
.center{text-align:center}
.mt{margin-top:14px}.mt2{margin-top:22px}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:grid;place-items:center;z-index:20;padding:20px}
.modal .card{max-width:420px;width:100%}
.inp{display:block;width:100%;margin-top:6px;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.inp:focus{outline:none;border-color:var(--gold)}
input[type=date]{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.pop{animation:pop .25s ease}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp td,.cmp th{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top;text-align:left}
.cmp th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
details.card summary{font-weight:700;cursor:pointer;list-style:none}
details.card summary::after{content:"＋";float:right;color:var(--muted)}
details.card[open] summary::after{content:"－"}
</style>
</head>
<body>

<script>
const UNITS=[{"id":"U1","n":1,"title":"Administración y organizaciones","hrs":8,"color":"#2f6fde"},{"id":"U2","n":2,"title":"Teoría administrativa: surgimiento y evolución","hrs":22,"color":"#8a4fe0"},{"id":"U3","n":3,"title":"Proceso administrativo","hrs":28,"color":"#e0841f"},{"id":"U4","n":4,"title":"Áreas funcionales","hrs":20,"color":"#13a37a"},{"id":"U5","n":5,"title":"Pensamiento estratégico","hrs":6,"color":"#d6456b"},{"id":"U6","n":6,"title":"Perspectivas que inciden en las organizaciones","hrs":12,"color":"#1c9bb8"}];
const LESSONS=[{"id":"L11","u":"U1","title":"Concepto de administración","src":"mat","ref":"Reyes Ponce, cap. 1","cards":[{"h":"Etimología","b":"<b>Ad</b> (hacia) + <b>ministratio</b> (servir). <i>Minister</i> viene de <b>minus</b> (subordinación, servicio bajo el mando de otro) y se opone a <i>magister</i> (de <b>magis</b>: autoridad, superioridad).<br><br>Idea clave: administrar no es solo mandar; es <b>servir</b>: poner talento y recursos al servicio de un objetivo común."},{"h":"Definiciones de autores (Reyes Ponce)","b":"<ul><li><b>Fayol:</b> administrar es prever, organizar, mandar, coordinar y controlar.</li><li><b>Brech:</b> proceso social; responsabilidad de planear y regular las operaciones.</li><li><b>Koontz y O'Donnell:</b> dirección de un organismo social basada en la habilidad de conducir a sus integrantes.</li><li><b>Mooney:</b> arte o técnica de dirigir e inspirar con base en el conocimiento de la naturaleza humana.</li><li><b>Fernández Arena:</b> ciencia social, objetivos institucionales por medio de una estructura.</li><li><b>Jiménez Castro:</b> sistemas racionales de esfuerzo cooperativo.</li><li><b>Peterson y Plowman:</b> técnica para determinar, clarificar y realizar propósitos de un grupo.</li><li><b>Tannenbaum:</b> uso de la autoridad para organizar, dirigir y controlar.</li><li><b>G. P. Terry:</b> lograr un objetivo mediante el <b>esfuerzo ajeno</b>.</li></ul>"},{"h":"Objeto y finalidad","b":"<b>Objeto:</b> el <b>organismo social</b> (personas que se unen para un fin común). Objeto específico: la <b>coordinación</b> sistemática de medios.<br><b>Finalidad:</b> obtener resultados de <b>máxima eficiencia en la coordinación</b>: la coordinación no solo suma esfuerzos, los <b>multiplica</b>."},{"h":"Mecánica vs. dinámica (Urwick)","b":"<b>Mecánica administrativa</b> = fase de <b>estructuración</b>: cómo <i>deben ser</i> las relaciones (teoría, mira al futuro, como el plano de una casa).<br><b>Dinámica administrativa</b> = fase de <b>operación</b>: cómo <i>son de hecho</i> (práctica, como vivir en la casa).<br>La división la formaliza <b>Lyndall Urwick</b>."},{"h":"¿Ciencia, técnica o empirismo?","b":"<b>Ciencia:</b> busca la verdad; principios que se <i>descubren</i>.<br><b>Técnica:</b> busca la utilidad práctica; reglas e instrumentos que el ser humano <i>crea</i>.<br><b>Empirismo:</b> solo experiencia, caso por caso.<br>Para Reyes Ponce la administración es una <b>técnica basada en principios científicos</b> (sociología, psicología, economía). Rechaza la postura puramente empírica de <b>Ernest Dale</b>."},{"h":"Definición de Reyes Ponce","b":"«La administración es el <b>conjunto sistemático de reglas</b> para lograr la <b>máxima eficiencia</b> en las formas de coordinar un <b>organismo social</b>».<br>Sistemática = sigue un método; se aplica a un organismo social; su métrica es la máxima eficiencia."},{"h":"Características (UEUU)","b":"<ol><li><b>Universalidad:</b> existe dondequiera que hay un organismo social (Estado, ejército, empresa, iglesia, club).</li><li><b>Especificidad:</b> aunque se auxilie de otras disciplinas, su función es única e inconfundible.</li><li><b>Unidad temporal:</b> las etapas se dan de forma simultánea en la realidad.</li><li><b>Unidad jerárquica:</b> todos los jefes, del gerente al último supervisor, forman un solo cuerpo administrativo.</li></ol>"},{"h":"Importancia","b":"<ul><li>Ningún organismo social sobrevive sin buena administración.</li><li>Para las <b>PyMEs</b> la eficiencia administrativa es su posibilidad real de competir.</li><li>Elevar la <b>productividad</b> y el nivel de vida de la sociedad.</li><li>En países en desarrollo es requisito para la capitalización y el desarrollo.</li></ul>"}]},{"id":"L12","u":"U1","title":"Organizaciones y el administrador","src":"gen","ref":"Reyes Ponce cap. 9; Luhmann; bibliografía del programa (Chiavenato, Koontz, Robbins)","cards":[{"h":"¿Qué es una organización?","b":"Unidad social coordinada conscientemente, con límites identificables, que funciona con relativa continuidad para lograr objetivos comunes.<br><b>Organización ≠ empresa</b>: toda empresa es organización, pero no toda organización es empresa (iglesias, ONG, gobierno, clubes)."},{"h":"Clasificación por fines (Reyes Ponce)","b":"<ul><li><b>Políticas:</b> bien común (Estado, ejército, tribunales, partidos).</li><li><b>Económicas:</b> producen bienes o servicios. <b>Primarias</b> (agricultura, ganadería: fuerza de la naturaleza), <b>secundarias</b> (industria: ingenio humano), <b>terciarias</b> (servicios: comercio, bancos, turismo).</li><li><b>Educativas y culturales</b> (universidades, museos).</li><li><b>Religiosas</b>.</li><li><b>De fines sociales</b> (comunicarnos y ayudarnos).</li></ul>Otras clasificaciones comunes: por sector (público, privado, social), por tamaño (micro, pequeña, mediana, grande), por lucro (lucrativas / no lucrativas), por origen del capital (nacional, extranjero, mixto)."},{"h":"Formal vs. informal","b":"<b>Formal:</b> estructura planeada deliberadamente, resultado de una decisión explícita (organigrama, normas).<br><b>Informal:</b> surge espontáneamente de las interacciones; resuelve rápido lo no previsto, pero puede operar en contra de los fines.<br>Ambas se mezclan: no se entiende una sin la otra."},{"h":"El administrador: niveles","b":"<b>Alta dirección</b> (estratégico, largo plazo), <b>mandos medios</b> (táctico) y <b>primera línea / supervisores</b> (operativo, corto plazo).<br>Reyes Ponce: en lo alto predomina <b>dirigir</b>; en medio, <b>administrar</b>; abajo, <b>supervisar</b>."},{"h":"Habilidades (Robert Katz)","b":"<b>Técnicas</b> (saber hacer el trabajo específico) → pesan más en niveles bajos.<br><b>Humanas</b> (trabajar con personas) → importantes en todos los niveles.<br><b>Conceptuales</b> (ver la organización como un todo, abstraer) → pesan más en la alta dirección."},{"h":"Roles gerenciales (Henry Mintzberg)","b":"<b>Interpersonales:</b> figura representativa (cabeza visible), líder, enlace.<br><b>Informativos:</b> monitor, difusor, portavoz.<br><b>Decisorios:</b> emprendedor, manejador de perturbaciones, asignador de recursos, negociador.<br>Total: <b>10 roles en 3 grupos</b>."},{"h":"Eficiencia vs. eficacia","b":"<b>Eficacia:</b> lograr los objetivos (hacer lo correcto).<br><b>Eficiencia:</b> lograrlos con el mejor uso de recursos (hacer las cosas bien).<br><b>Efectividad:</b> combinación de ambas (algunos autores la llaman productividad)."},{"h":"Perfil del profesional en administración","b":"Planea, organiza, dirige y controla recursos; toma decisiones; lidera equipos; actúa con ética, visión estratégica, responsabilidad social y sostenibilidad. Campo: empresas privadas, sector público, sector social, emprendimiento y consultoría."}]},{"id":"L13","u":"U1","title":"Comportamiento organizacional (Ivancevich, cap. 1)","src":"mat","ref":"Ivancevich, Konopaske y Matteson (2006), cap. 1","cards":[{"h":"Fuerzas ambientales","b":"<ol><li><b>Poder de los recursos humanos</b> (escasez de personal calificado; el capital humano como activo).</li><li><b>Globalización</b> (redes que unen países, instituciones y personas).</li><li><b>Diversidad cultural</b>.</li><li><b>Rapidez del cambio</b>.</li><li><b>Contrato psicológico</b>.</li><li><b>Tecnología</b> (incluye TI).</li></ol>No atenderlas genera insatisfacción, menor compromiso, agotamiento y juicios equivocados."},{"h":"El nuevo contrato psicológico","b":"Acuerdo <b>no escrito</b> entre trabajador y empleador sobre las expectativas mutuas de contribución y recompensa.<br>Antes: empleo de por vida por antigüedad. Ahora el empleo se mantiene con buen desempeño y el trabajador exige honestidad, respeto a su salud y flexibilidad."},{"h":"Orígenes del CO","b":"<b>Taylor</b> (administración científica, 1890-1930): puestos, tiempos, movimientos, incentivos económicos.<br><b>Fayol</b> (teoría del proceso): la administración como conocimiento enseñable y aplicable a cualquier organización.<br><b>Estudios Hawthorne</b> (Mayo, Roethlisberger y Dickson, <b>1924-1932</b>, Western Electric, +20,000 empleados): los grupos informales y saberse observado cambian la conducta (<b>efecto Hawthorne</b>)."},{"h":"Definición y 6 características del CO","b":"Estudio del comportamiento, actitudes y desempeño humano en la organización, con base en psicología, sociología, ciencias políticas y antropología cultural.<br>Características: 1) forma de pensar (3 niveles: individuo, grupo, organización), 2) multidisciplinario, 3) humanista, 4) orientado al desempeño, 5) usa el método científico, 6) orientado a las aplicaciones."},{"h":"Disciplinas que aportan (Robbins)","b":"<b>Psicología</b> → individuo (aprendizaje, motivación, personalidad, percepción).<br><b>Sociología</b> → grupo/organización (equipos, comunicación, cultura).<br><b>Psicología social</b> → grupo (cambio de actitud, decisiones grupales).<br><b>Antropología</b> → valores comparativos, cultura.<br><b>Ciencia política</b> → conflicto, poder, política interna."},{"h":"Marco de análisis y sistema abierto","b":"Niveles: <b>individuo</b> (percepción, valores, motivación), <b>grupo</b> (liderazgo, poder, conflicto), <b>procesos</b> (comunicación, decisiones), <b>estructura</b> (diseño, cambio) → efectividad organizacional, dentro de un ambiente externo.<br>Sistema abierto: <b>insumos → transformación → productos</b>, en interdependencia con el entorno."},{"h":"Efectividad en el tiempo","b":"<b>Corto plazo:</b> calidad, productividad, eficiencia, satisfacción.<br><b>Mediano plazo:</b> adaptabilidad y desarrollo.<br><b>Largo plazo:</b> supervivencia.<br>La <b>calidad</b> (Deming, Juran) atraviesa los tres plazos: es satisfacer las necesidades del cliente."},{"h":"Drucker: «Manejarse a uno mismo»","b":"<b>Análisis de retroalimentación</b> (comparar expectativas con resultados para hallar fortalezas), conocer tu <b>estilo de aprendizaje</b> (lector u oyente) y <b>alinear tus valores</b> con los de la organización."}]},{"id":"L21","u":"U2","title":"Antecedentes, enfoque científico y clásico","src":"gen","ref":"Programa 2127; Chiavenato; Ivancevich cap. 1","cards":[{"h":"Antecedentes","b":"Prácticas administrativas desde la antigüedad (Egipto, Babilonia: <b>Código de Hammurabi</b>, China, Grecia, Roma, la <b>Iglesia católica</b> con su jerarquía y la <b>organización militar</b> con su cadena de mando y su staff).<br>La <b>Revolución Industrial</b> (s. XVIII-XIX) crea las grandes fábricas y la necesidad de una administración sistemática. Economistas clásicos como <b>Adam Smith</b> aportan la división del trabajo."},{"h":"Enfoque científico: Frederick W. Taylor","b":"Obra: <b>Principios de la administración científica (1911)</b>. Énfasis en la <b>tarea</b> y en la eficiencia del nivel operativo.<br>Herramientas: estudio de <b>tiempos y movimientos</b>, el «one best way», incentivos salariales, selección y entrenamiento científico, supervisión funcional.<br>Concepción del trabajador: <b>homo economicus</b> (lo mueve el dinero)."},{"h":"Los 4 principios de Taylor","b":"1) <b>Planeación</b>: sustituir la improvisación por métodos científicos.<br>2) <b>Preparación</b>: seleccionar y entrenar científicamente.<br>3) <b>Control</b>: verificar que el trabajo se haga según lo planeado.<br>4) <b>Ejecución</b>: distribuir atribuciones y responsabilidades."},{"h":"Otros autores de la administración científica","b":"<b>Frank y Lillian Gilbreth</b>: estudio de movimientos (therbligs), fatiga.<br><b>Henry L. Gantt</b>: gráfica de Gantt; bonos por tarea.<br><b>Harrington Emerson</b>: principios de eficiencia.<br><b>Henry Ford</b>: línea de montaje y producción en masa; principios de intensificación, economicidad y productividad."},{"h":"Enfoque clásico: Henri Fayol","b":"Obra: <b>Administración industrial y general (1916)</b>. Énfasis en la <b>estructura</b> y en la empresa como un todo (de arriba hacia abajo).<br><b>6 funciones básicas de la empresa:</b> técnicas, comerciales, financieras, de seguridad, contables y <b>administrativas</b>.<br><b>Proceso:</b> prever, organizar, dirigir (mandar), coordinar y controlar."},{"h":"Los 14 principios de Fayol","b":"División del trabajo · Autoridad y responsabilidad · Disciplina · <b>Unidad de mando</b> (un solo jefe) · <b>Unidad de dirección</b> (un plan para un mismo objetivo) · Subordinación del interés individual al general · Remuneración · Centralización · Jerarquía (cadena escalar) · Orden · Equidad · Estabilidad del personal · Iniciativa · Espíritu de equipo."},{"h":"Taylor vs. Fayol","b":"<b>Taylor:</b> de abajo hacia arriba, el obrero y la tarea, Estados Unidos, eficiencia en el taller.<br><b>Fayol:</b> de arriba hacia abajo, la estructura y la dirección, Francia, la administración como algo universal y enseñable.<br>Comparten: buscar la eficiencia y ver al ser humano de forma mecanicista. Clásicos complementarios: <b>Urwick</b> y <b>Gulick</b> (POSDCORB)."}]},{"id":"L22","u":"U2","title":"Humano-relacionista y neohumano-relacionista","src":"gen","ref":"Programa 2127; Ivancevich; Reyes Ponce cap. 11; Koontz","cards":[{"h":"Enfoque humano-relacionista","b":"Surge como reacción al mecanicismo clásico. Figura central: <b>Elton Mayo</b>. Énfasis en las <b>personas</b> y los <b>grupos informales</b>.<br>Concepción: <b>homo social</b> (lo motivan el reconocimiento, la pertenencia y la aprobación social, no solo el dinero)."},{"h":"Experimento Hawthorne","b":"Planta Hawthorne de la <b>Western Electric</b> (Chicago). Ivancevich lo fecha <b>1924-1932</b>.<br>Comenzó estudiando la <b>iluminación</b> y la productividad; descubrió que la producción dependía de normas sociales, de la integración al grupo y de la atención recibida.<br><b>Efecto Hawthorne:</b> la conducta cambia por saberse observado."},{"h":"Mary Parker Follett","b":"Conflicto constructivo: resolverlo por <b>dominación</b>, por <b>compromiso</b> o, lo ideal, por <b>integración</b> (todos ganan).<br>«Ley de la situación»: la orden viene de lo que exige la situación, no del capricho del jefe (Reyes Ponce lo retoma como principio de la <b>impersonalidad del mando</b>).<br>Disciplina positiva = «autocontrol organizado»."},{"h":"Neohumano-relacionismo (conductismo)","b":"Integra ciencias de la conducta y busca conciliar las necesidades de las personas con los objetivos de la organización.<br><b>Maslow:</b> pirámide de necesidades.<br><b>McGregor:</b> Teoría X y Teoría Y.<br><b>Herzberg:</b> factores higiénicos y motivadores.<br><b>Likert:</b> sistemas 1 a 4.<br><b>Argyris:</b> inmadurez-madurez.<br><b>McClelland:</b> logro, poder y afiliación."},{"h":"Maslow","b":"Fisiológicas → seguridad → pertenencia/afecto → estima/aprecio → <b>autorrealización</b>.<br>Mientras no se satisface razonablemente un nivel inferior, no se busca el superior. <b>Una necesidad satisfecha deja de motivar.</b>"},{"h":"McGregor y Herzberg","b":"<b>Teoría X:</b> la persona evita el trabajo, necesita control y castigo.<br><b>Teoría Y:</b> el trabajo es natural; hay autocontrol, compromiso y creatividad.<br><b>Herzberg:</b> los <b>higiénicos</b> (salario, condiciones, supervisión, políticas) evitan la insatisfacción pero no motivan; los <b>motivadores</b> (logro, reconocimiento, el trabajo en sí, responsabilidad, crecimiento) sí motivan."},{"h":"Likert","b":"Sistema 1: autoritario-coercitivo · 2: autoritario-benevolente · 3: consultivo · 4: <b>participativo</b>.<br>El material de estructura vincula el modelo <b>mecanicista con el Sistema 1</b> y el <b>orgánico con el Sistema 4</b>."}]},{"id":"L23","u":"U2","title":"Estructuralista y neoclásico","src":"gen","ref":"Programa 2127; Reyes Ponce cap. 9; Luhmann cap. 1; Koontz","cards":[{"h":"Max Weber y la burocracia","b":"Para Weber la burocracia es la forma <b>más eficiente</b> (racional) de administrar organizaciones grandes y complejas.<br>Tipos de autoridad: <b>tradicional</b>, <b>carismática</b> y <b>racional-legal</b> (la base de la burocracia).<br>Luhmann: elimina el favoritismo y la arbitrariedad y los reemplaza por la <b>igualdad y la norma escrita</b>."},{"h":"Dimensiones de la burocracia (Hall, en Reyes Ponce)","b":"1) División del trabajo por especialización · 2) <b>Jerarquía de autoridad</b> bien definida · 3) <b>Impersonalidad</b> · 4) Sistema de reglas (derechos y obligaciones) · 5) Procedimientos · 6) Selección y promoción por <b>competencia técnica</b>.<br>Las 3 primeras son las principales."},{"h":"Críticas: Merton y desplazamiento de fines","b":"<b>Merton:</b> la burocracia fomenta el apego rígido a las reglas por sí mismas, lo que <b>desplaza los objetivos</b> (los medios se vuelven fines).<br>Es apropiada para tareas <b>rutinarias</b>; no lo es para organizaciones que necesitan creatividad e innovación."},{"h":"Enfoque estructuralista","b":"Ve la organización como un todo: organización <b>formal e informal</b>, recompensas materiales y sociales, relaciones con el ambiente; acepta el <b>conflicto</b> como inevitable. Concepción: <b>hombre organizacional</b> (desempeña varios roles).<br>Autores: <b>Weber</b>, <b>Amitai Etzioni</b> (organizaciones coercitivas, utilitarias y normativas), <b>Blau y Scott</b> (clasificación por beneficiario principal), Merton, Selznick."},{"h":"Enfoque neoclásico","b":"Retoma a los clásicos y los actualiza con <b>pragmatismo</b> y <b>eclecticismo</b>; énfasis en los <b>objetivos y resultados</b>.<br>Autores: <b>Peter Drucker</b>, <b>Koontz y O'Donnell</b>, Ernest Dale, William Newman.<br>Aportaciones: <b>administración por objetivos (APO)</b>, el proceso administrativo, departamentalización, centralización vs. descentralización."},{"h":"Drucker y la APO","b":"<b>Drucker (1954)</b> fue el catalizador de la <b>APO</b>, con énfasis en el <b>autocontrol y la autodirección</b>. General Electric ya aplicaba elementos (Drucker la atribuyó a Harold Smiddy).<br><b>McGregor (1957)</b> la propuso para la evaluación del desempeño: el subordinado fija sus metas de corto plazo y se evalúa contra ellas."}]},{"id":"L24","u":"U2","title":"Sistemas, matemático, calidad y complejidad","src":"gen","ref":"Programa 2127; Luhmann cap. 1; Ivancevich; bibliografía general","cards":[{"h":"Enfoque de sistemas","b":"<b>Ludwig von Bertalanffy</b>: Teoría General de Sistemas. Un sistema es un conjunto de partes interrelacionadas que forman un todo con un objetivo.<br><b>Katz y Kahn</b>: la organización como <b>sistema abierto</b>: insumos → transformación → productos → retroalimentación.<br>El todo es más que la suma de las partes (<b>sinergia</b>: 2 + 2 = 5)."},{"h":"Conceptos sistémicos","b":"<b>Entropía:</b> tendencia al desgaste y al desorden. <b>Negentropía:</b> el sistema importa energía para sobrevivir.<br><b>Homeostasis:</b> equilibrio dinámico.<br><b>Equifinalidad:</b> llegar al mismo resultado por caminos distintos.<br><b>Retroalimentación:</b> información de salida que regresa para corregir.<br>Luhmann: el entorno es más complejo que el sistema; la función del sistema es <b>reducir la complejidad</b>."},{"h":"Enfoque matemático (cuantitativo)","b":"Nace con la <b>investigación de operaciones</b> en la II Guerra Mundial. Usa modelos matemáticos para decidir.<br>Herramientas: programación lineal, <b>teoría de juegos</b> (von Neumann y Morgenstern), teoría de colas, probabilidad y estadística, <b>PERT/CPM</b>, simulación, teoría de decisiones (<b>Herbert Simon</b>).<br>Límite: no todo lo humano se puede cuantificar."},{"h":"Enfoque de la calidad","b":"<b>W. Edwards Deming:</b> 14 puntos, ciclo <b>PHVA</b> (Planear-Hacer-Verificar-Actuar, de Shewhart), control estadístico.<br><b>Joseph Juran:</b> calidad = adecuación al uso; <b>trilogía</b>: planificación, control y mejora.<br><b>Philip Crosby:</b> «cero defectos», «la calidad es gratis».<br><b>Kaoru Ishikawa:</b> diagrama causa-efecto (espina de pescado), círculos de calidad.<br><b>Feigenbaum:</b> control total de calidad. <b>Kaizen</b>: mejora continua."},{"h":"Pensamiento complejo","b":"<b>Edgar Morin</b>: frente al pensamiento simplificador (que separa y reduce), propone <b>religar</b> saberes y aceptar la incertidumbre.<br>Principios: <b>dialógico</b> (lógicas opuestas que se complementan), <b>recursividad organizacional</b> (los productos son también productores) y <b>hologramático</b> (la parte está en el todo y el todo en la parte).<br>En las organizaciones: interdisciplinariedad, adaptabilidad, la organización como sistema vivo."},{"h":"Garbage can y enactment (vía Luhmann)","b":"<b>Bote de basura</b> (Cohen, March y Olsen): en entornos ambiguos, problemas, soluciones, participantes y oportunidades circulan por separado; a veces hay «soluciones guardadas en el cajón» esperando un problema.<br><b>Karl Weick (enactment):</b> la organización <b>construye</b> su entorno.<br><b>Institucionalismo</b> (Meyer y Rowan; DiMaggio y Powell): se imitan estructuras para ganar <b>legitimidad</b> (isomorfismo)."}]},{"id":"L25","u":"U2","title":"Herbert Simon: la acción administrativa","src":"mat","ref":"Cruz Soto (2021), cap. IX","cards":[{"h":"Idea central","b":"En <i>El comportamiento administrativo</i>, Simon pone la <b>decisión</b> en el centro: todo proceso administrativo es, en esencia, un <b>proceso de decisión</b>.<br>Busca una explicación <b>interdisciplinaria</b>: psicología (decisión), sociología (funciones) y ciencia política (autoridad)."},{"h":"3 concepciones del trabajador (March y Simon)","b":"1) <b>Instrumento pasivo</b> → administración científica (taylorismo).<br>2) <b>Portador de actitudes y motivos</b> → relaciones humanas (Mayo).<br>3) <b>Tomador de decisiones y solucionador de problemas</b> → Simon.<br>Al ver al individuo como decisor se le reconoce un <b>espacio de autonomía</b>: es una crítica al control impositivo."},{"h":"Terminología y conceptos operativos","b":"Simon critica la vaguedad de los «principios»: antes de tener principios, una ciencia necesita <b>conceptos operativos</b>.<br><b>Benveniste:</b> toda ciencia se legitima al crear una terminología propia."},{"h":"Comportamiento administrativo","b":"Es una acción <b>social e intencionada</b>.<br>Principios: <b>impersonalidad</b> (intereses colectivos) e <b>intencionalidad</b> (orientada a metas).<br>Doble carácter de la organización: <b>externo</b> (catalizador del esfuerzo social para la sociedad) e <b>interno</b> (orienta las acciones individuales mediante la división de funciones).<br>Categorías: división del trabajo, cooperación, autoridad, decisión, comunicación y objetivos."},{"h":"Organización según Simon","b":"El «complejo diseño de comunicaciones y demás relaciones» dentro de un grupo humano: transmite información, supuestos y actitudes para decidir, y es un <b>sistema de expectativas y roles</b>.<br>3 razones para estudiarlas: poca atención histórica, <b>moldean la conducta</b> humana y son una plataforma de autoridad e influencia (Foucault: «observatorios privilegiados» del poder; Whyte: <i>El hombre organización</i>)."},{"h":"6 elementos que definen la administración","b":"1) <b>División del trabajo</b> → especialización · 2) <b>Autoridad</b>: poder de tomar decisiones que guían las acciones de otros · 3) <b>Influencia</b> → cooperación · 4) <b>Comunicación</b>: transmite las premisas decisorias · 5) <b>Decisión</b>: selección consciente o inconsciente de acciones; eje del acto administrativo · 6) <b>Intencionalidad</b>: orientación a objetivos."},{"h":"Cooperación vs. coordinación; especialización","b":"<b>Cooperación:</b> voluntad de compartir un fin común. <b>Coordinación:</b> informar a cada quien lo que harán los demás.<br><b>Especialización horizontal:</b> tareas distintas en el mismo nivel (departamentos). <b>Vertical:</b> división del trabajo de decisión y mando entre niveles (jerarquía)."},{"h":"Autoridad y decisiones","b":"La autoridad existe solo si el subordinado <b>realmente ajusta su conducta</b>. Mecanismos: <b>coercitivo/impositivo</b> y <b>persuasivo/consultivo</b>.<br>Decisión <b>personal</b>: subjetiva e <b>indelegable</b>. Decisión <b>impersonal (organizacional)</b>: objetiva, <b>delegable</b>, analiza medios y fines."},{"h":"Racionalidad limitada","b":"No se pueden conocer todas las alternativas ni prever todos los efectos; tendemos a <b>simplificar</b> con reglas sencillas.<br><b>Hombre económico</b>: <b>maximiza</b>, información completa, evalúa todas las alternativas.<br><b>Hombre administrativo</b>: <b>satisface</b> (busca lo «bastante bueno»), información incompleta, examina pocas alternativas.<br>3 limitaciones del individuo: hábitos y reflejos, <b>lealtad</b> y grado de conocimiento."}]},{"id":"L26","u":"U2","title":"Luhmann: Organización y decisión","src":"mat","ref":"Luhmann (2010), introducción y cap. 1","cards":[{"h":"Niklas Luhmann (1927-1998)","b":"Sociólogo alemán de la <b>teoría de sistemas sociales</b>; aplica conceptos de la cibernética y la biología a lo social.<br>Las organizaciones también se nutren de fuentes no sociológicas: administración, psicología social, psiquiatría, cibernética, matemáticas, biología."},{"h":"Autopoiesis","b":"Los sistemas sociales son <b>autopoiéticos</b>: se producen a sí mismos (concepto de <b>Maturana y Varela</b>, como las células que se reemplazan).<br>En los sistemas sociales la unidad básica son las <b>comunicaciones</b>; en las organizaciones, las <b>decisiones</b>.<br>Con su entorno tienen <b>acoplamiento estructural</b>."},{"h":"3 tipos de sistemas sociales","b":"a) <b>Sociedad:</b> todas las comunicaciones posibles.<br>b) <b>Organización:</b> pone <b>condiciones de membresía</b> que deben aceptar quienes quieren pertenecer.<br>c) <b>Interacción:</b> sistema pasajero entre personas físicamente presentes; termina cuando se separan."},{"h":"Génesis del concepto","b":"En la <b>Edad Media</b> no había un concepto especial de organización (el orden descansaba en la familia y la corporación).<br>Nace en el <b>siglo XIX</b>, tras la Revolución Francesa (<b>Saint-Simon, Comte</b>).<br>Se pasa del esquema orgánico «<b>todo y partes</b>» a una actividad ordenadora funcional. El taylorismo pierde credibilidad al tratar la organización como una máquina rígida."},{"h":"Weber según Luhmann","b":"Burocracia: dominio jurídico formal (mando y obediencia), separación del trabajador de los medios de producción (salario) y ahorro de comunicación mediante normas generales.<br><b>Límite:</b> supone una obediencia perfecta que no existe; abajo siempre hay margen de interpretación, negociaciones y «colusiones»."},{"h":"Hawthorne y la máquina no trivial","b":"Organización <b>formal</b> (jerarquía, normas, certidumbre) vs. <b>informal</b> (relaciones espontáneas, confianza; adapta las normas o genera resistencia).<br><b>Heinz von Foerster:</b> el grupo es una «<b>máquina no trivial</b>»: no responde igual a los mismos estímulos, porque depende de su estado interno e historia."},{"h":"Fines y medios","b":"Esquema clásico: la cúspide fija los fines y los niveles bajos ejecutan los medios.<br>Crítica: <b>desplazamiento de fines</b> (cumplir la norma por cumplirla).<br>Aporte de <b>Simon</b>: la organización fija <b>premisas decisorias</b> en lugar de exigir una perfección imposible."},{"h":"Las 6 distinciones que Luhmann reemplaza","b":"1) Todo/partes → <b>sistema/entorno</b>.<br>2) Orden y obediencia → <b>redes formales e informales de poder</b>.<br>3) Organización formal → <b>sistemas de interacción e informales</b>.<br>4) Fin/medio → <b>racionalidad limitada y contingencia</b>.<br>5) Entrada/salida (caja negra) → <b>autorreferencia y decisiones</b>.<br>6) Adaptación pasiva → <b>construcción del entorno</b> (enactment)."}]},{"id":"L31","u":"U3","title":"Elementos del proceso administrativo","src":"mat","ref":"Reyes Ponce, cap. 2","cards":[{"h":"Unidad y necesidad de división","b":"En la realidad el fenómeno administrativo es <b>único, continuo e inseparable</b>: mientras se planea, se dirige y se controla.<br>Se divide en etapas solo para estudiarlo y fijar reglas (como la medicina, que estudia por separado los sistemas del cuerpo)."},{"h":"Criterios de diversos autores","b":"<b>AMA (Appley):</b> planeación, organización, supervisión (3).<br><b>Terry:</b> planeación, organización, ejecución, control (4).<br><b>Fayol:</b> prever, organizar, mandar, coordinar, controlar (5); la coordinación es la esencia.<br><b>Koontz y O'Donnell:</b> planeación, organización, integración, dirección, control (5).<br><b>Urwick:</b> previsión, planeación, organización, integración, dirección, control (6); separa la previsión de la planeación.<br><b>Dale:</b> 6, añade <b>innovación/representación</b>.<br><b>Gulick:</b> 8 elementos (POSDCORB), pensado para la administración pública."},{"h":"Síntesis de Reyes Ponce: 6 etapas, 2 fases","b":"<b>Mecánica:</b><br>1. <b>Previsión</b>: ¿qué puede hacerse? (objetivos, investigaciones, alternativas)<br>2. <b>Planeación</b>: ¿qué se va a hacer? (políticas, procedimientos, programas, presupuestos, estrategias)<br>3. <b>Organización</b>: ¿cómo se va a hacer? (funciones, jerarquías, obligaciones)<br><b>Dinámica:</b><br>4. <b>Integración</b>: ¿con qué y con quién? (selección, introducción, desarrollo)<br>5. <b>Dirección</b>: ver que se haga (autoridad, comunicación, delegación, supervisión)<br>6. <b>Control</b>: ¿cómo se ha realizado? (establecimiento, operación, evaluación)"},{"h":"El mito de Jano","b":"Jano, dios romano de dos caras, mira a la vez al pasado y al futuro: el <b>control</b> (que evalúa el pasado) se conecta inmediatamente con la <b>previsión</b> (que mira al futuro). El proceso es cíclico."},{"h":"Administración de cosas (criterio de Fayol)","b":"El proceso se aplica sobre 6 áreas de operaciones: <b>financieras</b> (capital), <b>productivas</b>, de <b>ventas/distribución</b>, de <b>conservación</b> (mantenimiento), de <b>registro</b> (contabilidad y estadística) y de <b>compras</b>."},{"h":"Método: los 3 pilares (Luis F. Anderson)","b":"Toda regla administrativa descansa en: 1) <b>Principios</b> (de ciencias base), 2) el <b>proceso</b> (núcleo propio de la administración), 3) <b>instrumentos o medios técnicos</b>: tests de selección, organigramas, gráficas de salarios, calificación de méritos, presupuestos y modelos matemáticos."}]},{"id":"L32","u":"U3","title":"Previsión","src":"mat","ref":"Reyes Ponce, cap. 7","cards":[{"h":"Concepto","b":"De <i>prever</i>: ver anticipadamente. Responde a <b>¿qué puede hacerse?</b><br>Requiere: a) fijar <b>objetivos</b>, b) <b>investigar</b> factores positivos y negativos, c) coordinar medios en <b>cursos alternativos de acción</b>.<br>Empezar directamente por la planeación arriesga caer en «<b>la falacia del único camino</b>» (Drucker)."},{"h":"Principio de la previsibilidad","b":"Las previsiones <b>nunca alcanzan certeza completa</b> (siempre hay riesgo), pero la empresa tampoco es una aventura totalmente incierta. Descansan en la <b>certeza moral o probabilidad seria</b>, que crece con la experiencia y la estadística.<br>Fayol: la previsión no es profecía, es <b>reducción del riesgo</b>."},{"h":"Certeza, incertidumbre y probabilidad","b":"<b>Certeza:</b> excluye el temor de equivocarse. Puede ser <b>metafísica</b> (un círculo no puede ser cuadrado), <b>física</b> (un eclipse) o <b>moral</b> (la ley de la oferta y la demanda).<br><b>Incertidumbre:</b> no hay elementos para predecir, o son de igual valor. Ojo: si se concluye que un producto fracasará, eso es <b>certeza desfavorable</b>, no incertidumbre.<br><b>Probabilidad:</b> hay motivos serios para pensar que ocurrirá más en un sentido que en otro."},{"h":"Principios de objetividad y medición","b":"<b>Objetividad:</b> las previsiones deben descansar en <b>hechos más que en opiniones</b> (por ejemplo, presupuestos basados en datos de años anteriores).<br><b>Medición:</b> son más seguras cuanto más se puedan medir <b>cuantitativamente</b>. Si no se puede medir directamente, se fija un estándar por <b>definición óptima</b>."},{"h":"Objetivos: conceptos conexos","b":"<b>Fin:</b> concepto filosófico presente en todos.<br><b>Premisa</b> (pre-missum): lo que viene antes.<br><b>Propósito:</b> algo que se desea, pero sin la fuerza de una decisión.<br><b>Misión:</b> lo más genérico y filosófico.<br><b>Metas:</b> precisas, en cifras de costo, calidad y tiempo.<br><b>Resultado:</b> el objetivo ya logrado."},{"h":"Clases de objetivos","b":"• <b>Individuales / colectivos</b> (el objetivo del dueño ≠ el de la empresa).<br>• <b>Generales / particulares</b> (clasificación relativa).<br>• <b>Básicos / secundarios / colaterales</b> (los colaterales se obtienen casi espontáneamente; por ejemplo, la publicidad mejora las relaciones públicas).<br>• <b>Estratégicos</b> (alto nivel, largo plazo) / <b>técnicos</b> (nivel intermedio, mediano plazo, el «cómo») / <b>operativos</b> (nivel bajo, corto plazo).<br>• <b>Corto</b> (≤1 año) / <b>mediano</b> (1 a 5 años) / <b>largo</b> (>5 años).<br>• <b>Naturales / arbitrarios</b> (el fin natural de la empresa lucrativa es la utilidad; el arbitrario puede ser el prestigio)."},{"h":"¿Quién fija los objetivos?","b":"Los generales y supremos los fijan los <b>dueños o empresarios</b> (señalan «qué debe hacerse»). Al administrador le toca el «cómo» y «ver que se haga»: sugiere ajustes, fija los objetivos particulares y de corto plazo, los jerarquiza y los coordina."},{"h":"Reglas para fijar objetivos","b":"<b>Negativas</b> (evitan «la respuesta correcta a la pregunta equivocada», Drucker): no tomar como objetivo sus <b>síntomas</b>; no confundirlo con <b>uno de sus medios</b>; no tomar como contradictorio lo que solo es <b>contrario</b> (hay grises); buscar semejanzas y diferencias con objetivos parecidos.<br><b>Positivas:</b> oír opiniones diversas (<b>pluralidad en la deliberación, unidad en la decisión</b>); fijarlo <b>por escrito</b>; aplicar las 6 preguntas (qué, cómo, quién, dónde, cuándo, por qué); que sea conocido y querido por todos; que sea <b>estable</b>."}]},{"id":"L33","u":"U3","title":"Planeación (Koontz y Weihrich)","src":"mat","ref":"Koontz y Weihrich, Administración: una perspectiva global, cap. 4","cards":[{"h":"Concepto","b":"Seleccionar <b>misiones y objetivos</b> y las acciones para cumplirlos; requiere <b>tomar decisiones</b>. Es la función administrativa <b>más básica</b> y tiende un puente entre donde estamos y a donde queremos ir.<br>Planeación y control son «<b>hermanos siameses</b>»: los planes proporcionan las normas de control."},{"h":"8 tipos de planes","b":"1) <b>Propósitos o misiones</b>: función o tarea básica.<br>2) <b>Objetivos o metas</b>: fines.<br>3) <b>Estrategias</b>: objetivos básicos de largo plazo, cursos de acción y asignación de recursos.<br>4) <b>Políticas</b>: criterios generales que orientan el <b>pensamiento</b>; dejan discrecionalidad.<br>5) <b>Procedimientos</b>: secuencias cronológicas; guías de <b>acción</b>, no de pensamiento.<br>6) <b>Reglas</b>: acciones u omisiones específicas, <b>sin discrecionalidad</b> («No fumar»).<br>7) <b>Programas</b>: conjunto de metas, políticas, procedimientos, recursos, etc.<br>8) <b>Presupuestos</b>: resultados en <b>términos numéricos</b>, un programa «en cifras»."},{"h":"Declaración de misión","b":"Incluye: valores esenciales, ámbito geográfico, dirección, relaciones con quienes participan y visión de futuro.<br>Pasos: evaluar el perfil pasado y presente → obtener aportaciones → equilibrar intereses → elaborar → discutir y ajustar → comunicar."},{"h":"Los 8 pasos de la planeación","b":"1) <b>Atención a las oportunidades</b> (punto de partida, aunque esté fuera de la planeación en sentido estricto).<br>2) Establecer <b>objetivos</b>.<br>3) Desarrollar <b>premisas</b> (supuestos y pronósticos).<br>4) Determinar <b>cursos alternativos</b>.<br>5) <b>Evaluar</b> alternativas.<br>6) <b>Seleccionar</b> un curso de acción (punto de decisión).<br>7) Formular <b>planes derivados</b>.<br>8) Expresar los planes en cifras: <b>presupuestos</b>.<br>No es lineal sino repetitivo."},{"h":"Objetivos","b":"Deben ser <b>verificables</b>: al final del periodo se puede saber si se cumplieron (¿cuánto? ¿cuándo?). «Obtener utilidades razonables» no es verificable; «12% de rendimiento sobre la inversión al cierre del año fiscal» sí.<br>Forman una <b>jerarquía</b> y una <b>red</b>.<br><b>Áreas de resultados clave (Drucker):</b> posición en el mercado, innovación, productividad, recursos físicos y financieros, rentabilidad, desempeño y desarrollo de gerentes, desempeño y actitud de los trabajadores, y responsabilidad pública (hoy también servicio y calidad)."},{"h":"Treacy y Wiersema","b":"Los líderes de mercado sobresalen en al menos una de 3 disciplinas: <b>excelencia operativa</b> (bajo costo, como Costco o Southwest), <b>liderazgo de producto</b> (innovar más rápido, como Intel) y <b>cercanía con el cliente</b>. Es difícil destacar en las tres."},{"h":"APO: administración por objetivos","b":"Sistema administrativo <b>integral</b> que combina actividades para cumplir con eficacia y eficiencia los objetivos organizacionales e individuales.<br>Evolución: evaluación del desempeño (McGregor) → motivación (estudios de la Universidad de Maryland: las metas específicas superan al «haz tu mejor esfuerzo») → planeación de largo plazo → enfoque de sistemas.<br>Proceso: objetivos preliminares en la cima → precisar funciones → objetivos de los subordinados → <b>reciclamiento</b> (proceso conjunto e interactivo)."},{"h":"Beneficios y deficiencias de la APO","b":"<b>Beneficios:</b> mejor administración orientada a resultados, precisión de funciones y estructura, compromiso personal y controles eficaces.<br><b>Deficiencias:</b> no se enseña su filosofía (autocontrol y autodirección), faltan pautas, es difícil fijar metas verificables, sesgo al <b>corto plazo</b>, inflexibilidad y abuso de metas cuantitativas.<br>Coordinar el corto con el largo plazo: ningún plan de corto plazo debe contradecir el de largo plazo."}]},{"id":"L34","u":"U3","title":"Organización (Reyes Ponce, cap. 9)","src":"mat","ref":"Reyes Ponce, cap. 9","cards":[{"h":"Concepto","b":"De <b>organon</b> (instrumento). Un organismo implica partes y funciones diversas, unidad funcional, coordinación y autoconstrucción.<br>Reyes Ponce: «la <b>estructuración técnica de las relaciones</b> que deben existir entre las funciones, niveles y actividades de los elementos materiales y humanos de un organismo social, con el fin de lograr su máxima eficiencia dentro de los planes y objetivos señalados».<br>Es el <b>último elemento de la mecánica</b> y el enlace entre «lo que debe ser» y «lo que es»."},{"h":"Definiciones de otros autores","b":"<b>Terry:</b> arreglo de funciones con su autoridad y responsabilidad.<br><b>Koontz y O'Donnell:</b> agrupar actividades y coordinar horizontal y verticalmente.<br><b>Petersen y Plowman:</b> método de distribución de autoridad y responsabilidad; canales de comunicación.<br><b>Beechler et al.:</b> estructura de relaciones entre personas, trabajo y recursos.<br><b>Litterer:</b> unidad social con relación estable."},{"h":"Objetivos y función social","b":"<b>Básicos:</b> suplir limitaciones, comunicar valores, lograr la eficacia con la mayor eficiencia.<br><b>Derivados:</b> aumentar capacidades, aprovechar conocimientos acumulados, ahorrar tiempo y favorecer la especialización."},{"h":"Los 5 principios","b":"1) <b>Especialización</b>: cuanto más se divide el trabajo, más eficiencia, precisión y destreza. Riesgo: <b>superespecialización</b>.<br>2) <b>Unidad de mando</b>: para cada función, un solo mando («nadie puede servir a dos señores»; Urwick: un cuerpo de dos cabezas es monstruoso).<br>3) <b>Equilibrio autoridad-responsabilidad</b>: la autoridad baja y la responsabilidad sube por la misma línea.<br>4) <b>Equilibrio dirección-control</b>: a cada grado de delegación, sus controles.<br>5) <b>Definición de puestos</b>: por escrito."},{"h":"Departamentalización","b":"En el primer nivel la división es casi siempre <b>funcional</b> (producción, ventas, finanzas y, hoy, personal).<br>En niveles siguientes: por <b>producto</b>, por <b>territorio</b>, por <b>comprador/cliente</b>, por <b>proceso</b> o por <b>número</b>.<br>Nomenclatura usual: división → departamento → sección → grupo → unidad."},{"h":"Sistemas de organización","b":"<b>Lineal o militar:</b> la autoridad pasa íntegra por una sola línea. (+) sencillo, disciplina, rapidez, ideal para la pequeña empresa; (−) sin especialización, jefes recargados.<br><b>Funcional (Taylor):</b> 8 mayordomos especialistas, cada uno con autoridad en su campo. (+) especialización; (−) <b>duplicidad de mando</b> y fugas de responsabilidad.<br><b>Lineal y staff:</b> línea + asesoría y servicio; es la preferida por las grandes empresas. (−) confusión entre la línea y el staff, roces.<br><b>Por proyectos / matricial:</b> nació en la <b>NASA</b> (Apolo XI); temporal, costosa; en caso de conflicto prevalece el jefe matricial.<br><b>Multidivisional:</b> divisiones cuasiautónomas en corporativos."},{"h":"Staff: asesorar y servir","b":"El staff <b>asesora</b> (investiga, planea, sugiere, convence, instruye, resuelve dudas, revisa) y <b>sirve</b> (realiza tareas a nombre, en beneficio y en representación de la línea).<br>Su autoridad es <b>técnica</b> (convencimiento), no formal: obra con autoridad <b>delegada</b>, no propia."},{"h":"Organigramas","b":"Muestran: división de funciones, niveles jerárquicos, líneas de autoridad, canales formales de comunicación, carácter lineal (línea llena) o staff (línea punteada).<br>Llevan <b>funciones, no personas</b>, y normalmente no incluyen a los trabajadores.<br><b>Verticales</b> (los más usados; efecto de triangulación), <b>horizontales</b> (de izquierda a derecha, reducen la triangulación), <b>circulares</b> (reducen la idea de estatus; difíciles de leer) y <b>escalares</b> (sangrías)."},{"h":"Tramo de control y crecimiento","b":"<b>Crecimiento horizontal:</b> más funciones o jefes sin más niveles → aumenta el tramo de control.<br><b>Crecimiento vertical:</b> más jefes y más niveles → la comunicación se vuelve lenta y se distorsiona.<br><b>Graicunas:</b> las relaciones (directas, cruzadas y de grupo) crecen geométricamente: 1 subordinado = 1 relación; 2 = 6; 3 = 18; 4 = 44; 5 = 100.<br>Factores: capacidad del personal, semejanza de las operaciones, nivel y si hay staff. En general: <b>4 a 8</b> en niveles altos y <b>10 a 20</b> en niveles bajos."},{"h":"Centralización y descentralización","b":"Ni la centralización total ni la descentralización total son posibles: son tendencias.<br><b>Fayol:</b> lo importante es <b>fijar con precisión</b> el grado, adecuarlo a la empresa y mantenerlo <b>estable</b>.<br>Depende de: el tamaño (la pequeña centraliza, la grande descentraliza), la capacidad de los jefes y la cantidad de controles posibles."},{"h":"Puesto y análisis de puestos","b":"<b>Puesto:</b> unidad de trabajo <b>específica e impersonal</b> (un puesto de facturista puede tener 10 facturistas).<br><b>Análisis de puestos</b> = <b>descripción</b> (qué hace: encabezado, descripción genérica y específica; operaciones permanentes, periódicas y eventuales) + <b>especificación</b> (qué requiere: <b>habilidad, esfuerzo, responsabilidad y condiciones de trabajo</b>).<br><b>Carta de distribución de trabajo:</b> grupos de 5 a 15 personas; horas por semana."},{"h":"Comités","b":"Conjunto de personas que se reúnen para deliberar, decidir o ejecutar en común.<br>Clases: <b>consultivos</b> (opinan, no deciden), <b>decisorios</b> (limitan la autoridad; deciden por mayoría), <b>ejecutivos</b> y <b>de investigación</b>.<br>Inconvenientes: costo en tiempo y dinero, transacciones mediocres, dominio de un líder o tiranía de una minoría y pérdida de la responsabilidad individual.<br>No conviene usarlos como ejecutores. Ejemplo: <b>General Motors</b>."},{"h":"Complejidad y burocracia","b":"<b>Complejidad organizacional:</b> causas: <b>diferenciación horizontal</b> (subdivisión de tareas), <b>vertical</b> (número de niveles) y <b>dispersión espacial</b>. Efectos: exige más descentralización, más preparación, más comunicación y control, y genera más incertidumbre y conflicto.<br><b>Burocracia</b> (bureau + kratos): forma más eficiente para organizaciones grandes según Weber; Merton advierte el apego rígido a las reglas."}]},{"id":"L35","u":"U3","title":"Estructura y diseño organizacional; Mintzberg","src":"mat","ref":"Ivancevich cap. 16; Lazear y Gibbs; Rodríguez Valencia; Mintzberg cap. 11","cards":[{"h":"Estructura organizacional","b":"Rodríguez Valencia: la «<b>anatomía</b>» de la organización: la armazón de puestos, reglas, autoridad y procesos que regula la conducta y <b>reduce la incertidumbre</b>.<br>Modelo sistémico: entradas (humanos, financieros, materiales) → conversión (tecnológica, administrativa, social) → salidas (bienes, servicios, rentabilidad)."},{"h":"Interdependencia de tareas (Thompson)","b":"<b>Común (mancomunada):</b> las unidades comparten pertenencia, pero operan con autonomía.<br><b>Lineal (secuencial):</b> una tarea debe terminar para que inicie la siguiente.<br><b>Recíproca:</b> intercambio bidireccional; las salidas de una son los insumos de la otra."},{"h":"4 decisiones de diseño","b":"1) <b>División del trabajo</b> (grado de especialización).<br>2) <b>Delegación de autoridad</b> (centralizada vs. descentralizada).<br>3) <b>Departamentalización</b> (homogénea/funcional vs. heterogénea/divisional).<br>4) <b>Tramo de control</b> (estrecho → estructura alta; amplio → estructura plana)."},{"h":"Dimensiones estructurales","b":"<b>Formalización:</b> grado en que las reglas y los manuales están escritos e impuestos.<br><b>Centralización:</b> dónde está el poder de decisión.<br><b>Complejidad (diferenciación):</b> horizontal (variedad de departamentos) y vertical (número de niveles)."},{"h":"Funcional vs. divisional","b":"<b>Funcional:</b> agrupa por especialidad. (+) economías de escala y eficiencia técnica; (−) coordinación difícil y visión de «túnel» o silos.<br><b>Divisional:</b> agrupa por producto, cliente, región o tecnología; las unidades son centros de utilidades. (+) adaptación al mercado; (−) <b>duplicación de recursos</b>.<br><b>Modularidad</b> (Lazear y Gibbs): «poco acoplamiento y mucha cohesión»."},{"h":"Diseños avanzados","b":"<b>Matricial:</b> mando dual (jefe funcional + gerente de proyecto).<br><b>Reticular (red/virtual):</b> socios externos conectados electrónicamente, subcontratación.<br><b>Ilimitada (sin fronteras):</b> elimina barreras y cadenas de mando; usa equipos autodirigidos y alianzas."},{"h":"Mecanicista vs. orgánico","b":"<b>Mecanicista</b> (Fayol, Weber, Sistema 1 de Likert): eficiencia, alta especialización, centralización, formalización rígida (ejemplo: UPS).<br><b>Orgánico</b> (Likert Sistema 4, Schein): para entornos dinámicos; descentralizado, informal, equipos autodirigidos, polivalencia."},{"h":"Coordinación (Lazear y Gibbs)","b":"Dos problemas: <b>sincronización</b> (armonizar ritmos; no requiere comunicación estrecha) e <b>integración</b> (combinar conocimientos dispersos para decidir).<br>Mecanismos: presupuestos centralizados, procedimientos estándar, cultura, gerentes de enlace y rotación de puestos.<br><b>Estructura plana:</b> decide rápido, pero exige empleados capacitados. <b>Estructura alta:</b> más control, pero más costos y distorsión."},{"h":"Mintzberg: centralización y descentralización","b":"<b>Centralizada:</b> todo el poder en un punto (un solo individuo). Es el medio <b>más preciso para coordinar</b> decisiones.<br>¿Por qué descentralizar? Porque no todo se entiende en un solo centro, por las <b>limitaciones cognoscitivas</b> y para reaccionar rápido a las condiciones locales. El error más frecuente de diseño es <b>centralizar</b> en exceso (Jay, 1970).<br>Tres usos del término: <b>vertical</b> (dispersión del poder hacia abajo por la línea), <b>horizontal</b> (poder que pasa de los directivos a analistas y especialistas) y <b>dispersión física</b> de servicios."}]},{"id":"L36","u":"U3","title":"Cultura organizacional (Ivancevich, cap. 2)","src":"mat","ref":"Ivancevich, Konopaske y Matteson (2006), cap. 2, partes 1 y 2","cards":[{"h":"Cultura nacional y valores","b":"<b>Cultura nacional:</b> la suma de creencias, rituales, reglas, costumbres, artefactos e instituciones de una población.<br><b>Valores:</b> deseos o necesidades afectivas conscientes que guían la conducta.<br>Nadie llega a la empresa «neutral»: trae su «<b>software mental</b>» (Hofstede)."},{"h":"Dimensiones de Hofstede y Bond","b":"1) <b>Distancia del poder</b> (aceptación de la desigualdad; alta → centralización).<br>2) <b>Evasión de la incertidumbre</b> (alta → reglas estrictas, poco riesgo).<br>3) <b>Individualismo vs. colectivismo</b>.<br>4) <b>Masculinidad vs. feminidad</b> (asertividad y materialismo vs. relaciones y calidad de vida).<br>5) <b>Orientación al largo plazo</b> (aportada por <b>Bond</b>)."},{"h":"Definición de Schein","b":"Un patrón de <b>premisas básicas</b>, inventadas, descubiertas o desarrolladas por un grupo al aprender a enfrentar problemas de <b>adaptación externa e integración interna</b>, que ha funcionado lo bastante bien para considerarse válido y <b>enseñarse a los nuevos miembros</b>."},{"h":"Las 3 capas de Schein","b":"I) <b>Artefactos y creaciones</b>: visibles, pero no siempre descifrables (documentos, mobiliario, jerga, tecnología).<br>II) <b>Valores</b>: mayor grado de conciencia (lealtad, compromiso, equidad).<br>III) <b>Premisas básicas</b>: invisibles, preconscientes, se dan por hecho (relación con el entorno, la naturaleza humana, el tiempo).<br>Analogía: fachada, planos y cimientos."},{"h":"Cultura fuerte vs. débil","b":"<b>Fuerte:</b> la mayoría comparte los valores centrales; da coherencia sin burocracia excesiva (Toyota, Southwest, Disney).<br><b>Débil:</b> poca alineación; hay que imponer reglas y supervisión rígida.<br>Disney: cosas, frases, comportamientos y sentimientos compartidos. Credos: Johnson & Johnson, The Body Shop, Ben & Jerry's."},{"h":"Creación y evolución","b":"Una cultura <b>no se decreta</b> con un folleto (caso de la empresa electrónica de California: cinismo, rotación y quiebra).<br><b>Schein:</b> evoluciona por presiones externas, fuerzas internas, respuestas a sucesos cruciales y factores fortuitos.<br>Cultura cohesiva (HIPI): sentido de <b>H</b>istoria, <b>I</b>dentidad, <b>P</b>ertenencia e <b>I</b>ntercambio."},{"h":"Cambio cultural: Mainiero y Tromley","b":"5 puntos de intervención: 1) <b>comportamiento</b> (acción antes que discurso), 2) <b>justificaciones</b> del comportamiento (entender su valor), 3) <b>mensajes culturales</b> (relatos, rituales, reconocimientos), 4) <b>contratación y socialización</b> de quienes encajan, 5) <b>eliminación</b> de quienes se desvían."},{"h":"Socialización (Pascale, Van Maanen)","b":"Transmitir valores y premisas a los nuevos para un ajuste mutuo.<br>1) <b>Anticipada</b>: antes de ingresar; expectativas realistas.<br>2) <b>Adaptación (encuentro)</b>: aprender la tarea, aclarar el rol, integrarse al grupo.<br>3) <b>Gestión de la función</b>: conflicto trabajo-vida personal; compromiso y retención."},{"h":"Mentoring (Kathy Kram)","b":"Funciones: <b>profesionales</b> (patrocinio, formación, tareas desafiantes, visibilidad) y <b>psicosociales</b> (asesoría, amistad, aceptación, modelado).<br>Fases: <b>iniciación</b> (6 meses a 1 año), <b>cultivo</b> (2 a 5 años), <b>separación</b> (6 meses a 2 años) y <b>redefinición</b> (indefinida; amistad entre pares)."},{"h":"Diversidad y espiritualidad","b":"<b>Dimensiones medulares</b> (innatas): edad, origen étnico, género, atributos físicos, raza, orientación sexual. <b>Secundarias</b> (adquiridas o modificables): educación, estado civil, creencias religiosas, experiencia laboral.<br><b>Espiritualidad ≠ religión</b>: la espiritualidad laboral reconoce una vida interior alimentada por un trabajo significativo (Mitroff y Denton). Cinco modelos: de recuperación, evolucionistas, socialmente responsables, basadas en valores y religiosas. Ejemplo: Cirque du Soleil."}]},{"id":"L37","u":"U3","title":"Dirección (Reyes Ponce, cap. 11)","src":"mat","ref":"Reyes Ponce, cap. 11","cards":[{"h":"Concepto e importancia","b":"De <i>dirigere</i> (di + regere: regir). Es el elemento en que se logra la <b>realización efectiva de lo planeado</b> mediante la autoridad, ejercida con decisiones (tomadas directamente o delegadas), vigilando que se cumplan las órdenes.<br>Es la <b>esencia y el corazón</b> de la administración: es lo más real y humano y lo más imprevisible.<br>«<b>No se coordina para dirigir; se dirige para coordinar</b>»."},{"h":"Fases","b":"Delegación, autoridad, comunicación y supervisión (se exponen en el orden comunicación → autoridad → delegación → supervisión).<br>Términos de otros autores: Terry la llama <b>actuación</b>; Koontz y O'Donnell, «guiar y vigilar a los subordinados»; Barnard, coordinar los esfuerzos del sistema cooperativo."},{"h":"Principios de la dirección","b":"1) <b>Coordinación de intereses</b> (lograr el fin común armonizando los intereses de grupo e individuales).<br>2) <b>Impersonalidad del mando</b> (la orden nace de la situación, no del capricho del jefe).<br>3) <b>Vía jerárquica</b> (respetar los conductos; saltarlos solo de forma excepcional, explicándolo).<br>4) <b>Resolución de conflictos</b> (lo antes posible).<br>5) <b>Aprovechamiento del conflicto</b> (Follett: dominación, compromiso o <b>integración</b>)."},{"h":"Comunicación: sistema nervioso","b":"De <i>cum munus</i> (don compartido). Proceso por el que conocimientos, tendencias y sentimientos son <b>conocidos y aceptados</b> por otros.<br><b>Elementos:</b> fuente, receptor, canal, contenido, respuesta (retroalimentación) y ambiente.<br><b>Especies:</b> formal/informal (la informal es más rápida y difusiva), individual/genérica, imperativa/exhortativa/informativa, oral/escrita/gráfica, vertical (descendente y ascendente)/horizontal."},{"h":"Principios de la comunicación","b":"<b>Responsabilidad</b> (es de quien la origina) · <b>Adaptación</b> (al receptor, no a la fuente) · <b>Efectividad</b> (el canal más eficaz) · <b>Bilateralidad</b> (respuesta completa) · <b>Integridad</b> (sin distorsión) · <b>Circunstancialidad</b> (el ambiente condiciona) · debe revisarse constantemente · es siempre un <b>medio</b>."},{"h":"Barreras de la comunicación","b":"<b>Semánticas</b> (palabras vagas o ambiguas) · <b>Psicológicas</b> (turbación, irritación) · <b>Sociológicas</b> (antipatías, suspicacia sindicato-empresa) · <b>Culturales</b> (distinto nivel de preparación) · <b>Administrativas</b> (canales largos, papeleo) · <b>Fisiológicas</b> (audición, expresión) · <b>Físicas</b> (ruido, aparatos)."},{"h":"Autoridad y mando","b":"<b>Autoridad:</b> la facultad para tomar <b>decisiones que produzcan efectos</b>. <b>Mando:</b> «la autoridad puesta en acto».<br>Origen inmediato: el <b>convenio</b> (con la propiedad y el régimen socioeconómico detrás).<br><b>Jurídica</b> (por obligación): <b>formal</b> (lineal o funcional) y <b>operativa</b> (sobre actos, no sobre personas).<br><b>Moral</b> (por convencimiento): <b>técnica</b> (prestigio y conocimientos; sostiene al staff) y <b>personal</b> (cualidades; equivale al liderazgo)."},{"h":"Elementos y formas del mando","b":"Elementos: determinar <b>qué</b> hacer (directiva, Consejo), <b>cómo</b> hacerlo (administrativa/ejecutiva) y <b>vigilar</b> que se haga (supervisora). Urwick los compara con los poderes Legislativo, Ejecutivo y Judicial.<br><b>Orden:</b> cambio de una situación particular y concreta (Pigors: emisión, ejecución, verificación).<br><b>Instrucción:</b> norma para casos repetidos; conviene darla <b>por escrito</b>.<br>De lo general a lo particular: políticas (manuales) → reglas (reglamentos) → instrucciones (instructivos) → órdenes."},{"h":"Influencia: poder, motivación y liderazgo","b":"<b>Poderes:</b> jurídico, físico, económico, social, cultural, carismático y <b>moral</b> (la esencia de la autoridad).<br><b>Barnard</b>, para que la autoridad sea efectiva: legitimidad, congruencia, conveniencia y capacidad.<br><b>Motivos:</b> racionales/emocionales, egocéntricos/altruistas, de atracción/rechazo; <b>Maslow</b>. El motivo económico es básico por su convertibilidad, pero no es decisivo."},{"h":"Liderazgo","b":"De <i>to lead</i>. Teorías: de <b>rasgos</b> (lo que el líder es) y <b>situacional</b> (lo que el líder hace).<br>Rasgos según <b>Kast</b>: inteligencia práctica, madurez social, motivación interna y actitud de relaciones humanas.<br><b>White y Lippitt:</b> autoritario, <b>democrático</b> y laissez-faire (para Reyes Ponce, este último ya no es liderazgo).<br>Hay un continuo de flexibilidad entre el uso de la autoridad por el líder y la libertad de los subordinados."},{"h":"Decisiones","b":"Son la «<b>llave final</b>» del proceso. Enfoques decisivos: <b>psicológico</b> (motivos) y <b>económico</b> (maximizar).<br>Pasos: identificar el problema («problema bien planteado, problema medio resuelto») → información → plantear y ponderar alternativas → eliminarlas por valor decreciente → decisiones complementarias → controlar los resultados.<br>Tipos: <b>estratégicas/fundamentales</b> y <b>tácticas/rutinarias</b>."},{"h":"Auxiliares técnicos del mando","b":"<b>Disciplina positiva</b> (Follett: «autocontrol organizado»; normas claras, impedir físicamente la violación, participación, explicar el porqué, estabilidad) · <b>recompensas</b> · <b>disciplina negativa</b> (el menos recomendable: sin lesionar la dignidad, impersonal, medicinal, gradual) · <b>calificación de méritos</b> (comparación, escalas, listas verificables) · <b>sugerencias</b> · <b>quejas</b> · <b>entrevista</b>."},{"h":"Quejas","b":"<b>Momentos:</b> insatisfacción → queja → <b>agravio</b> (cuando la queja no se resolvió con justicia o no se oye).<br><b>Tipos:</b> objetivas (hechos comprobables), subjetivas (la apreciación del quejoso; las más numerosas) y mixtas.<br>Hay que resolverlas pronto, pero no por la primera impresión; la mejor resolución es la del <b>primer paso</b>."},{"h":"Delegación y supervisión","b":"<b>Delegar:</b> comunicar a otro parte de nuestra autoridad, <b>compartiendo la responsabilidad</b>. (+) liberar al jefe de detalles, especialización y decisiones más reales; (−) riesgos, <b>debilita el control</b> (su mayor desventaja), divide el mando y reduce la uniformidad.<br><b>Delegación → causa; descentralización → efecto. Desconcentración</b> = delegación con separación geográfica.<br><b>Supervisión:</b> «ver sobre»; es <b>simultánea</b> a la ejecución (el control es <b>posterior</b>). Reglas: unidad del cuerpo administrativo, doble preparación (técnica y de jefe) y fortalecer la autoridad del supervisor."}]},{"id":"L38","u":"U3","title":"Control (Koontz y Weihrich, cap. 18)","src":"mat","ref":"Koontz y Weihrich, cap. 18","cards":[{"h":"Concepto","b":"<b>Medición y corrección del desempeño</b> para garantizar el cumplimiento de los objetivos y los planes.<br>Planeación y control son las «<b>hojas de la misma tijera</b>»: sin planes, el control es imposible.<br>Es función de <b>todos</b> los administradores, desde el presidente hasta los supervisores."},{"h":"Proceso básico (3 pasos)","b":"1) <b>Establecer normas</b> (criterios de desempeño; las mejores son las metas verificables).<br>2) <b>Medir el desempeño</b> (idealmente con previsión, antes de que ocurra la desviación).<br>3) <b>Corregir las desviaciones</b>: replanear, reorganizar, cambiar la integración de personal o dirigir mejor. Es el punto que conecta el control con las demás funciones."},{"h":"Puntos críticos y tipos de normas","b":"<b>Principio de control de puntos críticos:</b> prestar atención a los factores críticos (limitantes, o que indican mejor si los planes funcionan).<br>Normas: <b>físicas</b> (no monetarias: horas-hombre por unidad), <b>de costos</b>, <b>de capital</b> (balance general; rendimiento de la inversión), <b>de ingresos</b> (ventas), <b>de programas</b>, <b>intangibles</b> (lealtad, aptitud), <b>metas como normas</b> y <b>planes estratégicos</b> como puntos de control."},{"h":"Benchmarking","b":"Fijar metas con base en las <b>mejores prácticas</b>, aunque sean de <b>otra industria</b> (si alguien surte pedidos en 4 días, esa es la referencia).<br>Tipos: <b>estratégico</b> (estrategias), <b>operativo</b> (costos y diferenciación) y <b>administrativo</b> (funciones de apoyo).<br>Pasos: qué comparar → a quién → datos → metas → medir periódicamente."},{"h":"Control como retroalimentación","b":"Como el <b>termostato</b>: medir el desempeño real → compararlo con las normas → identificar desviaciones → analizar sus causas → programar la acción correctiva → implementarla.<br>La información en <b>tiempo real</b> NO garantiza un control en tiempo real: los <b>rezagos</b> en el análisis y la corrección son inevitables."},{"h":"Control anticipante (feedforward)","b":"También llamado <b>control preliminar o de dirección</b>. Vigila los <b>insumos</b> para corregir <b>antes</b> de que se afecten los resultados (como el conductor que acelera antes de la subida o el cazador que apunta delante del pato).<br>La retroalimentación simple es casi un «aviso <b>postmortem</b>».<br>Requisitos: analizar el sistema, modelarlo, actualizarlo, recolectar datos, evaluar las variaciones y <b>actuar</b>. Hay que vigilar las «<b>perturbaciones</b>» no previstas."},{"h":"Requisitos de controles eficaces","b":"Ajustarse a los <b>planes y puestos</b>, a cada <b>administrador</b> en lo individual (que sea comprensible: más vale 80% de un sistema tosco que 0% de uno perfecto), señalar <b>excepciones en puntos críticos</b>, ser <b>objetivos</b>, ser <b>flexibles</b> (presupuesto variable), ajustarse a la <b>cultura organizacional</b>, ser <b>económicos</b> y conducir a <b>acciones correctivas</b>."},{"h":"Control en compañías internacionales","b":"Las normas deben ajustarse a las condiciones locales; los precios de transferencia, la inflación y las fluctuaciones monetarias distorsionan las mediciones. En Japón la <b>presión de los compañeros</b> es un medio eficaz de control."}]},{"id":"L41","u":"U4","title":"Áreas funcionales","src":"gen","ref":"Programa 2127, unidad 4; Münch; Chiavenato","cards":[{"h":"¿Qué son?","b":"Agrupaciones de funciones especializadas a través de las cuales se cumplen los objetivos. Las básicas: <b>recursos humanos, finanzas, mercadotecnia y operaciones (producción)</b>.<br>El proceso administrativo (planear, organizar, dirigir, controlar) se aplica en <b>cada</b> área. Reyes Ponce: las funciones básicas son producción, ventas y finanzas, y hoy se añade personal."},{"h":"Recursos humanos","b":"<b>Objetivo:</b> contar con el personal adecuado, en el lugar y el momento adecuados, desarrollarlo y mantenerlo satisfecho y productivo.<br><b>Subfunciones:</b> reclutamiento, selección, contratación, <b>inducción</b>, capacitación y desarrollo, evaluación del desempeño, sueldos y salarios (compensaciones), relaciones laborales, higiene y seguridad, servicios y prestaciones, planeación de personal.<br><b>Reclutamiento</b> = atraer candidatos (interno/externo). <b>Selección</b> = elegir al más idóneo."},{"h":"Finanzas","b":"<b>Objetivo:</b> obtener los recursos financieros y aplicarlos de forma óptima (liquidez, solvencia, rentabilidad; maximizar el valor de la empresa).<br><b>Subfunciones:</b> contabilidad (general y de costos), tesorería, presupuestos, crédito y cobranza, financiamiento, inversiones, impuestos (fiscal), auditoría, análisis financiero.<br><b>Decisiones clave:</b> de inversión (en qué), de financiamiento (de dónde) y de dividendos."},{"h":"Mercadotecnia","b":"<b>Objetivo:</b> identificar y satisfacer las necesidades del cliente de forma rentable, creando valor.<br><b>Subfunciones:</b> investigación de mercados, planeación y desarrollo del producto, precio, distribución (plaza), promoción y publicidad, ventas, servicio al cliente.<br><b>Mezcla de mercadotecnia (4P, McCarthy):</b> producto, precio, plaza y promoción."},{"h":"Operaciones / producción","b":"<b>Objetivo:</b> transformar insumos en bienes o servicios con calidad, costo y oportunidad.<br><b>Subfunciones:</b> ingeniería del producto, ingeniería de planta, ingeniería industrial (métodos, tiempos), planeación y control de la producción, abastecimiento y compras, inventarios y almacén, control de calidad, mantenimiento.<br>Herramientas: justo a tiempo (JIT), MRP, control estadístico de procesos, Lean."},{"h":"Interrelación de áreas","b":"Ventas promete → operaciones produce → finanzas financia → RH aporta al personal. Si no se coordinan aparecen los <b>silos</b> (caso Logística & Servicios Alfa: ventas prometía fechas imposibles).<br>Otras áreas frecuentes: sistemas/TI, jurídico, investigación y desarrollo (I+D), compras."}]},{"id":"L51","u":"U5","title":"Pensamiento estratégico","src":"gen","ref":"Programa 2127, unidad 5; Hitt; Koontz","cards":[{"h":"Importancia","b":"Permite anticiparse al cambio, ver la organización como un todo frente a su entorno y crear una <b>ventaja competitiva sostenible</b>.<br>Diferencia: el <b>pensamiento estratégico</b> es creativo, intuitivo y sintetiza (¿qué podríamos ser?); la <b>planeación estratégica</b> es analítica y formal (cómo llegar)."},{"h":"Características (Liedtka)","b":"1) <b>Perspectiva sistémica</b> (ve el todo). 2) <b>Enfocado en la intención</b> (visión y propósito). 3) <b>Pensamiento en el tiempo</b> (une pasado, presente y futuro). 4) <b>Guiado por hipótesis</b> (formula y prueba). 5) <b>Oportunismo inteligente</b> (aprovecha las oportunidades que surgen).<br>Además: orientado al largo plazo, creativo, flexible y con visión del entorno."},{"h":"Misión, visión, valores","b":"<b>Misión:</b> razón de ser actual (qué hacemos, para quién, cómo).<br><b>Visión:</b> lo que queremos llegar a ser en el futuro.<br><b>Valores:</b> principios que guían la conducta.<br><b>Estrategia</b> (Koontz): objetivos básicos de largo plazo + cursos de acción + asignación de recursos."},{"h":"FODA (SWOT)","b":"<b>Internas</b> (controlables): <b>F</b>ortalezas y <b>D</b>ebilidades.<br><b>Externas</b> (no controlables): <b>O</b>portunidades y <b>A</b>menazas.<br>Matriz de estrategias: FO (ofensivas), DO (reorientación), FA (defensivas) y DA (supervivencia)."},{"h":"Ventaja competitiva (Porter)","b":"<b>Estrategias genéricas:</b> <b>liderazgo en costos</b>, <b>diferenciación</b> y <b>enfoque</b> (en un nicho).<br><b>5 fuerzas:</b> rivalidad entre competidores, amenaza de nuevos entrantes, amenaza de sustitutos, poder de negociación de los proveedores y poder de negociación de los clientes.<br><b>Cadena de valor:</b> actividades primarias y de apoyo.<br>Una ventaja es sostenible si es valiosa, rara, difícil de imitar y bien organizada (modelo VRIO)."},{"h":"Niveles de la estrategia","b":"<b>Corporativa</b> (en qué negocios estar), <b>de negocio</b> (cómo competir en cada uno) y <b>funcional</b> (cómo contribuye cada área). Se relaciona con los objetivos estratégicos, técnicos y operativos de Reyes Ponce."}]},{"id":"L61","u":"U6","title":"Derechos humanos y perspectiva de género","src":"gen","ref":"Programa 2127, unidad 6; CPEUM; ONU","cards":[{"h":"Derechos humanos","b":"Derechos inherentes a toda persona por su dignidad. Principios (art. 1° constitucional, reforma de <b>2011</b>): <b>universalidad, interdependencia, indivisibilidad y progresividad</b>.<br>El art. 1° prohíbe la discriminación (origen étnico, género, edad, discapacidad, condición social, salud, religión, preferencias sexuales, estado civil, etc.)."},{"h":"Empresas y derechos humanos","b":"<b>Principios Rectores de la ONU sobre las Empresas y los Derechos Humanos (2011)</b> («Principios Ruggie»): <b>proteger</b> (deber del Estado), <b>respetar</b> (responsabilidad de las empresas) y <b>remediar</b> (acceso a mecanismos de reparación).<br>Debida diligencia: identificar, prevenir, mitigar y rendir cuentas sobre los impactos."},{"h":"Sexo, género y perspectiva de género","b":"<b>Sexo:</b> características biológicas. <b>Género:</b> roles, conductas y atributos construidos socialmente.<br><b>Perspectiva
