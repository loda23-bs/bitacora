<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Historial de servicio de tu auto.">
<title>Historial de tu auto</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EDF0F1; --surface:#FFFFFF; --ink:#15191C; --muted:#5A646B; --line:#D2D8DC;
  --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FBE7DB; --ok:#1F7A4D; --danger:#B42318;
  --plate-bg:#FBFBF8; --plate-ink:#111417; --plate-band:#7B2350; --wa:#1E8A4C; --wa-ink:#FFFFFF;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1214; --surface:#181C1F; --ink:#E8ECEE; --muted:#9AA4AB; --line:#2B3236;
  --accent:#F0793A; --accent-ink:#1B0D05; --accent-soft:#3A2216; --ok:#4CC38A; --danger:#F97066;
  --wa:#3CC97A; --wa-ink:#05200F; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px} h2{font-size:24px} h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:10px;padding-block:18px 12px;border-bottom:2px solid var(--ink)}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.shop-name{font-size:28px;text-transform:uppercase;letter-spacing:.02em}
.sel{user-select:all}
.mode{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 8px;border-radius:4px;background:var(--ink);color:var(--bg)}
.btn{font:inherit;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:8px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.small{font-size:13px;padding:6px 10px;border-width:1px}
.btn.link{border:none;padding:4px 0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink);align-self:flex-start}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
form.stack{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;border:1px dashed var(--muted);background:transparent;color:var(--ink);cursor:pointer}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.tag.late{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.private{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.private::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--muted);margin-right:5px;vertical-align:1px}
.msg{padding:11px 14px;border-radius:8px;font-weight:500;border:1px solid var(--line);background:var(--surface)}
.msg.ok{border-color:var(--ok);color:var(--ok)}
.msg.err{border-color:var(--danger);color:var(--danger)}
.note{font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.plate{display:inline-flex;flex-direction:column;align-items:center;background:var(--plate-bg);color:var(--plate-ink);
  border:3px solid var(--plate-ink);border-radius:10px;padding:2px 18px 6px;box-shadow:inset 0 0 0 3px var(--plate-bg),inset 0 0 0 4.5px var(--plate-ink);max-width:100%}
.plate-band{font-size:10px;font-weight:700;letter-spacing:.3em;color:var(--plate-band);padding-top:4px}
.plate-num{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;letter-spacing:.06em;overflow-wrap:anywhere;text-align:center}
.mini-plate{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.05em;background:var(--plate-bg);color:var(--plate-ink);
  border:2px solid var(--plate-ink);border-radius:5px;padding:1px 8px;white-space:nowrap}
.car-head{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.vehicle{font-size:17px;font-weight:600}
.sticker{background:var(--surface);border:2px dashed var(--accent);border-radius:14px;overflow:hidden}
.sticker-head{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);padding:8px 14px}
.sticker-head span:first-child{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.06em}
.sticker-body{padding:14px;display:flex;flex-direction:column;gap:10px}
.sticker-date{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1}
.sticker-ago{font-size:13px;font-weight:600;color:var(--accent)}
.sticker-what{font-size:17px;font-weight:600;white-space:pre-line}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted);font-weight:500}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.price{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{border-top:2px solid var(--ink);padding-top:6px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist-item{display:flex;flex-direction:column;gap:4px;padding:14px 0 14px 18px;border-left:2px solid var(--line);position:relative}
.hist-item::before{content:"";position:absolute;left:-6px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.hist-item:first-child::before{background:var(--accent);border-color:var(--accent)}
.hist-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hist-date{font-weight:700}
.hist-top .price{margin-left:auto}
.hist-what{font-weight:600;white-space:pre-line}
.hist-meta{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-line}
.next{display:flex;flex-direction:column;gap:8px;padding:14px;border:1.5px solid var(--ink);border-radius:12px;background:var(--surface)}
.next-main{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.next-date,.next-km{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1}
.due{align-self:flex-start;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.due.ok{color:var(--ok)} .due.soon{color:var(--accent)} .due.late{color:var(--danger)}
.wa-box{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;padding-top:10px}
@media (prefers-reduced-motion: no-preference){.sticker{animation:pop .35s ease-out both}@keyframes pop{from{transform:translateY(6px)}to{transform:none}}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ================== CONFIGURACIÓN ==================
// Copia estos dos datos de Supabase → Project Settings → API.
const SUPABASE_URL      = 'https://zjqkllhnwaxeznskyvok.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qxicgEPIwS7hlVfJD7YbCQ_l2ulIa9R';
// ====================================================

/* ---------- utilidades compartidas ---------- */
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MXN=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function today(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function fdate(iso){if(!iso)return '';const a=String(iso).slice(0,10).split('-').map(Number);return a[2]+' '+MES[a[1]-1]+' '+a[0];}
function daysTo(iso){const a=String(iso).slice(0,10).split('-').map(Number),t=new Date();
  return Math.round((Date.UTC(a[0],a[1]-1,a[2])-Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))/864e5);}
function ago(iso){const n=-daysTo(iso);if(n<0)return 'fecha futura';if(n===0)return 'hoy';if(n===1)return 'ayer';
  if(n<60)return 'hace '+n+' días';if(n<730)return 'hace '+Math.round(n/30.4)+' meses';return 'hace '+Math.round(n/365)+' años';}
function dueTxt(n){if(n<0)return 'Vencido hace '+(n===-1?'1 día':(-n)+' días');if(n===0)return 'Toca hoy';if(n===1)return 'Toca mañana';
  if(n<60)return 'En '+n+' días';return 'En '+Math.round(n/30.4)+' meses';}
function dueClass(n){return n<0?'late':n<=14?'soon':'ok';}
function addMonths(iso,m){const a=iso.split('-').map(Number),d=new Date(a[0],a[1]-1+m,a[2]);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function money(v){return (v===null||v===undefined||v===''||isNaN(v))?'—':MXN.format(Number(v));}
function kmf(v){return (v===''||v==null||isNaN(v))?'':Number(v).toLocaleString('es-MX')+' km';}
function folio(n){return 'Orden #'+String(n).padStart(4,'0');}
function vehicle(c){return [c.marca,c.modelo,c.anio].filter(Boolean).join(' ')+(c.color?' · '+c.color:'');}
function plateHtml(placas){return '<div class="plate"><span class="plate-band">PLACAS</span><span class="plate-num">'+esc(placas)+'</span></div>';}
function waLink(numero,placas){let d=String(numero||'').replace(/\D/g,'');if(d.length===10)d='52'+d;if(!d)return '';
  return 'https://wa.me/'+d+'?text='+encodeURIComponent('Hola, quiero agendar un servicio para mi auto con placas '+placas+'.');}
function nextHtml(s){
  if(!s||!(s.prox_fecha||s.prox_km))return '';
  const n=s.prox_fecha?daysTo(s.prox_fecha):null;
  return '<section class="next" aria-label="Próximo servicio"><p class="eyebrow">Próximo servicio</p><div class="next-main">'+
    (s.prox_fecha?'<span class="next-date">'+fdate(s.prox_fecha)+'</span>':'')+
    (s.prox_fecha&&s.prox_km?'<span class="muted">o a los</span>':'')+
    (s.prox_km?'<span class="next-km">'+kmf(s.prox_km)+'</span>':'')+'</div>'+
    (n!==null?'<span class="due '+dueClass(n)+'">'+dueTxt(n)+'</span>':'')+
    (s.prox_fecha&&s.prox_km?'<p class="hint">Lo que ocurra primero.</p>':'')+'</section>';
}
/* priv = {precio, cliente} solo en el panel del dueño */
function stickerHtml(s,priv){
  return '<section class="sticker" aria-label="Último servicio"><div class="sticker-head"><span>Último servicio</span><span class="mono">'+folio(s.folio)+'</span></div>'+
    '<div class="sticker-body"><div><div class="sticker-date">'+fdate(s.fecha)+'</div><div class="sticker-ago">'+ago(s.fecha)+'</div></div>'+
    '<p class="sticker-what">'+esc(s.servicio)+'</p><dl class="kv">'+
    (s.km!=null?'<dt>Kilometraje</dt><dd class="price">'+kmf(s.km)+'</dd>':'')+
    (s.aceite?'<dt>Aceite</dt><dd>'+esc(s.aceite)+'</dd>':'')+
    (s.filtros?'<dt>Filtros</dt><dd>'+esc(s.filtros)+'</dd>':'')+
    (s.refacciones?'<dt>Refacciones</dt><dd>'+esc(s.refacciones)+'</dd>':'')+
    (s.mecanico?'<dt>Mecánico</dt><dd>'+esc(s.mecanico)+'</dd>':'')+
    (priv?'<dt>Precio</dt><dd class="price">'+money(priv.precio)+'</dd><dt>Cliente</dt><dd>'+esc(priv.cliente||'—')+'</dd>':'')+
    '</dl></div></section>';
}
/* extra(s) agrega precio y botones en el panel del dueño */
function histHtml(list,owner,extra){
  if(!list.length)return '';
  return '<section class="stack"><h2>Historial</h2><ol class="hist">'+list.map(s=>{
    const meta=[];
    if(s.km!=null)meta.push('Kilometraje: '+kmf(s.km));
    if(s.aceite)meta.push('Aceite: '+s.aceite);
    if(s.filtros)meta.push('Filtros: '+s.filtros);
    if(s.refacciones)meta.push('Refacciones: '+s.refacciones);
    if(s.mecanico)meta.push('Mecánico: '+s.mecanico);
    if(owner&&s.cliente)meta.push('Cliente: '+s.cliente);
    return '<li class="hist-item"><div class="hist-top"><span class="hist-date">'+fdate(s.fecha)+'</span><span class="mono muted">'+folio(s.folio)+'</span>'+
      (owner?'<span class="price">'+money(s.precio)+'</span>':'')+'</div><p class="hist-what">'+esc(s.servicio)+'</p>'+
      (meta.length?'<p class="hist-meta">'+esc(meta.join('\n'))+'</p>':'')+(extra?extra(s):'')+'</li>';
  }).join('')+'</ol></section>';
}

/* ---------- página de clientes: solo lectura ---------- */
const app=document.getElementById('app');
function page(inner,tallerNombre,tel){
  app.innerHTML='<div class="wrap"><header class="top"><div><p class="eyebrow">Bitácora de servicio</p><h1 class="shop-name">'+esc(tallerNombre||'Historial de tu auto')+'</h1>'+
    (tel?'<p class="muted">Tel. <span class="sel">'+esc(tel)+'</span></p>':'')+'</div></header>'+inner+
    '<p class="foot">'+(tallerNombre?'Historial de servicio de '+esc(tallerNombre):'Bitácora QR')+'</p></div>';
}
function waHtml(t,placas){
  const l=waLink(t.whatsapp,placas);if(!l)return '';
  return '<section class="wa-box"><h3>¿Te toca servicio?</h3><p class="muted">Agenda tu cita con '+esc(t.nombre)+' por WhatsApp.</p>'+
    '<a class="btn wa" href="'+esc(l)+'" target="_blank" rel="noopener">Agendar por WhatsApp</a>'+
    '<p class="hint">WhatsApp: <span class="sel">'+esc(t.whatsapp)+'</span></p></section>';
}
(async function(){
  const token=(new URLSearchParams(location.search).get('c')||location.hash.slice(1)||'').trim();
  if(!token){page('<section class="stack"><h2>Escanea el QR de tu auto</h2><p class="muted">El código QR está pegado en tu auto. Al escanearlo verás aquí su historial de servicio y cuándo te toca el próximo.</p></section>');return;}
  if(SUPABASE_URL.indexOf('TU-PROYECTO')>=0){page('<p class="msg err">Falta configurar la conexión con la base de datos en este archivo.</p>');return;}
  page('<p class="muted">Cargando historial…</p>');
  let res;
  try{
    const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false}});
    res=await sb.rpc('historial_publico',{p_token:token});
  }catch(e){res={error:e};}
  if(res.error){page('<p class="msg err">No pudimos cargar el historial. Revisa tu conexión e intenta de nuevo.</p>');return;}
  const d=res.data;
  if(!d){page('<section class="stack"><h2>No encontramos este auto</h2><p class="muted">El código no corresponde a ningún auto registrado. Pide al taller una etiqueta nueva.</p></section>');return;}
  const t=d.taller,c=d.coche,list=d.servicios||[];
  document.title=c.placas+' · '+t.nombre;
  let h='<div class="car-head">'+plateHtml(c.placas)+'<p class="vehicle">'+esc(vehicle(c))+'</p></div>';
  h+=list.length?nextHtml(list[0])+waHtml(t,c.placas)+stickerHtml(list[0],null)+histHtml(list.slice(1),false)
               :'<p class="note">Este auto todavía no tiene servicios registrados.</p>'+waHtml(t,c.placas);
  page(h,t.nombre,t.telefono);
})();

</script>
</body>
</html>
