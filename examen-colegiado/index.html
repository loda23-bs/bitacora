TECNIA?","o":["Investigación de mercados","Ingeniería de planta","Tesorería","Higiene y seguridad"],"e":"Otras: desarrollo del producto, precios, distribución, promoción y publicidad, ventas y servicio al cliente."},{"id":"1n23uuc","l":"L41","u":"U4","s":"gen","q":"El objetivo del área de operaciones (producción) es:","o":["Transformar insumos en bienes o servicios con la calidad, el costo y la oportunidad requeridos","Fijar los precios de venta y los canales de distribución","Administrar la nómina, las prestaciones y la capacitación","Obtener financiamiento y aplicarlo a las mejores inversiones"],"e":"Es el proceso de transformación del modelo sistémico."},{"id":"1lkieer","l":"L41","u":"U4","s":"gen","q":"¿Cuál es una subfunción del área de OPERACIONES?","o":["Planeación y control de la producción","Crédito y cobranza","Relaciones laborales","Publicidad"],"e":"Otras: ingeniería del producto, ingeniería de planta, ingeniería industrial, abastecimiento, inventarios, control de calidad y mantenimiento."},{"id":"f81r6s","l":"L41","u":"U4","s":"gen","q":"La administración de inventarios y almacenes y el abastecimiento de materiales suelen ubicarse en el área de:","o":["Operaciones","Mercadotecnia","Recursos humanos","Finanzas"],"e":"Aunque las compras a veces forman un área propia, normalmente se incluyen en operaciones."},{"id":"1wh7duc","l":"L41","u":"U4","s":"gen","q":"El estudio de métodos de trabajo y de tiempos, heredero de Taylor, pertenece hoy a la subfunción de operaciones llamada:","o":["Ingeniería industrial","Ingeniería del producto","Control de calidad","Mantenimiento"],"e":"Busca mejorar la productividad de los procesos."},{"id":"1phjbnu","l":"L41","u":"U4","s":"gen","q":"La capacitación y el desarrollo del personal son subfunciones de recursos humanos. En el proceso de Reyes Ponce, el «desarrollo» del personal pertenece a la etapa de:","o":["Integración","Organización","Previsión","Control"],"e":"Integración de personas: selección, introducción y desarrollo."},{"id":"1207qda","l":"L41","u":"U4","s":"gen","q":"El área de mercadotecnia promete al cliente una fecha de entrega que producción no puede cumplir. Este es un problema de:","o":["Coordinación (integración) entre áreas funcionales","Especialización excesiva del área de finanzas","Exceso de descentralización","Falta de control anticipante en recursos humanos"],"e":"Las áreas que trabajan en silos pierden de vista el objetivo común."},{"id":"h0aba9","l":"L41","u":"U4","s":"gen","q":"La evaluación del desempeño del personal, como subfunción de RH, se relaciona con lo que Reyes Ponce llama:","o":["Calificación de méritos","Análisis de puestos","Carta de distribución del trabajo","Organigrama"],"e":"La calificación de méritos mide la realización personal del trabajo; el análisis de puestos fija el contenido impersonal del puesto."},{"id":"dizpsk","l":"L41","u":"U4","s":"gen","q":"El presupuesto de efectivo, que anticipa los requerimientos de efectivo, es una herramienta de finanzas que Koontz cita como ejemplo de:","o":["Control dirigido al futuro (anticipante)","Benchmarking administrativo","Norma intangible","Retroalimentación simple"],"e":"Nadie espera a fines de mayo para saber si hubo fondos para los cheques de abril."},{"id":"1539n0m","l":"L41","u":"U4","s":"gen","q":"Una empresa decide elevar los precios de su producto para posicionarlo como artículo de lujo. Esa decisión corresponde principalmente al área de:","o":["Mercadotecnia","Operaciones","Recursos humanos","Contabilidad"],"e":"El precio es una de las 4P de la mezcla de mercadotecnia."},{"id":"5h7q1b","l":"L41","u":"U4","s":"gen","q":"El área encargada de la higiene y la seguridad en el trabajo, así como de las relaciones con el sindicato, es:","o":["Recursos humanos","Finanzas","Operaciones","Mercadotecnia"],"e":"Incluye las relaciones laborales y las condiciones de trabajo."},{"id":"1et7fj0","l":"L51","u":"U5","s":"gen","q":"La principal importancia del pensamiento estratégico, según el programa, es:","o":["Lograr una ventaja competitiva","Reducir el número de niveles jerárquicos","Cumplir con las normas fiscales","Aumentar el tramo de control"],"e":"El objetivo de la unidad 5 es reconocer la importancia del pensamiento estratégico para lograr una ventaja competitiva."},{"id":"10d7hzx","l":"L51","u":"U5","s":"gen","q":"La diferencia entre el pensamiento estratégico y la planeación estratégica es que:","o":["El pensamiento estratégico es creativo y sintético; la planeación estratégica es analítica y formal","Son exactamente lo mismo","La planeación estratégica es intuitiva y el pensamiento estratégico es solo numérico","El pensamiento estratégico solo se usa en el nivel operativo"],"e":"Primero se piensa estratégicamente (qué podríamos ser) y luego se planea (cómo llegar)."},{"id":"qqzkmk","l":"L51","u":"U5","s":"gen","q":"¿Cuál NO es una característica del pensamiento estratégico (Liedtka)?","o":["Enfoque exclusivo en el corto plazo","Perspectiva sistémica","Guiado por hipótesis","Oportunismo inteligente"],"e":"Las cinco son: perspectiva sistémica, enfoque en la intención, pensamiento en el tiempo, guiado por hipótesis y oportunismo inteligente."},{"id":"v0bkv9","l":"L51","u":"U5","s":"gen","q":"Ver la organización como un todo interrelacionado con su entorno es la característica del pensamiento estratégico llamada:","o":["Perspectiva sistémica","Oportunismo inteligente","Pensamiento en el tiempo","Guiado por hipótesis"],"e":"Conecta con el enfoque de sistemas."},{"id":"8axvlq","l":"L51","u":"U5","s":"gen","q":"La declaración que describe lo que la organización desea llegar a SER en el futuro es la:","o":["Visión","Misión","Política","Estrategia"],"e":"La misión es la razón de ser actual de la organización."},{"id":"13vdstg","l":"L51","u":"U5","s":"gen","q":"En el análisis FODA, las fortalezas y debilidades son factores ___, mientras que las oportunidades y amenazas son ___.","o":["internos / externos","externos / internos","controlables / internos","financieros / de mercado"],"e":"Los factores internos son controlables por la organización; los externos no."},{"id":"1v4em8q","l":"L51","u":"U5","s":"gen","q":"La llegada de un nuevo competidor extranjero con precios muy bajos es, en un FODA:","o":["Una amenaza","Una debilidad","Una oportunidad","Una fortaleza"],"e":"Es un factor externo y negativo."},{"id":"17uyouy","l":"L51","u":"U5","s":"gen","q":"Contar con personal muy capacitado y una marca reconocida es, en un FODA:","o":["Una fortaleza","Una oportunidad","Una amenaza","Una debilidad"],"e":"Es un factor interno y positivo."},{"id":"c14fcy","l":"L51","u":"U5","s":"gen","q":"Las estrategias que usan las fortalezas internas para aprovechar las oportunidades externas son las estrategias:","o":["FO (ofensivas)","DA (de supervivencia)","FA (defensivas)","DO (de reorientación)"],"e":"DO: superar debilidades aprovechando oportunidades. FA: usar fortalezas para enfrentar amenazas. DA: minimizar debilidades y evitar amenazas."},{"id":"1b39sja","l":"L51","u":"U5","s":"gen","q":"Las tres estrategias genéricas de Michael Porter son:","o":["Liderazgo en costos, diferenciación y enfoque","Excelencia operativa, liderazgo de producto y cercanía con el cliente","Penetración, desarrollo y diversificación","Crecimiento, estabilidad y reducción"],"e":"La de excelencia operativa, liderazgo de producto y cercanía con el cliente es de Treacy y Wiersema (Koontz)."},{"id":"9v4leb","l":"L51","u":"U5","s":"gen","q":"¿Cuál NO es una de las cinco fuerzas competitivas de Porter?","o":["El poder de negociación de los empleados","La amenaza de nuevos competidores","La amenaza de productos sustitutos","El poder de negociación de los clientes"],"e":"Las cinco: rivalidad entre competidores, nuevos entrantes, sustitutos, poder de los proveedores y poder de los clientes."},{"id":"1g52h6r","l":"L51","u":"U5","s":"gen","q":"Una empresa que se enfoca en atender solo un segmento muy específico del mercado (un nicho) sigue la estrategia genérica de:","o":["Enfoque","Liderazgo en costos","Diferenciación","Integración vertical"],"e":"El enfoque puede ser en costos o en diferenciación dentro de un nicho."},{"id":"1xcgrn5","l":"L51","u":"U5","s":"gen","q":"Según Koontz y Weihrich, la estrategia es:","o":["La determinación de los objetivos básicos de largo plazo y de los cursos de acción y recursos para lograrlos","Un enunciado o criterio general que orienta el pensamiento en la toma de decisiones","La razón de ser de la empresa, es decir, la función que le asigna la sociedad","Una formulación de resultados esperados expresada en términos numéricos"],"e":"Tradicionalmente es un término militar; hoy designa grandes áreas de la operación de una empresa."},{"id":"tpjmst","l":"L51","u":"U5","s":"gen","q":"Decidir «en qué negocios debe participar la empresa» corresponde a la estrategia de nivel:","o":["Corporativo","De negocio","Funcional","Operativo"],"e":"Nivel de negocio: cómo competir en cada uno. Nivel funcional: cómo contribuye cada área."},{"id":"1jgo04b","l":"L51","u":"U5","s":"gen","q":"Una ventaja competitiva es SOSTENIBLE cuando:","o":["Es valiosa, rara, difícil de imitar y la organización está preparada para aprovecharla","Se basa en precios bajos temporales que atraen clientes en el corto plazo","Cualquier competidor la puede copiar con facilidad y rapidez","Depende de un solo cliente grande que garantiza las ventas"],"e":"Es el modelo VRIO."},{"id":"1flswos","l":"L51","u":"U5","s":"gen","q":"El pensamiento estratégico «guiado por hipótesis» implica:","o":["Formular supuestos creativos y probarlos con la realidad","Rechazar toda conjetura","Repetir lo que funcionó en el pasado sin cambios","Basarse solo en la intuición"],"e":"Combina la creatividad (generar hipótesis) con el análisis (probarlas)."},{"id":"s05qb8","l":"L61","u":"U6","s":"gen","q":"Según el artículo 1° de la Constitución mexicana (reforma de 2011), los principios de los derechos humanos son:","o":["Universalidad, interdependencia, indivisibilidad y progresividad","Legalidad, imparcialidad, eficiencia y lealtad","Igualdad, libertad, fraternidad y justicia","Especialidad, unidad, temporalidad y jerarquía"],"e":"Las autoridades deben promoverlos, respetarlos, protegerlos y garantizarlos."},{"id":"7o8ewj","l":"L61","u":"U6","s":"gen","q":"Los Principios Rectores de la ONU sobre las Empresas y los Derechos Humanos (2011) se resumen en tres pilares:","o":["Proteger, respetar y remediar","Planear, hacer y verificar","Prevenir, castigar y erradicar","Informar, consultar y decidir"],"e":"Proteger es deber del Estado; respetar es responsabilidad de las empresas; remediar es dar acceso a mecanismos de reparación."},{"id":"pkyqhf","l":"L61","u":"U6","s":"gen","q":"Según los Principios Rectores de la ONU, a las empresas les corresponde principalmente:","o":["Respetar los derechos humanos (debida diligencia para no causar ni contribuir a impactos negativos)","Legislar sobre derechos humanos y aprobar las leyes correspondientes","Juzgar y sancionar las violaciones a los derechos humanos de terceros","Sustituir al Estado en el deber de proteger los derechos humanos"],"e":"El deber de proteger corresponde al Estado."},{"id":"l1udeb","l":"L61","u":"U6","s":"gen","q":"La diferencia entre sexo y género es que:","o":["El sexo se refiere a las características biológicas y el género a los roles y atributos construidos socialmente","Son sinónimos: ambos se refieren a las características biológicas","El género es biológico y el sexo es una construcción cultural","El sexo cambia según la cultura y el género es innato"],"e":"La perspectiva de género analiza las desigualdades que surgen de esas construcciones sociales."},{"id":"82nvg7","l":"L61","u":"U6","s":"gen","q":"La perspectiva de género es:","o":["Una herramienta de análisis para identificar desigualdades y discriminación basadas en el género y proponer acciones para eliminarlas","Una política que otorga privilegios a un solo género sobre el otro","Un enfoque que considera las diferencias biológicas como causa de las desigualdades","Una técnica de mercadotecnia para segmentar a los clientes por sexo"],"e":"Busca la igualdad sustantiva."},{"id":"1ir4t22","l":"L61","u":"U6","s":"gen","q":"La igualdad «sustantiva» se refiere a:","o":["La igualdad de hecho en el acceso a oportunidades y resultados, no solo en la ley","La igualdad establecida únicamente en la ley","Dar exactamente lo mismo a todos sin considerar su situación","La igualdad salarial por antigüedad"],"e":"La igualdad formal es la que está escrita en la ley; la sustantiva es la que se vive en la realidad."},{"id":"19o1gt2","l":"L61","u":"U6","s":"gen","q":"Las barreras invisibles que impiden a las mujeres ascender a puestos directivos se conocen como:","o":["Techo de cristal","Suelo pegajoso","Brecha digital","Contrato psicológico"],"e":"El suelo pegajoso son los factores que las mantienen en los puestos de menor nivel."},{"id":"gq3m8h","l":"L61","u":"U6","s":"gen","q":"La norma mexicana que certifica voluntariamente a los centros de trabajo en igualdad laboral y no discriminación es la:","o":["NMX-R-025-SCFI-2015","NOM-035-STPS-2018","ISO 9001","ISO 14001"],"e":"La NOM-035 trata los factores de riesgo psicosocial; ISO 9001 es de calidad e ISO 14001, ambiental."},{"id":"1fr7wv0","l":"L61","u":"U6","s":"gen","q":"La diferencia en la remuneración promedio entre hombres y mujeres por un trabajo de igual valor se denomina:","o":["Brecha salarial de género","Techo de cristal","Contrato psicológico","Distancia del poder"],"e":"Es uno de los indicadores de desigualdad que atiende la perspectiva de género."},{"id":"7w1sle","l":"L61","u":"U6","s":"gen","q":"¿Cuál de las siguientes es una acción organizacional con perspectiva de género?","o":["Implementar un protocolo contra el hostigamiento y el acoso sexual y políticas de corresponsabilidad","Asignar los puestos según el sexo del candidato y no según su perfil","Pagar distinto por el mismo trabajo según la antigüedad del género","Eliminar las licencias de paternidad para reducir los costos laborales"],"e":"Otras: lenguaje incluyente, igualdad en la selección y los ascensos, y acciones afirmativas."},{"id":"6taknn","l":"L61","u":"U6","s":"gen","q":"Relacionando la U6 con Ivancevich: el género, la edad y el origen étnico son dimensiones de la diversidad:","o":["Medulares (innatas)","Secundarias (adquiridas)","Organizacionales","Temporales"],"e":"Ejercen un impacto permanente en el comportamiento y las actitudes."},{"id":"64kc09","l":"L62","u":"U6","s":"gen","q":"La ética se distingue de la moral en que:","o":["La ética es la reflexión sistemática sobre lo correcto e incorrecto, y la moral es el conjunto de normas que una sociedad practica","Son exactamente lo mismo; los dos términos se usan como sinónimos en administración","La moral es la ciencia que reflexiona y la ética es la práctica cotidiana de una sociedad","La ética solo aplica en el ámbito religioso y la moral en el ámbito profesional"],"e":"Un código de ética profesional traduce esa reflexión en deberes concretos."},{"id":"z36ejw","l":"L62","u":"U6","s":"gen","q":"¿Cuál es un deber típico de un código de ética del profesional en administración?","o":["Guardar la confidencialidad de la información y evitar conflictos de interés","Maximizar la utilidad de los accionistas a cualquier costo","Obedecer las órdenes del jefe aunque sean contrarias a la ley","Preferir a familiares y amigos en las contrataciones"],"e":"Otros: honestidad, lealtad, respeto a la ley, competencia profesional y servicio a la sociedad."},{"id":"izzg6t","l":"L62","u":"U6","s":"gen","q":"Los grupos que afectan o son afectados por la empresa (clientes, empleados, proveedores, comunidad, gobierno, accionistas) se denominan:","o":["Grupos de interés (stakeholders)","Accionistas (shareholders)","Comités consultivos","Organizaciones informales"],"e":"La RSE busca atender a todos los stakeholders, no solo a los accionistas."},{"id":"gjoh1j","l":"L62","u":"U6","s":"gen","q":"En la pirámid ntración de las decisiones de todas las empresas en un solo país"],"e":"Implica el libre flujo de bienes, capitales, información y personas."},{"id":"1h306bk","l":"L62","u":"U6","s":"gen","q":"Según Ivancevich, una consecuencia de la globalización para la administración es:","o":["La necesidad de seleccionar, retener y motivar una fuerza laboral especializada y de coordinar equipos multiculturales","La desaparición de la competencia, porque las empresas se fusionan","La eliminación de la diversidad cultural en las organizaciones","La reducción del uso de la tecnología de la información"],"e":"Por eso es una de las fuerzas ambientales que rediseñan la administración."},{"id":"labp29","l":"L62","u":"U6","s":"gen","q":"El tratado comercial vigente entre México, Estados Unidos y Canadá, que sustituyó al TLCAN, es el:","o":["T-MEC (USMCA), vigente desde 2020","TLCAN de 1994","Mercosur","Tratado de Maastricht"],"e":"El TLCAN entró en vigor en 1994; el T-MEC lo sustituyó el 1 de julio de 2020."},{"id":"1mwamka","l":"L62","u":"U6","s":"gen","q":"Según Koontz, ¿qué hace más difícil el control en las compañías internacionales?","o":["La distancia geográfica, los precios de transferencia, la inflación y las fluctuaciones monetarias","Que todas las subsidiarias comparten la misma cultura y las mismas normas","La ausencia total de normas de desempeño en el extranjero","Que las subsidiarias no elaboran presupuestos ni pronósticos"],"e":"Las normas deben ajustarse a las condiciones locales de cada país."},{"id":"1uon43b","l":"L62","u":"U6","s":"gen","q":"Un administrador descubre que su empresa vierte desechos tóxicos a un río, aunque esté dentro del margen legal. Actuar para corregirlo corresponde, en la pirámide de Carroll, a la responsabilidad:","o":["Ética","Económica","Legal","Ninguna, porque cumple la ley"],"e":"La responsabilidad ética va más allá de lo que exige la ley: hacer lo correcto, justo y razonable."},{"id":"15hlg3e","l":"L62","u":"U6","s":"gen","q":"La Conferencia de las Naciones Unidas sobre el Medio Humano de 1972, considerada el inicio de la agenda ambiental internacional, se celebró en:","o":["Estocolmo","Río de Janeiro","Kioto","París"],"e":"Río 1992 fue la Cumbre de la Tierra (Agenda 21)."}];

<script>
// ====== Estado (localStorage con respaldo en memoria) ======
// ====== Cuentas y almacenamiento ======
// Cada cuenta (usuario + contraseña) tiene su propio progreso.
// Se guarda en este dispositivo y, si la página lo permite, también en la nube de tu cuenta de Claude.
const LEGACY_KEY='fa2127_v1';         // progreso anterior (sin cuentas)
const REG_KEY='fa2127_accounts';      // registro local de cuentas
const SESS_KEY='fa2127_session';      // cuenta con sesión abierta
const ACC_PREFIX='fa2127_acc_';       // progreso por cuenta
let S=null, ACC=null;                 // estado y usuario actual
function blank(){return {xp:0,streak:0,lastDay:'',lessons:{},qs:{},wrong:{},exams:[],examDate:'',answered:0,correct:0,onlyMat:false,updated:0}}
const LS_OK=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}})();
function lget(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ldel(k){try{localStorage.removeItem(k)}catch(e){}}
let REG=lget(REG_KEY)||{accounts:{},legacyClaimedBy:null};
// ---- nube (base de datos del artefacto, privada por persona) ----
const CLOUD={db:null,uid:null,ready:false,writable:true,status:'conectando'};
let cloudTimer=null,cloudBusy=false,cloudLast='';
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use){CLOUD.status='sin nube';CLOUD.ready=true;return}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid){CLOUD.status='sin nube';CLOUD.ready=true;return}
    CLOUD.db=db;CLOUD.uid=uid;
    const snap=await withTimeout(db.doc('data/users/'+uid+'/registry').get(),10000);
    if(snap&&snap.exists){const r=snap.data()||{};
      for(const [n,a] of Object.entries(r.accounts||{}))if(!REG.accounts[n])REG.accounts[n]=a;
      if(!REG.legacyClaimedBy&&r.legacyClaimedBy)REG.legacyClaimedBy=r.legacyClaimedBy;
      lset(REG_KEY,REG)}
    CLOUD.status='nube activa';
  }catch(e){CLOUD.status='sin nube'}
  CLOUD.ready=true;
}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))])}
function cloudOn(){return CLOUD.db&&CLOUD.uid&&CLOUD.writable}
async function cloudWrite(path,data){
  if(!cloudOn())return false;
  try{await CLOUD.db.doc(path).set(data);return true}
  catch(e){if(e&&e.code==='invalid_argument'){CLOUD.writable=false;CLOUD.status='solo en este dispositivo'}return false}
}
async function cloudRead(path){if(!CLOUD.db||!CLOUD.uid)return null;try{const s=await withTimeout(CLOUD.db.doc(path).get(),10000);return s&&s.exists?s.data():null}catch(e){return null}}
function saveRegistry(){lset(REG_KEY,REG);if(cloudOn())cloudWrite('data/users/'+CLOUD.uid+'/registry',{accounts:REG.accounts,legacyClaimedBy:REG.legacyClaimedBy||null})}
function save(){
  if(!ACC||!S)return;S.updated=Date.now();lset(ACC_PREFIX+ACC,S);
  clearTimeout(cloudTimer);cloudTimer=setTimeout(flushCloud,2500);
}
async function flushCloud(){
  if(!ACC||!S||!cloudOn()||cloudBusy)return;const body=JSON.stringify(S);if(body===cloudLast)return;
  cloudBusy=true;const ok=await cloudWrite('data/users/'+CLOUD.uid+'/acc-'+ACC,{state:JSON.parse(body)});cloudBusy=false;
  if(ok)cloudLast=body;
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushCloud()});
// ---- contraseñas (hash con sal; separa el progreso de cada quien) ----
async function hashPw(pw,salt){
  const txt=salt+'|'+pw;
  try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of txt)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+(h>>>0).toString(16)}
}
function newSalt(){try{return [...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return Math.random().toString(36).slice(2)}}
function normUser(u){return String(u||'').trim().toLowerCase()}
const USER_RE=/^[a-z0-9_.-]{3,20}$/;
async function loadAccountState(name){
  const local=lget(ACC_PREFIX+name);
  const remote=await cloudRead('data/users/'+(CLOUD.uid||'x')+'/acc-'+name);
  const r=remote&&remote.state?remote.state:null;
  let st=local;if(r&&(!local||(r.updated||0)>(local.updated||0)))st=r;
  return Object.assign(blank(),st||{});
}
async function enterAccount(name,state){
  ACC=name;S=state;lset(SESS_KEY,name);lset(ACC_PREFIX+name,S);cloudLast='';
  if(cloudOn())flushCloud();
  go('home');
}
function logout(){flushCloud();ACC=null;S=null;ldel(SESS_KEY);authView('login')}

// ====== Pantallas de acceso ======
function authView(mode,msg){
  keyHandler=null;
  const has=Object.keys(REG.accounts).length>0;
  if(!mode)mode=has?'login':'register';
  const legacy=lget(LEGACY_KEY);
  const willClaim=mode==='register'&&legacy&&!REG.legacyClaimedBy&&(legacy.answered||legacy.xp||Object.keys(legacy.lessons||{}).length);
  $('#app').innerHTML=`
  <div class="hero"><div style="position:relative;z-index:1"><div class="kicker" style="color:var(--gold)">FCA · UNAM · Clave 2127</div><h1>Fundamentos de Administración</h1><div class="sub">${mode==='login'?'Inicia sesión para continuar con tu progreso.':'Crea tu cuenta para entrar. Cada cuenta tiene su propio progreso.'}</div></div></div>
  <div class="card mt2">
    <div class="chips" style="margin-bottom:14px"><button class="chip ${mode==='login'?'on':''}" onclick="authView('login')">Iniciar sesión</button><button class="chip ${mode==='register'?'on':''}" onclick="authView('register')">Crear cuenta</button></div>
    <form id="af" autocomplete="on">
      <label><b>Usuario</b><br><small class="muted">3 a 20 caracteres: letras, números, punto, guion o guion bajo</small>
      <input id="au" class="inp" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required></label>
      <label class="mt" style="display:block"><b>Contraseña</b><br><small class="muted">Mínimo 4 caracteres</small>
      <input id="ap" class="inp" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" required></label>
      ${mode==='register'?`<label class="mt" style="display:block"><b>Repite la contraseña</b><input id="ap2" class="inp" type="password" autocomplete="new-password" required></label>`:''}
      <div id="amsg" class="mt" style="color:var(--bad);font-weight:600">${msg||''}</div>
      ${willClaim?`<label class="card mt" style="display:flex;gap:10px;align-items:flex-start;border-color:var(--gold);background:var(--gold-soft)"><input type="checkbox" id="claim" checked style="width:20px;height:20px;margin-top:2px;flex:none"><span>⭐ Este navegador tiene progreso guardado de antes (${legacy.xp||0} XP, ${legacy.answered||0} preguntas respondidas). Déjalo marcado para pasarlo a esta cuenta; desmárcalo para empezar desde cero.</span></label>`:''}
      <button class="btn gold mt" type="submit" id="asb">${mode==='login'?'Entrar':'Crear cuenta y entrar'}</button>
    </form>
  </div>
  <p class="center muted mt" style="font-size:12px" id="cst">${cloudNote()}</p>`;
  $('#af').onsubmit=async e=>{e.preventDefault();$('#asb').disabled=true;
    const err=m=>{$('#amsg').textContent=m;$('#asb').disabled=false};
    const u=normUser($('#au').value),p=$('#ap').value;
    if(!USER_RE.test(u))return err('Usuario no válido: usa de 3 a 20 letras, números, punto, guion o guion bajo, sin espacios.');
    if(p.length<4)return err('La contraseña debe tener al menos 4 caracteres.');
    if(mode==='register'){
      if(p!==$('#ap2').value)return err('Las contraseñas no coinciden.');
      if(REG.accounts[u])return err('Ese usuario ya existe en este dispositivo. Inicia sesión o elige otro.');
      const salt=newSalt();REG.accounts[u]={salt,hash:await hashPw(p,salt),created:today()};
      let st=blank();
      if(willClaim&&$('#claim')&&$('#claim').checked){st=Object.assign(blank(),legacy);REG.legacyClaimedBy=u}
      saveRegistry();
      return enterAccount(u,st);
    } else {
      const a=REG.accounts[u];
      if(!a)return err(CLOUD.ready?'No existe esa cuenta. Revisa el usuario o crea una cuenta nueva.':'No encuentro esa cuenta todavía; espera unos segundos mientras sincronizo e inténtalo de nuevo.');
      if(await hashPw(p,a.salt)!==a.hash)return err('Contraseña incorrecta.');
      return enterAccount(u,await loadAccountState(u));
    }
  };
}
function cloudNote(){
  if(!LS_OK&&!cloudOn())return '⚠️ Este navegador no permite guardar datos: tu progreso se perderá al cerrar. Abre la página en Chrome o Safari.';
  if(!CLOUD.ready)return 'Conectando con la nube…';
  if(cloudOn())return '☁️ Tu progreso se guarda en este dispositivo y en la nube de tu cuenta de Claude.';
  return '📱 Tu progreso se guarda en este dispositivo.';
}
async function boot(){
  $('#app').innerHTML='<div class="center mt2 muted">Cargando…</div>';
  const cloudP=initCloud();
  // no hacer esperar: si en 3 s la nube no responde, seguimos con lo local
  await Promise.race([cloudP,new Promise(r=>setTimeout(r,3000))]);
  const sess=lget(SESS_KEY);
  if(sess&&REG.accounts[sess]){await enterAccount(sess,await loadAccountState(sess))}
  else authView();
  cloudP.then(()=>{const c=$('#cst');if(c)c.textContent=cloudNote()});
}
const BY_ID={};BANK.forEach(q=>BY_ID[q.id]=q);
const L_BY_ID={};LESSONS.forEach(l=>L_BY_ID[l.id]=l);
const U_BY_ID={};UNITS.forEach(u=>U_BY_ID[u.id]=u);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function touchDay(){const t=today();if(S.lastDay===t)return;const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');S.streak=(S.lastDay===ys)?S.streak+1:1;S.lastDay=t}
function record(id,ok){
  touchDay();const r=S.qs[id]||{s:0,c:0,h:''};r.s++;if(ok)r.c++;r.h=(r.h+(ok?'1':'0')).slice(-3);S.qs[id]=r;
  S.answered++;if(ok){S.correct++}
  if(!ok)S.wrong[id]=1;else if(S.wrong[id]&&r.h.endsWith('11'))delete S.wrong[id];
  save();
}
function mastered(){return Object.values(S.qs).filter(r=>r.h.endsWith('11')).length}
function poolFor(units,lessonId){let p=BANK;if(lessonId)p=p.filter(q=>q.l===lessonId);else if(units&&units.length)p=p.filter(q=>units.includes(q.u));if(S.onlyMat&&!lessonId)p=p.filter(q=>q.s==='mat');return p}
// prioriza preguntas no vistas o falladas
function pick(pool,n){
  const score=q=>{const r=S.qs[q.id];if(!r)return Math.random()*2;const acc=r.c/r.s;return 2+acc*3-(S.wrong[q.id]?2:0)+Math.random()*1.5};
  return pool.map(q=>[score(q),q]).sort((a,b)=>a[0]-b[0]).slice(0,n).map(x=>x[1]);
}
function makeItem(q){return {q,perm:shuffle([0,1,2,3]),ans:null,flag:false}}
const LETTERS=['A','B','C','D'];
let keyHandler=null;
document.addEventListener('keydown',e=>{if(keyHandler)keyHandler(e)});
function view(html){keyHandler=null;$('#app').innerHTML=html;window.scrollTo(0,0)}
function topBar(title,back='home',extra=''){return `<div class="top"><button class="back" onclick="go('${back}')" aria-label="Volver">←</button><div class="ttl"><h2>${title}</h2></div>${extra}</div>`}
let timerInt=null;function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null}}

// ====== Navegación ======
function go(v,arg){stopTimer();$('#layer').innerHTML='';if(!ACC||!S)return authView();
  if(v==='home')return home();if(v==='learn')return learnMap();if(v==='lesson')return lessonIntro(arg);
  if(v==='practice')return practiceSetup();if(v==='exam')return examSetup();if(v==='errors')return startErrors();
  if(v==='cards')return cardsSetup();if(v==='tips')return tips();if(v==='history')return historyView();}

// ====== Inicio ======
function home(){
  const acc=S.answered?Math.round(100*S.correct/S.answered):0;

let LS=null;

function lessonHeader(){const p=Math.round(100*LS.i/LS.steps.length);return `<div class="qhead"><button class="back" style="width:36px;height:36px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);flex:none" onclick="quitLesson()">✕</button><div class="bar"><i style="width:${p}%"></i></div><div class="hearts">${'❤️'.repeat(LS.hearts)}${'🤍'.repeat(3-LS.hearts)}</div></div>`}

// ====== Render de pregunta con retroalimentación inmediata ======
function renderQ(it,{header='',onAnswer,onNext,meta=''}){
  const q=it.q;const u=U_BY_ID[q.u];const l=L_BY_ID[q.l];
  let h=header+`<div class="pop"><div class="kicker" style="color:${u.color}">U${u.n} · ${l.title} <span class="tag ${q.s}">${q.s==='mat'?'Material':'Temario'}</span></div>${meta}<div class="qtext">${esc(q.q)}</div><div class="opts">`;
  it.perm.forEach((oi,k)=>{h+=`<button class="opt" data-k="${k}" onclick="pickOpt(${k})"><span class="k">${LETTERS[k]}</span><span>${esc(q.o[oi])}</span></button>`});
  h+=`</div><div id="fb"></div></div><div style="height:90px"></div><div class="sticky"><div class="in"><button class="btn" id="nx" disabled>Elige una respuesta</button></div></div>`;
  view(h);
  let chosen=null;
  window.pickOpt=(k)=>{if(chosen!==null)return;chosen=k;it.ans=k;
    const ci=it.perm.indexOf(0);const ok=k===ci;record(q.id,ok);onAnswer&&onAnswer(ok);
    document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===ci)b.classList.add('right');else if(j===k)b.classList.add('wrong')});
    if(!ok)$('.opts').classList.add('shake');
    const wrongTxt=ok?'':`<p style="margin:6px 0 0"><b>Elegiste:</b> ${esc(q.o[it.perm[k]])}. <b>Correcta:</b> ${esc(q.o[0])}.</p>`;
    $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'} pop"><h4>${ok?'✅ ¡Correcto!':'❌ Incorrecto'}</h4>${wrongTxt}<p style="margin:6px 0 0">${esc(q.e)}</p><div class="src">📖 ${l.ref}</div></div>`;
    const nx=$('#nx');nx.disabled=false;nx.textContent='Continuar →';nx.className='btn '+(ok?'ok':'bad');nx.onclick=onNext;
    setTimeout(()=>$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'}),60);
  };
  keyHandler=e=>{const m={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3}[e.key.toLowerCase()];if(m!==undefined&&chosen===null)pickOpt(m);else if(e.key==='Enter'&&chosen!==null){e.preventDefault();onNext()}};
}

function startPractice({units,lesson,n,ids,title}){
  let items;
  if(ids)items=shuffle(ids.map(id=>BY_ID[id]).filter(Boolean)).slice(0,n||ids.length);
  else items=shuffle(pick(poolFor(units,lesson),n));
  if(!items.length){view(topBar('Práctica')+'<p>No hay preguntas con ese filtro.</p>');return}
  PR={items:items.map(makeItem),i:0,right:0,title:title||'Práctica guiada',back:lesson?['lesson',lesson]:['practice']};
  prStep();
}
function prHeader(){const p=Math.round(100*PR.i/PR.items.length);return `<div class="qhead"><button class="back" style="width:36px;height:36px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);flex:none" onclick="prEnd()">✕</button><div class="bar"><i style="width:${p}%"></i></div><div class="pill">${PR.i+1}/${PR.items.length}</div></div>`}
function prStep(){
  if(PR.i>=PR.items.length)return prEnd();
  renderQ(PR.items[PR.i],{header:prHeader(),onAnswer:ok=>{if(ok){PR.right++;S.xp+=10;save()}},onNext:()=>{PR.i++;prStep()}});
}
function prEnd(){
  const done=PR.items.filter(x=>x.ans!==null);const r=done.filter(x=>x.ans===x.perm.indexOf(0)).length;
  const wrong=done.filter(x=>x.ans!==x.perm.indexOf(0));
  const pct=done.length?Math.round(100*r/done.length):0;
  let h=`<div class="center mt2 pop"><div class="big">${pct}%</div><p class="muted">${r} de ${done.length} correctas</p></div>`;
  h+=byUnitTable(done);
  if(wrong.length){h+=`<div class="sec">Repasa lo que fallaste</div>`+wrong.map(x=>reviewCard(x)).join('')}
  h+=`<div class="grid mt2">${wrong.length?`<button class="btn gold" onclick="startPractice({ids:${esc(JSON.stringify(wrong.map(x=>x.q.id)))}})">Reintentar solo las ${wrong.length} falladas</button>`:''}<button class="btn ghost" onclick="go('${PR.back[0]}'${PR.back[1]?`,'${PR.back[1]}'`:''})">Terminar</button></div>`;
  view(topBar('Resultados',PR.back[0])+h);
}
function byUnitTable(items){
  const g={};items.forEach(x=>{const u=x.q.u;g[u]=g[u]||[0,0];g[u][1]++;if(x.ans===x.perm.indexOf(0))g[u][0]++});
  let h='<div class="card mt">';UNITS.forEach(u=>{if(!g[u.id])return;const[p,t]=g[u.id];const pc=Math.round(100*p/t);h+=`<div class="ubar"><span>U${u.n} <small>${u.title.split(':')[0].split(' y ')[0]}</small></span><div class="bar"><i style="width:${pc}%;background:${pc>=70?'var(--ok)':pc>=50?'var(--gold)':'var(--bad)'}"></i></div><b style="text-align:right">${p}/${t}</b></div>`});
  return h+'</div>';
}
function reviewCard(x,num){
  const q=x.q;const ci=x.perm.indexOf(0);const ok=x.ans===ci;const l=L_BY_ID[q.l];
  return `<div class="card mt"><div class="kicker">${num?'#'+num+' · ':''}U${U_BY_ID[q.u].n} · ${l.title}</div><p style="font-weight:600;margin-top:0">${esc(q.q)}</p>
  ${x.ans===null?'<p class="muted">⏭️ Sin responder</p>':(ok?'':`<p style="color:var(--bad)">✗ Tu respuesta: ${esc(q.o[x.perm[x.ans]])}</p>`)}
  <p style="color:var(--ok)">✓ ${esc(q.o[0])}</p><p class="muted" style="font-size:14.5px">${esc(q.e)}</p><div class="muted" style="font-size:12px">📖 ${l.ref}</div></div>`;
}

  view(topBar('Simulacro')+`
  <div class="card"><h3>Como el día del examen</h3><ul class="list" style="padding-left:20px;margin-bottom:0">
  <li>Preguntas de opción múltiple con 4 incisos.</li><li>Cronómetro: tienes <b>54 segundos por pregunta</b> en promedio.</li><li>No te digo si acertaste hasta que termines.</li><li>Puedes <b>marcar 🚩</b> las dudosas y regresar con la cuadrícula.</li><li>Al terminar: calificación, desglose por unidad y revisión con explicaciones.</li></ul></div>
  <div class="sec">Elige la versión</div>
  <div class="grid">
    <button class="card mode" onclick="startExam(100,90)"><div class="ic" style="background:#fbecd0">🏁</div><div><h3>Completo · 100 preguntas · 90 min</h3><p>Distribución: U1 12 · U2 24 · U3 36 · U4 12 · U5 6 · U6 10</p></div></button>
    <button class="card mode" onclick="startExam(50,45)"><div class="ic" style="background:#e6efff">⚡</div><div><h3>Medio · 50 preguntas · 45 min</h3><p>Mismo ritmo, mitad del tiempo.</p></div></button>
    <button class="card mode" onclick="startExam(25,23)"><div class="ic" style="background:#e3f6ec">☕</div><div><h3>Rápido · 25 preguntas · 23 min</h3><p>Para un rato libre.</p></div></button>
  </div>${S.onlyMat?'<p class="muted mt">⚠️ Tienes activado «Solo material de tu maestra»: el simulacro usará solo esas preguntas.</p>':''}`);
}
const DIAG_W={U1:1,U2:2,U3:3,U4:2,U5:1,U6:1};
function startExam(n,mins,W,diag){W=W||EXAM_W;
  let chosen=[];
  if(S.onlyMat){chosen=shuffle(BANK.filter(q=>q.s==='mat')).slice(0,n)}
  else{
    const f=W===EXAM_W?n/100:1;let rest=[];
    for(const u of UNITS){const pool=shuffle(BANK.filter(q=>q.u===u.id));const k=Math.round((W[u.id]||0)*f);chosen=chosen.concat(pool.slice(0,k));rest=rest.concat(pool.slice(k))}
    rest=shuffle(rest);while(chosen.length<n&&rest.length)chosen.push(rest.pop());chosen=chosen.slice(0,n);
  }
  // orden: agrupado por unidad, como suelen venir los exámenes, pero aleatorio dentro de cada unidad
  const order={};UNITS.forEach((u,i)=>order[u.id]=i);
  chosen=shuffle(chosen).sort((a,b)=>order[a.u]-order[b.u]);
  EX={items:chosen.map(makeItem),i:0,end:Date.now()+mins*60000,mins,start:Date.now(),done:false,diag:!!diag};
  timerInt=setInterval(tick,1000);exStep();
}
function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function tick(){const left=EX.end-Date.now();const t=$('#tm');if(t){t.textContent='⏱ '+fmt(left);t.classList.toggle('warn',left<5*60000)}if(left<=0){stopTimer();finishExam(true)}}
function exStep(){
  const it=EX.items[EX.i];const q=it.q;const answered=EX.items.filter(x=>x.ans!==null).length;
  let h=`<div class="qhead"><button class="back" style="width:36px;height:36px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);flex:none" onclick="showGrid()" aria-label="Cuadrícula">▦</button><div class="bar"><i style="width:${Math.round(100*answered/EX.items.length)}%"></i></div><div class="timer" id="tm">⏱ ${fmt(EX.end-Date.now())}</div></div>
  <div class="pop"><div class="row" style="align-items:center"><div class="kicker" style="margin:0">Pregunta ${EX.i+1} de ${EX.items.length}</div><button class="chip ${it.flag?'on':''}" style="flex:none" onclick="EX.items[EX.i].flag=!EX.items[EX.i].flag;exStep()">🚩 ${it.flag?'Marcada':'Marcar'}</button></div>
  <div class="qtext">${esc(q.q)}</div><div class="opts">`;
  it.perm.forEach((oi,k)=>{h+=`<button class="opt ${it.ans===k?'sel':''}" onclick="exPick(${k})"><span class="k">${LETTERS[k]}</span><span>${esc(q.o[oi])}</span></button>`});
  h+=`</div></div><div style="height:90px"></div><div class="sticky"><div class="in row"><button class="btn ghost" ${EX.i===0?'disabled':''} onclick="EX.i--;exStep()">← Anterior</button>${EX.i<EX.items.length-1?`<button class="btn" onclick="EX.i++;exStep()">Siguiente →</button>`:`<button class="btn gold" onclick="confirmFinish()">Entregar</button>`}</div></div>`;
  view(h);
  keyHandler=e=>{const m={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3}[e.key.toLowerCase()];if(m!==undefined)exPick(m);else if(e.key==='ArrowRight'&&EX.i<EX.items.length-1){EX.i++;exStep()}else if(e.key==='ArrowLeft'&&EX.i>0){EX.i--;exStep()}};
}
function exPick(k){EX.items[EX.i].ans=k;
  // avance automático corto para ganar tiempo
  document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',j===k));
  setTimeout(()=>{if(!EX||EX.done)return;if(EX.i<EX.items.length-1){EX.i++;exStep()}else exStep()},280);
}
function showGrid(){
  const ans=EX.items.filter(x=>x.ans!==null).length;const fl=EX.items.filter(x=>x.flag).length;
  $('#layer').innerHTML=`<div class="modal" onclick="if(event.target===this)this.remove()"><div class="card" style="max-height:90vh;overflow:auto"><h3>Navegación</h3><p class="muted">${ans}/${EX.items.length} respondidas · ${fl} marcadas 🚩</p><div class="navgrid">${EX.items.map((x,i)=>`<button class="${x.ans!==null?'ans':''} ${x.flag?'flag':''} ${i===EX.i?'cur':''}" onclick="$('#layer').innerHTML='';EX.i=${i};exStep()">${i+1}</button>`).join('')}</div><div class="row mt"><button class="btn ghost" onclick="$('#layer').innerHTML=''">Cerrar</button><button class="btn gold" onclick="confirmFinish()">Entregar</button></div><button class="btn ghost mt" onclick="abandonExam()">Abandonar simulacro</button></div></div>`;
}
function confirmFinish(){const blank=EX.items.filter(x=>x.ans===null).length;const fl=EX.items.filter(x=>x.flag).length;
  $('#layer').innerHTML=`<div class="modal"><div class="card"><h3>¿Entregar el simulacro?</h3><p class="muted">${blank?`Te faltan <b>${blank}</b> sin responder. En el examen real conviene contestar todo: una pregunta en blanco vale lo mismo que una incorrecta.`:'Respondiste todo.'}${fl?` Tienes ${fl} marcada${fl===1?'':'s'} 🚩.`:''}</p><div class="row mt"><button class="btn ghost" onclick="$('#layer').innerHTML=''">Revisar</button><button class="btn gold" onclick="$('#layer').innerHTML='';finishExam(false)">Entregar</button></div></div></div>`}
function abandonExam(){stopTimer();EX=null;$('#layer').innerHTML='';go('exam')}
function finishExam(timeout){
  stopTimer();if(!EX||EX.done)return;EX.done=true;$('#layer').innerHTML='';
  const items=EX.items;let r=0;items.forEach(x=>{if(x.ans!==null){const ok=x.ans===x.perm.indexOf(0);record(x.q.id,ok);if(ok)r++}else{S.wrong[x.q.id]=1}});
  const used=Math.min(EX.mins*60000,Date.now()-EX.start);
  const byU={};items.forEach(x=>{byU[x.q.u]=byU[x.q.u]||[0,0];byU[x.q.u][1]++;if(x.ans===x.perm.indexOf(0))byU[x.q.u][0]++});
  if(!EX.diag)S.exams.push({d:today(),score:r,total:items.length,min:Math.round(used/60000),byU});S.xp+=r;touchDay();save();
  const cal=(10*r/items.length).toFixed(1);
  window.EXR=items;
  const isDiag=EX.diag;let h=topBar(isDiag?'Resultado del diagnóstico':'Resultado del simulacro',isDiag?'home':'exam')+`<div class="center pop">${timeout?'<p class="pill">⏰ Se acabó el tiempo</p>':''}<div class="big mt">${cal}</div><p class="muted">Calificación sobre 10 · ${r} de ${items.length} correctas · tiempo usado ${fmt(used)}</p></div>`;
  h+=byUnitTable(items);
  const weak=UNITS.filter(u=>byU[u.id]&&byU[u.id][0]/byU[u.id][1]<.6);
  if(weak.length)h+=`<div class="card mt" style="border-color:var(--gold)"><b>Dónde enfocarte:</b> ${weak.map(u=>'U'+u.n+' ('+u.title.split(':')[0]+')').join(', ')}. Ve a <b>Aprender</b> y repite esas lecciones o haz una <b>Práctica guiada</b> solo con esas unidades.</div>`;
  if(isDiag){const ls=[...new Set(items.filter(x=>x.ans!==x.perm.indexOf(0)).map(x=>x.q.l))];
    h+=`<div class="card mt" style="border-color:var(--gold)"><b>${r>=8?'¡Buen nivel! Aun así, refuerza:':'Empieza por estas lecciones:'}</b>${ls.length?ls.map(id=>`<button class="btn ghost mt" onclick="go('lesson','${id}')">📚 ${L_BY_ID[id].title}</button>`).join(''):'<p>Acertaste todo. Ve directo a un simulacro completo.</p>'}<p class="muted mt" style="margin-bottom:0">Ojo: 10 preguntas son solo un termómetro. Repite el diagnóstico otro día para confirmar; te van a salir preguntas distintas.</p></div>`}
  h+=`<div class="sec">Revisión</div><div class="chips"><button class="chip on" id="fw" onclick="revFilter('w')">Solo errores y en blanco</button><button class="chip" id="fa" onclick="revFilter('a')">Todas</button></div><div id="rev"></div>
  <div class="grid mt2"><button class="btn gold" onclick="go('errors')">Practicar mis errores</button><button class="btn ghost" onclick="go('home')">Inicio</button></div>`;
  view(h);revFilter('w');
}
function revFilter(m){$('#fw').classList.toggle('on',m==='w');$('#fa').classList.toggle('on',m==='a');
  const list=EXR.map((x,i)=>[x,i+1]).filter(([x])=>m==='a'||x.ans!==x.perm.indexOf(0));
  $('#rev').innerHTML=list.length?list.map(([x,n])=>reviewCard(x,n)).join(''):'<p class="muted mt">¡Sin errores! 🏆</p>'}
function historyView(){
  let h=topBar('Mis simulacros');
  if(!S.exams.length){view(h+'<div class="card center"><p>Aún no has hecho ningún simulacro.</p><button class="btn gold mt" onclick="go(\'exam\')">Hacer uno</button></div>');return}
  h+='<div class="card">';
  S.exams.slice().reverse().forEach(e=>{const c=(10*e.score/e.total).toFixed(1);h+=`<div class="toggle"><div><b>${c}</b> <small>· ${e.score}/${e.total} · ${e.min} min</small><br><small>${e.d}</small></div><div class="bar" style="width:40%"><i style="width:${10*c}%;background:${c>=7?'var(--ok)':c>=6?'var(--gold)':'var(--bad)'}"></i></div></div>`});
  view(h+'</div>');
}

// ====== Repaso exprés (tarjetas al azar) ======
let CD=null;
function cardsSetup(){
  let units=UNITS.map(u=>u.id);
  const draw=()=>{view(topBar('Repaso exprés')+`<p class="muted" style="margin-top:-4px">Tarjetas de concepto al azar, para leer en cualquier lado.</p><div class="card"><div class="chips">${UNITS.map(u=>`<button class="chip ${units.includes(u.id)?'on':''}" data-u="${u.id}">U${u.n}</button>`).join('')}</div></div><div class="mt"><button class="btn gold" id="go">Empezar →</button></div>`);
    document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const id=b.dataset.u;units=units.includes(id)?units.filter(x=>x!==id):[...units,id];draw()});
    $('#go').onclick=()=>{const all=[];LESSONS.filter(l=>units.includes(l.u)).forEach(l=>l.cards.forEach(c=>all.push({l,c})));if(!all.length)return;CD={list:shuffle(all),i:0};cardStep()}};draw();
}
function cardStep(){const {l,c}=CD.list[CD.i];const u=U_BY_ID[l.u];
  view(topBar(`Tarjeta ${CD.i+1} de ${CD.list.length}`,'cards')+`<div class="card concept pop"><div class="kicker" style="color:${u.color}">U${u.n} · ${l.title}</div><h3>${c.h}</h3><div class="body">${c.b}</div></div><div class="sticky"><div class="in row"><button class="btn ghost" ${CD.i?'':'disabled'} onclick="CD.i--;cardStep()">←</button><button class="btn gold" onclick="if(CD.i<CD.list.length-1){CD.i++;cardStep()}else go('home')">${CD.i<CD.list.length-1?'Siguiente →':'Terminar'}</button></div></div>`);
  keyHandler=e=>{if(e.key==='ArrowRight'&&CD.i<CD.list.length-1){CD.i++;cardStep()}else if(e.key==='ArrowLeft'&&CD.i){CD.i--;cardStep()}};
}

// ====== Trampas y estrategia ======
function tips(){
  const pairs=[
   ['Unidad de MANDO vs. unidad de DIRECCIÓN (Fayol)','Mando = cada persona tiene UN jefe. Dirección = un plan y un jefe para actividades con el MISMO objetivo.'],
   ['Eficacia vs. eficiencia','Eficacia = lograr el objetivo. Eficiencia = lograrlo con el mejor uso de recursos.'],
   ['Política vs. regla vs. procedimiento (Koontz)','Política: orienta el PENSAMIENTO, deja discrecionalidad. Regla: SIN discrecionalidad («No fumar»). Procedimiento: secuencia cronológica, guía de ACCIÓN.'],
   ['Orden vs. instrucción (Reyes Ponce)','Orden: situación particular y concreta. Instrucción: norma para casos repetidos (mejor por escrito).'],
   ['Supervisión vs. control','Supervisión: SIMULTÁNEA a la ejecución. Control: POSTERIOR.'],
   ['Delegación → descentralización → desconcentración','Delegación = causa; descentralización = efecto (en todas las líneas); desconcentración = además hay separación GEOGRÁFICA.'],
   ['¿Qué es lo más importante?','Koontz: la PLANEACIÓN es la función más básica. Reyes Ponce: la DIRECCIÓN es la esencia y el corazón; la COMUNICACIÓN es el sistema nervioso; la COORDINACIÓN es la esencia de la administración. ¡Fíjate en el autor que te pregunten!'],
   ['Objeto vs. finalidad (Reyes Ponce)','Objeto = organismo social (coordinación de medios). Finalidad = máxima eficiencia en la coordinación.'],
   ['Mecánica vs. dinámica (Urwick)','Mecánica: previsión, planeación, organización (cómo DEBE ser). Dinámica: integración, dirección, control (cómo ES).'],
   ['Las preguntas de Reyes Ponce','Previsión ¿qué PUEDE hacerse? · Planeación ¿qué SE VA a hacer? · Organización ¿CÓMO? · Integración ¿con QUÉ y con QUIÉN? · Dirección: VER que se haga · Control ¿cómo SE HA realizado?'],
   ['¿Quién dividió cómo el proceso?','AMA: 3 · Terry: 4 · Fayol: 5 (con coordinar) · Koontz y O\'Donnell: 5 (con integración) · Urwick: 6 (separa previsión) · Dale: 6 (innovación/representación) · Gulick: 8 · Reyes Ponce: 6 en 2 fases.'],
   ['Certeza metafísica / física / moral','Metafísica: el círculo no será cuadrado. Física: un eclipse. Moral: la oferta y la demanda. Concluir que algo fracasará = certeza desfavorable, NO incertidumbre.'],
   ['Plazos de los objetivos (Reyes Ponce)','Corto ≤ 1 año · mediano > 1 hasta 5 · largo > 5 años. Estratégicos (largo), técnicos (mediano, el «cómo»), operativos (corto).'],
   ['Sistemas de organización','Lineal: un solo jefe, sin especialización. Funcional (Taylor): especialización, pero DUPLICIDAD de mando. Lineal y staff: la preferida por las grandes. Matricial: NASA; en conflicto gana el jefe de proyecto.'],
   ['Graicunas','1→1 · 2→6 · 3→18 · 4→44 · 5→100 relaciones. Tramo: 4 a 8 arriba, 10 a 20 abajo.'],
   ['Autoridad (Reyes Ponce)','JURÍDICA (por obligación): formal (lineal o funcional) y operativa (sobre actos). MORAL (por convencimiento): técnica (el staff) y personal (el liderazgo).'],
   ['Las 3 concepciones del trabajador (March y Simon)','Instrumento pasivo = Taylor · Portador de actitudes y motivos = Mayo · Tomador de decisiones = Simon.'],
   ['Hombre económico vs. administrativo','Económico: MAXIMIZA, información completa. Administrativo (Simon): SATISFACE, racionalidad limitada.'],
   ['Luhmann: 3 sistemas sociales','Sociedad (todas las comunicaciones) · Organización (condiciones de membresía) · Interacción (personas presentes, pasajera).'],
   ['Schein: 3 capas','Artefactos (visibles) → valores → premisas básicas (invisibles, los cimientos).'],
   ['Hofstede vs. Bond','Hofstede: distancia del poder, incertidumbre, individualismo, masculinidad. Bond añadió la orientación al LARGO plazo.'],
   ['Kram: fases del mentoring','Iniciación (6 meses a 1 año) → cultivo (2 a 5 años) → separación (6 meses a 2 años) → redefinición.'],
   ['Control: retroalimentación vs. anticipante','Retroalimentación: mide SALIDAS (casi un aviso postmortem). Anticipante (feedforward): vigila INSUMOS y corrige antes.'],
   ['Porter vs. Treacy y Wiersema','Porter: costos, diferenciación, enfoque. Treacy y Wiersema: excelencia operativa, liderazgo de producto, cercanía con el cliente.'],
   ['Calidad: ¿quién es quién?','Deming: 14 puntos y PHVA (de Shewhart) · Juran: trilogía y adecuación al uso · Crosby: cero defectos · Ishikawa: espina de pescado y círculos de calidad.'],
  ];
  view(topBar('Trampas y estrategia')+`
  <div class="card"><h3>Estrategia para 100 preguntas en 90 minutos</h3><ol class="list" style="padding-left:20px;margin-bottom:0">
  <li><b>Ritmo:</b> 54 segundos por pregunta. A los 45 minutos deberías ir en la pregunta 50.</li>
  <li><b>Primera pasada:</b> contesta lo que sabes seguro; las que te tomen más de 1 minuto, márcalas y sigue.</li>
  <li><b>Elimina:</b> descarta las opciones absurdas o absolutas («siempre», «nunca», «exclusivamente», «único») y elige entre las dos que quedan.</li>
  <li><b>Lee el autor:</b> muchas preguntas cambian de respuesta según el autor (Koontz ≠ Reyes Ponce ≠ Fayol).</li>
  <li><b>Busca el «NO» / «EXCEPTO»:</b> subráyalo mentalmente antes de leer las opciones.</li>
  <li><b>No elijas por longitud:</b> la opción más larga no siempre es la correcta.</li>
  <li><b>No dejes nada en blanco:</b> con 4 opciones, adivinar te da un 25% de probabilidad; en blanco tienes 0%.</li>
  <li><b>Si te sobra tiempo</b>, regresa a las marcadas y cambia una respuesta solo si tienes una razón clara.</li></ol></div>
  <div class="sec">Comparaciones que más confunden</div>
  ${pairs.map(([a,b])=>`<details class="card mt"><summary>${a}</summary><p class="mt" style="margin-bottom:0">${b}</p></details>`).join('')}
  <div class="sec">Plan sugerido</div>
  <div class="card"><ol class="list" style="padding-left:20px;margin:0"><li>Termina la ruta de <b>Aprender</b> (1 o 2 lecciones al día en tus traslados).</li><li>Haz un <b>Simulacro rápido</b> para medirte.</li><li>Ataca tus unidades débiles con <b>Práctica guiada</b> y vacía <b>Mis errores</b>.</li><li>Los últimos días: 1 <b>Simulacro completo</b> diario hasta pasar de 8 de forma constante.</li></ol></div>`);
}

boot();
