er un rendimiento sobre la inversión del 12% al cierre del año fiscal en curso","Obtener utilidades razonables durante el siguiente ejercicio","Mejorar la comunicación entre todos los departamentos","Desarrollar mejores administradores en la empresa"],"e":"Un objetivo verificable responde «¿cuánto?» y «¿cuándo?»; al final del periodo se puede saber si se cumplió."},{"id":"iqyj1q","l":"L33","u":"U3","s":"mat","q":"Según Treacy y Wiersema, ¿cuáles son las tres disciplinas en las que deben sobresalir los líderes del mercado?","o":["Excelencia operativa, liderazgo de productos y cercanía con el cliente","Liderazgo en costos, diferenciación y enfoque","Planeación, organización, dirección y control","Calidad del producto, servicio y precio bajo"],"e":"Una compañía debe destacar en al menos una, pero difícilmente en las tres. «Costos, diferenciación y enfoque» son las estrategias genéricas de Porter."},{"id":"1epxymr","l":"L33","u":"U3","s":"mat","q":"¿Cuál de las siguientes NO es un área de resultados clave según Drucker?","o":["Antigüedad del personal","Posición en el mercado","Innovación","Responsabilidad pública"],"e":"Las áreas son: posición en el mercado, innovación, productividad, recursos físicos y financieros, rentabilidad, desempeño y desarrollo de los gerentes, desempeño y actitud de los trabajadores y responsabilidad pública."},{"id":"1bfuck5","l":"L33","u":"U3","s":"mat","q":"Para Koontz y Weihrich, la administración por objetivos (APO) es:","o":["Un sistema administrativo integral que combina actividades para cumplir con eficacia y eficiencia los objetivos","Solo un instrumento para evaluar el desempeño individual de los subordinados","Solo una técnica motivacional basada en metas de corto plazo","Un tipo de presupuesto que traduce los objetivos a términos numéricos"],"e":"Hay quienes la definen de forma estrecha, pero los autores la conciben como un sistema."},{"id":"gann3m","l":"L33","u":"U3","s":"mat","q":"Los estudios de la Universidad de Maryland sobre el establecimiento de metas demostraron que:","o":["El desempeño aumenta más con objetivos específicos que cuando solo se pide «hacer el mejor esfuerzo»","Fijar metas específicas reduce la motivación, porque genera presión sobre el trabajador","Las metas solo elevan el desempeño en las empresas privadas, no en las públicas","El dinero es el único factor que explica las diferencias de desempeño entre personas"],"e":"Además, altos niveles de intención se asocian con un alto desempeño."},{"id":"1icf6k8","l":"L33","u":"U3","s":"mat","q":"Según Koontz, el establecimiento de objetivos en la APO debe ser:","o":["Un proceso conjunto e interactivo (reciclamiento) entre superiores y subordinados","Una imposición descendente de la alta dirección hacia los subordinados","Responsabilidad exclusiva de los subordinados, sin intervención del jefe","Una decisión técnica del departamento de personal de la empresa"],"e":"No es puramente descendente ni puramente ascendente; las metas cambian con las contribuciones de los subordinados."},{"id":"1sn7wye","l":"L33","u":"U3","s":"mat","q":"¿Cuál es una DEFICIENCIA de la APO según Koontz y Weihrich?","o":["El riesgo de enfatizar los objetivos de corto plazo a expensas de la solidez de largo plazo","Que fomenta el compromiso personal con los objetivos propios y organizacionales","Que obliga a precisar las funciones y la estructura de la organización","Que permite desarrollar controles eficaces para medir los resultados"],"e":"Otras: no enseñar su filosofía, no dar pautas, la dificultad de fijar metas verificables, la inflexibilidad y el abuso de metas cuantitativas."},{"id":"nsx6nw","l":"L33","u":"U3","s":"mat","q":"La filosofía de la APO descansa en los conceptos de:","o":["Autocontrol y autodirección","Supervisión estricta y castigo","Centralización y unidad de mando","Antigüedad y jerarquía"],"e":"Drucker sentó las bases de esa filosofía."},{"id":"1yw9maf","l":"L33","u":"U3","s":"mat","q":"Sobre la relación entre los planes de corto y largo plazo, Koontz afirma que:","o":["Nunca debe elaborarse un plan de corto plazo que no contribuya al cumplimiento del plan de largo plazo","Los planes de corto plazo deben hacerse sin referencia al largo plazo","El largo plazo es imposible de planear","Solo los planes de corto plazo son verificables"],"e":"Elaborar planes de corto plazo sin considerar el largo plazo es un grave error."},{"id":"14hhykf","l":"L33","u":"U3","s":"mat","q":"Según Koontz, las políticas permiten a los administradores:","o":["Delegar autoridad sin perder el control de las acciones de sus subordinados","Eliminar toda discrecionalidad de los subordinados al decidir","Sustituir a los presupuestos como instrumento de control","Evitar la planeación de los asuntos que se repiten"],"e":"Además, ayudan a decidir asuntos antes de que se vuelvan problemas y unifican otros planes."},{"id":"158gzr9","l":"L34","u":"U3","s":"mat","q":"La palabra «organización» proviene del griego «organon», que significa:","o":["Instrumento","Estructura","Orden","Organismo vivo"],"e":"Reyes Ponce añade que el término organismo implica partes y funciones diversas, unidad funcional, coordinación y autoconstrucción."},{"id":"16ahvt6","l":"L34","u":"U3","s":"mat","q":"Reyes Ponce define la organización como:","o":["La estructuración técnica de las relaciones entre funciones, niveles y actividades de los elementos materiales y humanos de un organismo social, para lograr su máxima eficiencia","El arreglo de las funciones que se estiman necesarias para lograr un objetivo, indicando la autoridad y responsabilidad asignadas a quienes las ejecutan","Un método de distribución de la autoridad y la responsabilidad que sirve para establecer canales prácticos de comunicación entre los grupos","Una unidad social dentro de la cual existe una relación estable entre sus integrantes, con el fin de facilitar la obtención de una serie de objetivos"],"e":"Las demás son de Terry, Petersen y Plowman y Litterer, respectivamente."},{"id":"1hhla57","l":"L34","u":"U3","s":"mat","q":"Según Reyes Ponce, la organización es importante porque:","o":["Es el último elemento de la mecánica y el punto de enlace entre «lo que debe ser» y «lo que es»","Es el primer elemento de la dinámica y donde se trata con personas concretas","Sustituye a la dirección, porque una vez organizada la empresa ya no es necesario mandar","Es la única etapa práctica del proceso; las demás son puramente teóricas"],"e":"Recoge y lleva a sus últimos detalles lo que señalaron la previsión y la planeación."},{"id":"n8v44c","l":"L34","u":"U3","s":"mat","q":"¿Por qué Reyes Ponce advierte contra confundir la organización con la integración?","o":["Porque se mezclaría la teoría con la práctica, lo ideal con lo real, y se perderían de vista las metas","Porque la integración pertenece a la previsión y no a la dinámica administrativa","Porque la organización solo se ocupa de los recursos materiales, no de las personas","Porque la Ley Federal del Trabajo prohíbe mezclar la estructura con la contratación"],"e":"Primero debe precisarse cómo debería ser la organización y después integrarla con los elementos disponibles."},{"id":"jrdtvz","l":"L34","u":"U3","s":"mat","q":"¿Cuál de los siguientes es un objetivo BÁSICO de la organización según Reyes Ponce?","o":["Suplir las limitaciones humanas","Ahorrar tiempo","Aumentar nuestras capacidades","Favorecer la especialización"],"e":"Básicos: suplir limitaciones, comunicar valores y lograr la eficacia con la mayor eficiencia. Los otros son objetivos derivados."},{"id":"v6ab2z","l":"L34","u":"U3","s":"mat","q":"«Cuanto más se divide el trabajo, dedicando a cada empleado a una actividad más limitada y concreta, se obtiene mayor eficiencia, precisión y destreza». Es el principio de:","o":["Especialización","Unidad de mando","Definición de puestos","Equilibrio de dirección-control"],"e":"Su límite es la superespecialización, que produce monotonía y lesiona la dignidad."},{"id":"2ua23g","l":"L34","u":"U3","s":"mat","q":"«Para cada función debe existir un solo mando». Es el principio de:","o":["Unidad de mando","Especialización","Vía jerárquica","Equilibrio autoridad-responsabilidad"],"e":"Urwick: un cuerpo con dos cabezas es tan monstruoso en lo administrativo como en lo biológico."},{"id":"1gq1r7t","l":"L34","u":"U3","s":"mat","q":"Según el principio de equilibrio de autoridad-responsabilidad:","o":["La autoridad se ejerce de arriba hacia abajo y la responsabilidad va en la misma línea, de abajo hacia arriba","La autoridad y la responsabilidad van ambas de abajo hacia arriba por la misma línea","Debe concederse más autoridad que responsabilidad para que el jefe pueda decidir","La responsabilidad nunca se comunica al jefe inferior; solo se le delega autoridad"],"e":"La autoridad sin responsabilidad es odiosa; la responsabilidad sin autoridad es quizá peor."},{"id":"7dcaiq","l":"L34","u":"U3","s":"mat","q":"«A cada grado de delegación debe corresponder el establecimiento de los controles adecuados». ¿Qué principio es?","o":["Equilibrio de dirección-control","Equilibrio de autoridad-responsabilidad","Unidad de mando","Especialización"],"e":"Lo retoma también en la primera regla de la delegación."},{"id":"11i9lfv","l":"L34","u":"U3","s":"mat","q":"Según Reyes Ponce, en el PRIMER nivel jerárquico la división de funciones es casi siempre:","o":["Funcional","Por producto","Por territorio","Por número"],"e":"En los niveles siguientes se usan otros criterios: producto, territorio, comprador, proceso o número."},{"id":"1wq875i","l":"L34","u":"U3","s":"mat","q":"Dividir a los vendedores en zona norte, zona centro y zona sur es departamentalizar por:","o":["Territorio","Producto","Proceso","Comprador"],"e":"Por comprador: departamentos para señoras, caballeros y niños. Por proceso: almacén, troqueles, pintura, armado."},{"id":"1qefd2j","l":"L34","u":"U3","s":"mat","q":"En una planta con secciones de almacén, troqueles, pintura, armado y empaque, la departamentalización es por:","o":["Proceso","Producto","Número","Función"],"e":"Cada sección corresponde a una fase del proceso productivo."},{"id":"bpmsth","l":"L34","u":"U3","s":"mat","q":"Según Reyes Ponce, en toda empresa las funciones básicas son tres:","o":["Producción, ventas y finanzas","Planeación, organización y control","Personal, compras y contabilidad","Dirección, supervisión y ejecución"],"e":"En la mayoría de las empresas modernas se añade la función de personal."},{"id":"qhr9qh","l":"L34","u":"U3","s":"mat","q":"El sistema de organización en el que la autoridad y la responsabilidad se transmiten íntegramente por una sola línea para cada persona o grupo es el:","o":["Lineal o militar","Funcional o de Taylor","Lineal y staff","Matricial"],"e":"Ventajas: sencillo, sin conflictos de autoridad, rapidez y disciplina; útil en la pequeña empresa."},{"id":"1wn8rx1","l":"L34","u":"U3","s":"mat","q":"¿Cuál es la principal DESVENTAJA del sistema lineal o militar?","o":["Se carece casi totalmente de los beneficios de la especialización","Se presenta con frecuencia la duplicidad de mando entre jefes","Surgen fugas de responsabilidad por la falta de un jefe único","Es muy costoso y temporal, por lo que solo sirve en grandes empresas"],"e":"También: es poco flexible, los jefes están recargados de detalles y la organización descansa en «hombres»."},{"id":"3b8ybf","l":"L34","u":"U3","s":"mat","q":"Taylor propuso dividir el trabajo del mayordomo entre ocho especialistas, cada uno con autoridad en su campo. Este es el sistema:","o":["Funcional","Lineal","Lineal y staff","Multidivisional"],"e":"Ventaja: especialización. Desventaja: duplicidad de mando y fugas de responsabilidad."},{"id":"1s06su1","l":"L34","u":"U3","s":"mat","q":"La principal desventaja del sistema funcional de Taylor es:","o":["La duplicidad de mando y las fugas de responsabilidad","La falta de especialización","Que es demasiado sencillo","Que solo sirve en empresas pequeñas"],"e":"Es difícil delimitar la autoridad de cada jefe en los aspectos que son comunes a varios."},{"id":"1e4j8t7","l":"L34","u":"U3","s":"mat","q":"El sistema que conserva la autoridad de línea y la complementa con asesoría y servicio de técnicos especializados, preferido por las grandes organizaciones, es:","o":["Lineal y staff","Funcional","Lineal o militar","Por comités"],"e":"Su éxito depende de precisar qué significan «asesoramiento» y «servicio»."},{"id":"1kgkvag","l":"L34","u":"U3","s":"mat","q":"El jefe staff debe hacer notar constantemente que:","o":["No obra con autoridad propia, sino delegada, a nombre y en representación de la línea","Tiene autoridad formal sobre los jefes de línea en los asuntos de su especialidad","Sus recomendaciones son obligatorias para la línea una vez aprobadas por él","No necesita la autorización de los jefes de línea para implantar sus sistemas"],"e":"Su autoridad es técnica (convencimiento). Para ciertos servicios conviene una doble autorización, de la línea y del staff."},{"id":"hglnhw","l":"L34","u":"U3","s":"mat","q":"¿Cuál es una desventaja típica del sistema lineal y staff?","o":["Los jefes de línea consideran a los staff intrusos y teóricos, y se confunden los campos de autoridad","Carece casi totalmente de los beneficios de la especialización técnica","Genera una duplicidad de mando permanente sobre todos los trabajadores","Es un sistema temporal y muy costoso, aplicable solo a grandes proyectos"],"e":"Además, el staff ve a la línea como incompetente y sus recomendaciones se interpretan mal."},{"id":"13hocyp","l":"L34","u":"U3","s":"mat","q":"La organización por proyectos (matricial) tuvo su origen en:","o":["La NASA","General Motors","La Western Electric","La Ford Motor Company"],"e":"Por ejemplo, el proyecto Apolo XI; luego pasó a la Armada de Estados Unidos y a las grandes empresas."},{"id":"ck79bi","l":"L34","u":"U3","s":"mat","q":"En la organización matricial, en caso de conflicto entre el jefe ordinario y el jefe de proyecto, según Reyes Ponce:","o":["Se supone preferente la autoridad del jefe matricial (de proyecto)","Siempre prevalece la autoridad del jefe funcional ordinario","Decide un comité formado por los accionistas de la empresa","Se suspende el proyecto hasta que el conflicto se resuelva"],"e":"Además, es un sistema temporal, costoso y propio de las grandes empresas."},{"id":"1imloyo","l":"L34","u":"U3","s":"mat","q":"En la organización MULTIDIVISIONAL, las decisiones estratégicas y de largo plazo se toman en:","o":["El nivel divisional","Cada empresa subordinada","Los supervisores inmediatos","El departamento staff"],"e":"En cada empresa se toman las decisiones tácticas y de corto plazo."},{"id":"x0wbh7","l":"L34","u":"U3","s":"mat","q":"¿Qué deben contener los organigramas según Reyes Ponce?","o":["Nombres de funciones, no de personas","Los nombres de todos los trabajadores","Todas las relaciones informales","Las facultades detalladas de cada puesto"],"e":"Si se desea incluir a la persona, se escribe con letra menor, debajo del nombre del puesto. Los detalles van en los manuales y en los análisis de puestos."},{"id":"1kz1lf3","l":"L34","u":"U3","s":"mat","q":"En los organigramas, la autoridad de staff suele representarse con:","o":["Línea punteada","Línea llena","Línea doble","Color rojo"],"e":"La autoridad lineal se marca con línea llena."},{"id":"y9924c","l":"L34","u":"U3","s":"mat","q":"El «efecto de triangulación» es una desventaja de los organigramas:","o":["Verticales","Horizontales","Circulares","Escalares"],"e":"Se soluciona con una carta maestra y cartas suplementarias, o colocando a los subordinados uno sobre otro."},{"id":"1gacwx","l":"L34","u":"U3","s":"mat","q":"Los organigramas que eliminan o disminuyen la idea de estatus más alto o más bajo son los:","o":["Circulares","Verticales","Horizontales","Escalares"],"e":"Su desventaja es que resultan confusos y difíciles de leer."},{"id":"w6r4l1","l":"L34","u":"U3","s":"mat","q":"Los organigramas que siguen la forma normal de lectura (de izquierda a derecha) y reducen la triangulación son los:","o":["Horizontales","Verticales","Circulares","Escalares"],"e":"Aunque son poco usados en la práctica."},{"id":"1tnmkxh","l":"L34","u":"U3","s":"mat","q":"Cuando un jefe agrega auxiliares que siguen dependiendo directamente de él, sin crear nuevos niveles, hay crecimiento:","o":["Horizontal","Vertical","Diagonal","Matricial"],"e":"El crecimiento horizontal aumenta el tramo de control; el vertical aumenta los niveles y entorpece la comunicación."},{"id":"eb9rq8","l":"L34","u":"U3","s":"mat","q":"El principal inconveniente del crecimiento VERTICAL es:","o":["Dificulta la rapidez y la eficacia de la comunicación, porque la orden pasa por varios jefes","Aumenta el tramo de control, porque el jefe tiene que supervisar a más personas directamente","Reduce el número de niveles jerárquicos y con ello la capacidad de supervisión","Elimina la especialización, porque los nuevos jefes asumen funciones de todos"],"e":"Cuantos más niveles hay, más se distorsiona el mensaje."},{"id":"1r0xea7","l":"L34","u":"U3","s":"mat","q":"Según la teoría de Graicunas, con 3 subordinados un jefe tiene un total de:","o":["18 relaciones","6 relaciones","9 relaciones","44 relaciones"],"e":"1 → 1; 2 → 6; 3 → 18; 4 → 44; 5 → 100. Crecen geométricamente."},{"id":"10ohsem","l":"L34","u":"U3","s":"mat","q":"Graicunas distingue tres tipos de relaciones en la supervisión:","o":["Directas, cruzadas y de grupo","Formales, informales y mixtas","Lineales, funcionales y staff","Verticales, horizontales y diagonales"],"e":"Por eso, al aumentar el número de subordinados la supervisión se complica de forma desproporcionada."},{"id":"10v53xn","l":"L34","u":"U3","s":"mat","q":"¿Qué factor PERMITE ampliar el tramo de control?","o":["Que las operaciones supervisadas sean poco complejas y muy semejantes","Que los subordinados sean nuevos e inexpertos","Que las operaciones sean muy distintas entre sí","Que el jefe no cuente con staff"],"e":"También lo amplían la buena capacidad del personal y el apoyo de un staff."},{"id":"16r2van","l":"L34","u":"U3","s":"mat","q":"En términos generales, según Reyes Ponce, el número de personas que reportan a un alto directivo debe ser de:","o":["Entre 4 y 8","Entre 10 y 20","Entre 20 y 30","Solo 1 o 2"],"e":"En los niveles bajos de supervisión es normal supervisar entre 10 y 20."},{"id":"qdlhcu","l":"L34","u":"U3","s":"mat","q":"Sobre la centralización y la descentralización, Fayol considera que lo más importante es:","o":["Fijar con precisión el grado en que se delega y se controla, adecuarlo a la empresa y mantenerlo estable","Descentralizar siempre al máximo, porque la empresa grande no puede controlarse desde arriba","Centralizar siempre al máximo, porque es el medio más preciso para coordinar las decisiones","Cambiar periódicamente de sistema para adaptarse a las circunstancias de cada momento"],"e":"Ni la centralización total ni la descentralización total son posibles: son tendencias."},{"id":"1s7gh4m","l":"L34","u":"U3","s":"mat","q":"Según Reyes Ponce, la pequeña empresa tiende a ser más ___ porque el jefe conoce a todas las personas y situaciones.","o":["centralizada","descentralizada","desconcentrada","matricial"],"e":"En la gran empresa conviene más descentralización: las decisiones deben tomarse en el nivel donde se presentan los problemas."},{"id":"bqbt19","l":"L34","u":"U3","s":"mat","q":"Según Reyes Ponce, el puesto es una unidad de trabajo:","o":["Específica e impersonal","General y personal","Temporal y colectiva","Informal y flexible"],"e":"Impersonal: no se refiere a quién lo ocupa (puede haber un puesto de chofer y veinte choferes)."},{"id":"15wc140","l":"L34","u":"U3","s":"mat","q":"En el análisis de puestos, la ESPECIFICACIÓN se refiere a:","o":["Lo que el trabajador requiere para desempeñar el puesto: habilidad, esfuerzo, responsabilidad y condiciones de trabajo","Lo que el trabajador debe hacer: encabezado, descripción genérica y descripción específica","La posición del puesto en el organigrama y sus líneas de autoridad y responsabilidad","El salario y las prestaciones que corresponden al puesto según el tabulador"],"e":"La DESCRIPCIÓN es lo que el trabajador debe hacer (encabezado, descripción genérica y descripción específica)."},{"id":"nfjcum","l":"L34","u":"U3","s":"mat","q":"En la descripción específica de un puesto, las operaciones se clasifican en:","o":["Permanentes, periódicas y eventuales","Lineales, funcionales y staff","Directas, cruzadas y de grupo","Principales, secundarias y colaterales"],"e":"Con una estimación aproximada del tiempo que requiere cada una."},{"id":"1qf6ey7","l":"L34","u":"U3","s":"mat","q":"La carta de distribución de trabajo sirve para analizar las labores de:","o":["Grupos pequeños, de entre 5 y 15 personas, cuyas labores están relacionadas","Toda la empresa, desde la asamblea de accionistas hasta los supervisores","Los altos ejecutivos individualmente, con periodos de semanas o meses","Los comités, para determinar su costo en tiempo y dinero"],"e":"Se anotan las horas por semana de cada deber y se analiza con preguntas como qué, quién, cómo, por qué, dónde y cuándo."},{"id":"hilnme","l":"L34","u":"U3","s":"mat","q":"Un comité cuya misión es aportar puntos de vista a quien decidirá, sin facultad para decidir ni ejecutar, es un comité:","o":["Consultivo","Decisorio","Ejecutivo","De investigación"],"e":"Los decisorios limitan la autoridad de un funcionario, porque requieren mayoría de votos."},{"id":"1a482ej","l":"L34","u":"U3","s":"mat","q":"¿Cuál es un inconveniente de los comités según Reyes Ponce?","o":["Pueden hacer perder la responsabilidad individual de los jefes","Aportan puntos de vista distintos y complementarios","Coordinan mejor los planes y las políticas","Motivan a los funcionarios inferiores a participar"],"e":"Otros inconvenientes: costo en tiempo y dinero, transacciones poco recomendables, dominio de un líder o tiranía de una minoría."},{"id":"45javy","l":"L34","u":"U3","s":"mat","q":"Según Reyes Ponce, los comités suelen ser POCO recomendables como:","o":["Ejecutores","Órganos consultivos","Medios para coordinar políticas","Medios para transmitir información"],"e":"Conviene responsabilizar de la ejecución a uno o varios funcionarios concretos."},{"id":"154gncn","l":"L34","u":"U3","s":"mat","q":"Las tres causas fundamentales de la complejidad organizacional son:","o":["Diferenciación horizontal, diferenciación vertical y dispersión espacial","Tamaño de la organización, profesionalización y cambios del medio","Centralización, formalización y especialización de los puestos","Número de comités, de organigramas y de manuales de la empresa"],"e":"El tamaño, la profesionalización y los cambios del medio son causas derivadas."},{"id":"1r6tz7j","l":"L34","u":"U3","s":"mat","q":"¿Cuál es un EFECTO de una mayor complejidad organizacional según Reyes Ponce?","o":["Requiere una mayor descentralización","Reduce la necesidad de comunicación","Disminuye la incertidumbre en las decisiones","Elimina los conflictos"],"e":"También exige más preparación, más comunicación y control y más información, y aumenta los conflictos."},{"id":"1egrz5n","l":"L34","u":"U3","s":"mat","q":"En el caso del capítulo 9 (el Jefe de Personal que debía autorizar las salidas y los aumentos de sueldo de los jefes), ¿qué principio se violó de forma más evidente?","o":["Se dio a un staff autoridad de línea sobre otros jefes, lo que rompe la unidad de mando","El principio de especialización, porque el Jefe de Personal no era experto","El principio de medición de la previsión","La regla de las seis preguntas"],"e":"Un staff debe asesorar y servir, no mandar. Encima, se le colocó bajo el Gerente de Fabricación sin consultarlo."},{"id":"1shgst8","l":"L35","u":"U3","s":"mat","q":"Rodríguez Valencia describe la estructura organizacional como la ___ de la organización.","o":["anatomía","fisiología","cultura","psicología"],"e":"Es la armazón de puestos, reglas, autoridad y procesos que regula la conducta y reduce la incertidumbre."},{"id":"w3fq1y","l":"L35","u":"U3","s":"mat","q":"Según Thompson, la interdependencia en la que una tarea debe concluir antes de que inicie la siguiente es:","o":["Lineal (secuencial)","Común (mancomunada)","Recíproca","Matricial"],"e":"Común: unidades autónomas que comparten la pertenencia. Recíproca: las salidas de una son los insumos de la otra, y viceversa."},{"id":"1y648nt","l":"L35","u":"U3","s":"mat","q":"Cuando las salidas de una unidad son los insumos directos de otra, en una relación de intercambio bidireccional, la interdependencia es:","o":["Recíproca","Lineal","Común","Vertical"],"e":"Es la que exige mayor coordinación."},{"id":"d39lq9","l":"L35","u":"U3","s":"mat","q":"¿Cuál NO es una de las cuatro decisiones fundamentales del diseño organizacional (Ivancevich)?","o":["Fijar el precio de los productos","División del trabajo","Delegación de autoridad","Margen o tramo de control"],"e":"Las cuatro son la división del trabajo, la delegación de autoridad, la departamentalización y el tramo de control."},{"id":"1me1wtd","l":"L35","u":"U3","s":"mat","q":"Un tramo de control ESTRECHO (pocos subordinados por jefe) produce una estructura:","o":["Alta (vertical)","Plana (horizontal)","Matricial","Virtual"],"e":"Estructura alta: más control, pero más costos y distorsión de la información. Estructura plana: decisiones rápidas, pero exige empleados capacitados."},{"id":"1sfecdm","l":"L35","u":"U3","s":"mat","q":"La dimensión estructural que mide el grado en que reglas, políticas, manuales y procedimientos están escritos e impuestos es la:","o":["Formalización","Centralización","Complejidad","Especialización"],"e":"Centralización: dónde está el poder de decidir. Complejidad: número de unidades y niveles."},{"id":"1d299ua","l":"L35","u":"U3","s":"mat","q":"La principal DESVENTAJA de la estructura funcional es:","o":["La dificultad de coordinación interdepartamental y la visión de «túnel» (silos)","La duplicación de recursos","La falta de especialización técnica","Los costos altos por no aprovechar economías de escala"],"e":"La duplicación de recursos es el riesgo de la estructura divisional."},{"id":"1yxtr0z","l":"L35","u":"U3","s":"mat","q":"La estructura que agrupa las tareas por producto, cliente, territorio o tecnología y permite operar unidades autónomas como centros de utilidades es la:","o":["Divisional","Funcional","Lineal","Reticular"],"e":"Se enfoca en adaptarse al mercado; su riesgo es duplicar recursos y costos."},{"id":"1s9m7q7","l":"L35","u":"U3","s":"mat","q":"Según Lazear y Gibbs, un diseño es modular cuando:","o":["Se divide en partes independientes con poco acoplamiento y mucha cohesión","Todas las partes dependen fuertemente unas de otras","Tiene un solo módulo central","Elimina la cohesión interna"],"e":"Esto reduce los costos de coordinación."},{"id":"1baf8tj","l":"L35","u":"U3","s":"mat","q":"La estructura en la que cada empleado responde a dos jefes (el supervisor funcional y el gerente de proyecto) es la:","o":["Matricial","Reticular","Ilimitada","Lineal"],"e":"Superpone una estructura horizontal por proyecto sobre la vertical funcional."},{"id":"4wdsd3","l":"L35","u":"U3","s":"mat","q":"Una empresa que subcontrata casi todas sus funciones con socios externos conectados por medios electrónicos tiene una estructura:","o":["Reticular (red o virtual)","Matricial","Funcional","Mecanicista"],"e":"Se enfoca en la flexibilidad y en la contratación externa."},{"id":"x9qil3","l":"L35","u":"U3","s":"mat","q":"El modelo de diseño que busca la máxima eficiencia con alta especialización, centralización y formalización rígida (ejemplo: UPS) es el:","o":["Mecanicista","Orgánico","Reticular","Ilimitado"],"e":"Se asocia con Fayol, Weber y el Sistema 1 de Likert."},{"id":"xa8lcl","l":"L35","u":"U3","s":"mat","q":"El modelo ORGÁNICO es más adecuado para:","o":["Entornos dinámicos que requieren adaptabilidad","Entornos estables y rutinarios","Producción en masa uniforme","Organizaciones militares tradicionales"],"e":"Es descentralizado e informal, con equipos autodirigidos y polivalencia."},{"id":"1tv5l1d","l":"L35","u":"U3","s":"mat","q":"Según Lazear y Gibbs, el problema de coordinación que consiste en combinar conocimientos específicos dispersos para tomar decisiones complejas es la:","o":["Integración","Sincronización","Formalización","Centralización"],"e":"La sincronización armoniza ritmos y tiempos sin requerir comunicación estrecha continua."},{"id":"uvwm99","l":"L35","u":"U3","s":"mat","q":"En el caso «La parálisis de Logística» (Logística & Servicios Alfa), Ventas promete fechas imposibles y Producción culpa a I+D. Esto refleja principalmente:","o":["Silos por una estructura funcional rígida y fallas de integración","Exceso de descentralización y de autonomía en los equipos","Una cultura organizacional demasiado fuerte y cohesiva","Falta de especialización técnica del departamento de I+D"],"e":"Además, los 7 niveles jerárquicos causaban lentitud y distorsión de la información."},{"id":"1tpgu5f","l":"L35","u":"U3","s":"mat","q":"Según Mintzberg, la centralización es:","o":["El medio más preciso para coordinar la toma de decisiones en la organización","Siempre el diseño más adecuado, sin importar el tamaño de la organización","Imposible en organizaciones pequeñas, porque el dueño no puede decidir todo","Sinónimo de desconcentración, porque implica separar físicamente los servicios"],"e":"Un único cerebro decide y lo pone en práctica mediante supervisión. Pero no todo puede entenderse en un solo centro."},{"id":"147lzyf","l":"L35","u":"U3","s":"mat","q":"Según Mintzberg, el error más frecuente en el diseño de las organizaciones es:","o":["Centralizar la toma de decisiones, a causa de las limitaciones cognoscitivas","Descentralizar demasiado, porque se pierde la coordinación","Tener demasiados organigramas y manuales de organización","Usar comités en lugar de jefes individuales para decidir"],"e":"Jay (1970): con exceso de centralización, quienes tienen el conocimiento deben pasar sus decisiones a superiores sin contacto con la realidad."},{"id":"1o30z75","l":"L35","u":"U3","s":"mat","q":"Para Mintzberg, la dispersión del poder conforme se desciende por la escala de autoridad lineal se denomina descentralización:","o":["Vertical","Horizontal","Física","Funcional"],"e":"El tercer uso del término es la dispersión física de los servicios."},{"id":"heto5","l":"L35","u":"U3","s":"mat","q":"¿Cuál es una ventaja de la DEScentralización según los materiales?","o":["Permite reaccionar con rapidez ante las condiciones locales y se relaciona positivamente con el desempeño","Asegura la máxima uniformidad en las decisiones de todas las áreas","Elimina la necesidad de establecer controles sobre los delegados","Concentra toda la información relevante en un solo centro decisor"],"e":"Hsiao y Wu (2020): la autonomía del personal se relaciona directa y positivamente con el desempeño."},{"id":"y698u3","l":"L36","u":"U3","s":"mat","q":"Según Ivancevich, la «cultura nacional» se define como:","o":["La suma total de creencias, rituales, reglas, costumbres, artefactos e instituciones que caracterizan a una población","El conjunto de leyes, reglamentos y normas oficiales que rigen en un país","El patrón de premisas básicas que una empresa transmite a sus nuevos miembros","El nivel educativo y el ingreso promedio que caracterizan a una población"],"e":"Los valores, por su parte, son deseos o necesidades afectivas y conscientes que guían el comportamiento."},{"id":"3nmfx8","l":"L36","u":"U3","s":"mat","q":"La idea de que cada empleado llega a la empresa con un «software mental» o programación colectiva de su sociedad se asocia con:","o":["Geert Hofstede","Edgar Schein","Kathy Kram","Max Weber"],"e":"Por eso ningún empleado ingresa con una mentalidad «neutra»."},{"id":"ravsw5","l":"L36","u":"U3","s":"mat","q":"En la dimensión de Hofstede «distancia del poder», una cultura con distancia ALTA tiende a:","o":["Una estructura centralizada y una cadena de mando rígida","La descentralización y un estilo participativo","La informalidad y la innovación","La armonía grupal"],"e":"Distancia baja → descentralización y estilo participativo."},{"id":"1so7v8z","l":"L36","u":"U3","s":"mat","q":"Una cultura con alta EVASIÓN DE LA INCERTIDUMBRE se caracteriza por:","o":["Leyes y reglas estrictas, con bajo riesgo","Informalidad, innovación y alta movilidad","Énfasis en las relaciones y la calidad de vida","Resultados inmediatos y respeto a la tradición"],"e":"Una evasión baja implica informalidad, innovación y alta movilidad."},{"id":"1u548i4","l":"L36","u":"U3","s":"mat","q":"La dimensión cultural «orientación al largo plazo» fue aportada por:","o":["Michael Bond","Geert Hofstede","Edgar Schein","Mainiero y Tromley"],"e":"Hofstede propuso las cuatro primeras; Bond (1987) añadió la quinta."},{"id":"drcgx7","l":"L36","u":"U3","s":"mat","q":"La dimensión de Hofstede que contrasta la asertividad y el materialismo con las relaciones y la calidad de vida es:","o":["Masculinidad vs. feminidad","Individualismo vs. colectivismo","Distancia del poder","Evasión de la incertidumbre"],"e":"Masculina: alta tensión laboral y conflicto entre rol y familia. Femenina: equilibrio y énfasis en las relaciones."},{"id":"rb6jp3","l":"L36","u":"U3","s":"mat","q":"Según Edgar Schein, la cultura organizacional es un patrón de premisas básicas desarrolladas por un grupo al aprender a enfrentar problemas de:","o":["Adaptación externa e integración interna","Productividad y costos","Planeación y control","Reclutamiento y selección"],"e":"Esas premisas han funcionado lo bastante bien para considerarse válidas y transmitirse a los nuevos miembros."},{"id":"11jpsfe","l":"L36","u":"U3","s":"mat","q":"En el modelo de tres capas de Schein, la capa VISIBLE pero no siempre descifrable (documentos, mobiliario, jerga, tecnología) es la de:","o":["Artefactos y creaciones","Valores","Premisas básicas","Normas de grupo"],"e":"Capa I: artefactos. Capa II: valores. Capa III: premisas básicas (invisibles, preconscientes)."},{"id":"1w4220l","l":"L36","u":"U3","s":"mat","q":"En el modelo de Schein, las premisas básicas (la naturaleza humana, la relación con el entorno, la realidad, el tiempo):","o":["Son invisibles, preconscientes y se aceptan sin cuestionamiento","Son visibles en el mobiliario y la vestimenta","Están escritas en el código de ética","Son la capa más superficial"],"e":"En la analogía del edificio son los cimientos; los valores son los planos y los artefactos, la fachada."},{"id":"zxzipo","l":"L36","u":"U3","s":"mat","q":"Una cultura organizacional FUERTE se caracteriza porque:","o":["La gran mayoría de los empleados comparten y aceptan los valores centrales, lo que da coherencia sin burocracia excesiva","Hay poca alineación en los valores básicos, por lo que la empresa impone reglas y supervisión rígida","Sus valores están escritos en un folleto que la dirección reparte a todo el personal","Depende de que cada empleado conserve los valores de su cultura nacional sin modificarlos"],"e":"Ejemplos: Toyota, Southwest Airlines, Disney. Una cultura débil obliga a imponer reglas y supervisión rígida."},{"id":"1a943tb","l":"L36","u":"U3","s":"mat","q":"Llamar a alguien «Mickey» como cumplido por un buen trabajo es, en la cultura de Disney, un ejemplo de:","o":["Frases compartidas","Cosas compartidas","Comportamiento compartido","Sentimientos compartidos"],"e":"Cosas: uniformes temáticos. Comportamiento: sonreír siempre al cliente. Sentimientos: orgullo de pertenencia."},{"id":"1siwudh","l":"L36","u":"U3","s":"mat","q":"El caso de la empresa electrónica de California que repartió un folleto de valores ideales demuestra que:","o":["La cultura no puede decretarse de la noche a la mañana con un documento","Los folletos de valores siempre fortalecen la cultura","La comunicación descendente es suficiente para crear cultura","La cultura depende solo de la tecnología"],"e":"La brecha entre el folleto y la práctica diaria produjo escepticismo, baja moral, rotación y, al final, la bancarrota."},{"id":"191gkay","l":"L36","u":"U3","s":"mat","q":"Según Schein, la cultura organizacional:","o":["Evoluciona como resultado de presiones externas, fuerzas internas, respuestas a sucesos cruciales y factores fortuitos","Se impone por decreto de la alta dirección mediante un documento de valores ideales","Es idéntica a la cultura nacional del país donde opera la empresa","No cambia nunca, porque las premisas básicas son innatas e inalterables"],"e":"Ejemplos: McDonald's, Walt Disney y Nordstrom."},{"id":"yg0jlq","l":"L36","u":"U3","s":"mat","q":"Según Mainiero y Tromley, ¿cuál es el PRIMER punto de intervención para un cambio de cultura?","o":["El comportamiento: lograr que la gente actúe distinto (acción antes que discurso)","Eliminar a los miembros que se desvían de la cultura deseada","Contratar y socializar a personal nuevo que encaje en la cultura","Comunicar mensajes culturales mediante relatos, rituales y credos"],"e":"Le siguen las justificaciones del comportamiento, los mensajes culturales, la contratación y socialización y la eliminación de quienes se desvían."},{"id":"zr8hny","l":"L36","u":"U3","s":"mat","q":"Según Mainiero y Tromley, separar a quienes se niegan a adaptarse y sabotean el sistema de valores deseado, tras evaluar costos y beneficios, es la intervención de:","o":["Depuración del sistema (eliminación de los miembros que se desvían)","Refuerzo simbólico (mensajes culturales)","Renovación del talento (contratación y socialización)","Acción antes que discurso (comportamiento)"],"e":"Es la quinta y última intervención."},{"id":"1yojiw1","l":"L36","u":"U3","s":"mat","q":"La socialización organizacional es:","o":["El proceso por el que la empresa transmite sus valores, actitudes y premisas a los nuevos miembros para lograr un ajuste mutuo","El conjunto de actividades recreativas que organiza la empresa para integrar al personal","El proceso de atraer candidatos externos potencialmente calificados para un puesto","La apreciación sistemática de la calidad del trabajo de cada empleado"],"e":"Es la «aculturación» laboral; empieza incluso antes de contratar."},{"id":"1gyufxg","l":"L36","u":"U3","s":"mat","q":"La etapa de socialización en la que la persona adquiere información previa sobre el puesto y forma expectativas realistas es la:","o":["Socialización anticipada","Adaptación (encuentro)","Gestión de la función","Redefinición"],"e":"Adaptación: aprender las tareas e integrarse. Gestión de la función: manejar el conflicto entre trabajo y vida personal."},{"id":"111fjz0","l":"L36","u":"U3","s":"mat","q":"Manejar el conflicto entre el trabajo y la vida personal, logrando compromiso sostenido y retención, corresponde a la etapa de socialización de:","o":["Gestión de la función","Socialización anticipada","Adaptación","Iniciación"],"e":"Su resultado exitoso es el compromiso sostenido, bajo estrés y la retención del talento."},{"id":"10w4201","l":"L36","u":"U3","s":"mat","q":"Según Kathy Kram, el patrocinio, la formación, las tareas desafiantes y la visibilidad directiva son funciones del mentoring de tipo:","o":["Profesional","Psicosocial","Disciplinario","Cultural"],"e":"Las psicosociales son la asesoría, la amistad, la aceptación, la confirmación y el modelado de conducta."},{"id":"17zppjd","l":"L36","u":"U3","s":"mat","q":"La fase del mentoring en la que se expanden al máximo las funciones profesionales y psicosociales (dura de 2 a 5 años) es:","o":["Cultivo","Iniciación","Separación","Redefinición"],"e":"Iniciación: de 6 meses a 1 año. Separación: de 6 meses a 2 años. Redefinición: indefinida (amistad entre pares)."},{"id":"1na6omm","l":"L36","u":"U3","s":"mat","q":"¿Cuál de las siguientes es una dimensión SECUNDARIA (adquirida o modificable) de la diversidad?","o":["Antecedentes educativos","Edad","Origen étnico","Raza"],"e":"Medulares (innatas): edad, origen étnico, género, atributos físicos, raza y orientación sexual. Secundarias: educación, estado civil, creencias religiosas y experiencia laboral."},{"id":"fdthld","l":"L36","u":"U3","s":"mat","q":"Según Ivancevich, la diferencia entre religión y espiritualidad laboral es que:","o":["La religión es un sistema formal de creencias y dogma; la espiritualidad laboral reconoce una vida interior que se alimenta de un trabajo significativo","Son sinónimos: ambas implican un sistema formal de creencias, dogma y código de conducta","La espiritualidad laboral exige que los empleados pertenezcan a la misma iglesia que los dueños","La religión se refiere a la cultura organizacional y la espiritualidad a la cultura nacional"],"e":"Mitroff y Denton: los empleados con más desarrollo espiritual muestran más compromiso y menor intención de renunciar."},{"id":"1vptphy","l":"L36","u":"U3","s":"mat","q":"Ben & Jerry's es, según los modelos de espiritualidad de Mitroff y Denton, un ejemplo de organización:","o":["Socialmente responsable","Religiosa","De recuperación","Evolucionista"],"e":"Recuperación: Alcohólicos Anónimos. Evolucionista: YMCA. Basada en valores: Kingston Technology. Religiosa: Ag Reserves."},{"id":"1nk4a7z","l":"L36","u":"U3","s":"mat","q":"Los elementos de una cultura cohesiva (Gross y Shichman) incluyen desarrollar un sentido de:","o":["Historia, identidad, pertenencia e intercambio entre los miembros","Competencia interna, castigo y control estricto","Jerarquía, antigüedad y apego a la burocracia","Individualismo, distancia del poder y evasión de la incertidumbre"],"e":"Se logran con relatos de héroes, liderazgo, recompensas, socialización, capacitación y decisiones participativas."},{"id":"1kzzd1h","l":"L37","u":"U3","s":"mat","q":"Para Reyes Ponce, la dirección es:","o":["La esencia y el corazón de la administración","Una etapa secundaria de la mecánica","Lo mismo que el control","Sinónimo de «management»"],"e":"Todas las etapas de la mecánica se ordenan a preparar la dinámica, y en ella la central es la dirección."},{"id":"p4xziw","l":"L37","u":"U3","s":"mat","q":"Según Reyes Ponce, la frase correcta es:","o":["No se coordina para dirigir, sino que se dirige para coordinar","Se coordina para dirigir","Dirigir y coordinar son lo mismo","La dirección es la esencia misma de la coordinación"],"e":"La esencia de la administración es coordinar; la dirección es una de sus causas, la más importante."},{"id":"jg8cfa","l":"L37","u":"U3","s":"mat","q":"Reyes Ponce considera un error traducir «management» como «dirección» porque:","o":["Equivale a tomar el todo (la actividad administrativa) por una de sus partes","Management se refiere solo a la función de control y vigilancia de resultados","Dirección es un concepto más amplio que management, porque incluye la planeación","Management se refiere solo a los dueños de la empresa y no a los jefes"],"e":"Fayol y Taylor entendían el management como la actividad administrativa total."},{"id":"1hvnerq","l":"L37","u":"U3","s":"mat","q":"¿Por qué la dirección es la etapa de mayor imprevisibilidad?","o":["Porque se trata con personas concretas y situaciones reales, donde es difícil prever las reacciones humanas","Porque carece de principios y reglas, a diferencia de las demás etapas","Porque se realiza antes de planear y organizar, sin bases técnicas","Porque solo la realizan los supervisores inmediatos, con poca preparación"],"e":"En la mecánica se trata con relaciones ideales; en la dirección, con las cosas «como son realmente»."},{"id":"a08kb","l":"L37","u":"U3","s":"mat","q":"El principio de la dirección según el cual el fin común se logra más fácilmente cuanto mejor se armonizan los intereses de grupo e individuales es el de:","o":["Coordinación de intereses","Impersonalidad del mando","Vía jerárquica","Resolución de conflictos"],"e":"Es un error creer que la máxima eficiencia se obtiene sacrificando los intereses particulares."},{"id":"8kcwoq","l":"L37","u":"U3","s":"mat","q":"Un jefe superior da órdenes constantemente a los trabajadores saltándose a sus jefes intermedios. ¿Qué principio viola?","o":["Vía jerárquica","Coordinación de intereses","Aprovechamiento del conflicto","Bilateralidad"],"e":"Esto debilita la autoridad de los jefes intermedios y genera duplicidad de mando. Solo se justifica de forma excepcional, explicándolo y avisando."},{"id":"10nh2kg","l":"L37","u":"U3","s":"mat","q":"Según Reyes Ponce, nombrar «ayudantes», «asistentes» o «subjefes» sin autoridad, pero colocados como un nivel intermedio en el organigrama:","o":["Es un error que propicia la ruptura de la vía jerárquica y graves problemas","Fortalece la unidad de mando, porque descarga de detalles al jefe superior","Es la mejor forma de delegar autoridad sin perder el control","Sustituye ventajosamente al staff en las empresas pequeñas"],"e":"Se crean personas sin autoridad en quienes se pretende descargar responsabilidad."},{"id":"rtyqgc","l":"L37","u":"U3","s":"mat","q":"Sobre los conflictos, el principio de resolución de conflictos de Reyes Ponce establece que:","o":["Deben resolverse lo antes posible, aunque la solución no satisfaga a todos","Es mejor dejar que se resuelvan solos con el tiempo","Deben ignorarse para no lesionar la disciplina","Solo debe resolverlos un comité"],"e":"La incertidumbre y la permanencia del conflicto dañan más que una solución imperfecta."},{"id":"zycte4","l":"L37","u":"U3","s":"mat","q":"Un aumento salarial que no reduce las utilidades porque se concede con base en una mayor productividad ilustra la solución de conflictos por:","o":["Integración","Dominación","Compromiso","Conciliación"],"e":"Ambas partes logran íntegramente lo que buscan al replantear el problema (Follett)."},{"id":"15s0qct","l":"L37","u":"U3","s":"mat","q":"Reyes Ponce llama a la comunicación:","o":["El sistema nervioso de la administración","El corazón de la administración","La esencia del control","El último elemento de la mecánica"],"e":"El corazón de la administración es la dirección."},{"id":"ws54ug","l":"L37","u":"U3","s":"mat","q":"Según Reyes Ponce, la comunicación es un proceso mediante el cual los conocimientos, tendencias y sentimientos son:","o":["Conocidos y aceptados por otros","Impuestos a los subordinados","Archivados por escrito","Transmitidos solo de arriba hacia abajo"],"e":"No basta con que se conozcan: la comunicación busca también la aceptación."},{"id":"10yjeh2","l":"L37","u":"U3","s":"mat","q":"¿Cuál de los siguientes NO es un elemento de la comunicación según Reyes Ponce?","o":["El organigrama","El canal","La respuesta","El ambiente"],"e":"Los elementos son fuente, receptor, canal, contenido, respuesta (retroalimentación) y ambiente."},{"id":"na4chj","l":"L37","u":"U3","s":"mat","q":"Según el principio de ADAPTACIÓN de la comunicación:","o":["La comunicación debe adaptarse al que la recibe, no al que la da","La comunicación debe adaptarse al nivel del jefe","El receptor debe adaptarse a la fuente","El canal debe ser siempre escrito"],"e":"Si el receptor no comprende el idioma o el nivel del mensaje, la comunicación es nula."},{"id":"12wa8pn","l":"L37","u":"U3","s":"mat","q":"«Es responsable del éxito de la comunicación aquel en quien se origina». Este es el principio de:","o":["Responsabilidad","Integridad","Bilateralidad","Circunstancialidad"],"e":"No se puede decir «no me supo comprender»: la fuente administra todos los elementos de la comunicación."},{"id":"6vpvyq","l":"L37","u":"U3","s":"mat","q":"Según el principio de BILATERALIDAD, la comunicación es más perfecta cuanto más:","o":["Sea posible obtener una respuesta completa del receptor","Más larga sea la cadena de transmisión del mensaje","Más formal y escrito sea el canal que se utiliza","Más rápido se emita el mensaje, sin esperar respuesta"],"e":"Sirve para saber que el receptor la captó y para que la reciba con más aceptación."},{"id":"2i4mpm","l":"L37","u":"U3","s":"mat","q":"Una queja presentada en un ambiente de huelga es mucho más grave que en una plática amable. Esto ilustra el principio de:","o":["Circunstancialidad","Efectividad","Adaptación","Responsabilidad"],"e":"El ambiente condiciona que el mensaje llegue adecuadamente."},{"id":"w8kpe1","l":"L37","u":"U3","s":"mat","q":"Para comunicar instrucciones que deberán repetirse en muchos casos, según el principio de efectividad, el mejor medio es:","o":["Escrito","Oral","Gráfico informal","El rumor"],"e":"Para una orden sencilla es mejor el medio oral, porque permite preguntas."},{"id":"154gywn","l":"L37","u":"U3","s":"mat","q":"Los reportes, las sugerencias, las quejas y las entrevistas de salida son ejemplos de comunicación:","o":["Vertical ascendente","Vertical descendente","Horizontal","Informal"],"e":"Descendente: políticas, reglas, instrucciones, órdenes e informaciones. Horizontal: juntas, comités, consejos y mesas redondas."},{"id":"e0ozs4","l":"L37","u":"U3","s":"mat","q":"La comunicación que sugiere y espera una acción sin imponerla obligatoriamente es:","o":["Exhortativa","Imperativa","Informativa","Genérica"],"e":"La imperativa exige una respuesta precisa; la informativa solo comunica."},{"id":"10bxiie","l":"L37","u":"U3","s":"mat","q":"Según Reyes Ponce, la comunicación INFORMAL, comparada con la formal, es:","o":["Más rápida, más enérgica y más difusiva","Más lenta y precisa","Menos influyente","Exclusivamente escrita"],"e":"Porque suele ir cargada de aspectos sentimentales o emocionales."},{"id":"uqnaq7","l":"L37","u":"U3","s":"mat","q":"Usar palabras vagas o con doble sentido es una barrera de la comunicación de tipo:","o":["Semántico","Psicológico","Administrativo","Físico"],"e":"Psicológicas: turbación o irritación. Administrativas: canales largos y papeleo. Físicas: ruidos y aparatos."},{"id":"1dzlhke","l":"L37","u":"U3","s":"mat","q":"Las suspicacias del sindicato hacia la empresa, o viceversa, son una barrera de la comunicación:","o":["Sociológica","Cultural","Semántica","Fisiológica"],"e":"Las sociológicas son choques, antipatías o resentimientos entre quienes se comunican."},{"id":"12dtar9","l":"L37","u":"U3","s":"mat","q":"Canales de comunicación innecesariamente largos y el exceso de papeleo constituyen barreras:","o":["Administrativas","Culturales","Psicológicas","Físicas"],"e":"Se deben a sistemas inadecuados de organización."},{"id":"36axpd","l":"L37","u":"U3","s":"mat","q":"Reyes Ponce define la autoridad, desde el punto de vista administrativo, como:","o":["La facultad para tomar decisiones que produzcan efectos","El derecho de mandar y la obligación de ser obedecido","El prestigio de una persona","La propiedad de los bienes productivos"],"e":"La primera definición le parece estrecha; el criterio práctico es saber quién toma las decisiones que se obedecen."},{"id":"1oc5r7r","l":"L37","u":"U3","s":"mat","q":"El MANDO es, según Reyes Ponce:","o":["La autoridad puesta en acto","La autoridad delegada a un comité","La responsabilidad de los supervisores","El poder carismático"],"e":"Es el ejercicio de la autoridad respecto de cada función determinada."},{"id":"5r3nrq","l":"L37","u":"U3","s":"mat","q":"Según Reyes Ponce, el origen INMEDIATO de la autoridad en la empresa es:","o":["El convenio (contrato de trabajo o de sociedad)","El carisma del director","La antigüedad","El organigrama"],"e":"Detrás están la propiedad de los bienes productivos y el régimen económico-social que regula los contratos."},{"id":"xqzzt8","l":"L37","u":"U3","s":"mat","q":"La autoridad que no se ejerce directamente sobre personas, sino que faculta para decidir sobre ciertas acciones (comprar, cerrar una venta, lanzar un producto), es la autoridad:","o":["Operativa","Formal","Técnica","Personal"],"e":"Es de tipo jurídico, pero recae sobre actos, no sobre personas."},{"id":"f61guz","l":"L37","u":"U3","s":"mat","q":"La autoridad que fundamentalmente sostiene a los jefes STAFF es la:","o":["Técnica","Formal lineal","Operativa","Funcional"],"e":"Descansa en el prestigio, la experiencia y los conocimientos, es decir, en el convencimiento."},{"id":"1ujtyzs","l":"L37","u":"U3","s":"mat","q":"La autoridad personal, basada en las cualidades morales, sociales y psicológicas de alguien, prácticamente se identifica con:","o":["El liderazgo","La autoridad formal","La autoridad operativa","El poder jurídico"],"e":"Si al jefe formal le falta autoridad técnica o personal, surge un jefe no designado y, con él, la duplicidad de mando."},{"id":"7wbkuv","l":"L37","u":"U3","s":"mat","q":"En el esquema de Reyes Ponce, ¿qué tipos de autoridad se imponen por CONVENCIMIENTO (autoridad moral)?","o":["Técnica y personal","Formal y operativa","Lineal y funcional","Jurídica y física"],"e":"La autoridad jurídica (formal y operativa) se impone por obligación."},{"id":"1jtpxe5","l":"L37","u":"U3","s":"mat","q":"Urwick compara los tres elementos del mando (qué hacer, cómo hacerlo y vigilar que se haga) con:","o":["Los poderes Legislativo, Ejecutivo y Judicial","La mecánica, la dinámica y el control","La previsión, la planeación y la organización","Los niveles alto, medio y bajo de Katz"],"e":"El Legislativo determina qué se debe hacer; el Ejecutivo, el cómo, y el Judicial vigila."},{"id":"zdfm3p","l":"L37","u":"U3","s":"mat","q":"La diferencia entre una ORDEN y una INSTRUCCIÓN es que:","o":["La orden se refiere a una situación particular y concreta; la instrucción, a la norma para casos repetidos","La orden siempre se da por escrito y la instrucción siempre de forma verbal","La instrucción la emite el staff y la orden la emite el jefe de línea","La orden es para casos repetidos y la instrucción para una situación concreta"],"e":"Por eso conviene que las instrucciones se den por escrito (circulares, instructivos, manuales de procedimientos)."},{"id":"vjj52a","l":"L37","u":"U3","s":"mat","q":"Según Pigors, los elementos básicos de la orden son:","o":["Emisión, ejecución y verificación","Planeación, organización y control","Fuente, canal y receptor","Autoridad, responsabilidad y delegación"],"e":"Los refuerzan la recomendación del subordinado, el reporte y la reacción humana."},{"id":"d5br6u","l":"L37","u":"U3","s":"mat","q":"En orden de generalidad DECRECIENTE, las formas del mando son:","o":["Políticas, reglas, instrucciones y órdenes","Órdenes, instrucciones, reglas y políticas","Reglas, políticas, órdenes e instrucciones","Instrucciones, órdenes, políticas y reglas"],"e":"Las políticas se contienen en manuales; las reglas, en reglamentos; las instrucciones, en instructivos."},{"id":"15my3fk","l":"L37","u":"U3","s":"mat","q":"Según Chester Barnard (citado por Reyes Ponce), para que la autoridad sea efectiva se requiere:","o":["Legitimidad, congruencia, conveniencia y capacidad","Fuerza, castigo, vigilancia y dinero","Carisma, simpatía, valor y suerte","Antigüedad, título, salario y jerarquía"],"e":"El subordinado debe ver que la orden es parte de lo que aceptó, que es congruente, que no daña gravemente sus intereses y que no supera sus fuerzas."},{"id":"e50kc4","l":"L37","u":"U3","s":"mat","q":"Para Reyes Ponce, la esencia de la autoridad en la empresa es el poder:","o":["Moral","Físico","Económico","Carismático"],"e":"Es el compromiso que el subordinado aceptó previamente; se apoya en otros poderes, sobre todo en el jurídico."},{"id":"1piek9q","l":"L37","u":"U3","s":"mat","q":"Según Reyes Ponce, el motivo económico:","o":["Es muy general y básico por su convertibilidad, pero no es el decisivo","Es el único motivo real del trabajador y el decisivo en toda conducta laboral","No influye en la conducta, porque solo motivan las necesidades superiores","Corresponde al nivel de autorrealización de la pirámide de Maslow"],"e":"A veces se sacrifica una ganancia mayor por otras razones (por ejemplo, trabajar con otro jefe)."},{"id":"klkiyz","l":"L37","u":"U3","s":"mat","q":"Las características del líder según Kast son:","o":["Inteligencia práctica, madurez social, motivación interna y actitud de relaciones humanas","Carisma, fuerza física, riqueza y antigüedad en la empresa","Autoridad formal, operativa, técnica y personal","Legitimidad, congruencia, conveniencia y capacidad"],"e":"La capacidad del líder depende de que sus cualidades sean superiores a las del grupo; por eso quien es líder en un grupo puede no serlo en otro."},{"id":"q73427","l":"L37","u":"U3","s":"mat","q":"La teoría del liderazgo que se refiere a «lo que el líder hace, y cómo, dónde y cuándo lo hace» es la teoría:","o":["Situacional","De los rasgos","Del gran hombre","X de McGregor"],"e":"La teoría de las cualidades o rasgos se refiere a «lo que el líder es»."},{"id":"1jb5lqv","l":"L37","u":"U3","s":"mat","q":"Según White y Lippitt, el estilo en el que las políticas son resultado de las discusiones y decisiones del grupo, estimuladas por el líder, es el:","o":["Democrático","Autoritario","Laissez-faire","Burocrático"],"e":"Para Reyes Ponce, el verdadero liderazgo se da principalmente en el estilo democrático."},{"id":"106fvjo","l":"L37","u":"U3","s":"mat","q":"Reyes Ponce opina que el estilo «laissez-faire»:","o":["Difícilmente puede llamarse liderazgo, porque el jefe procura hacer lo menos posible","Es el estilo más eficaz, porque da completa libertad al grupo","Es equivalente al estilo democrático, pero con menos reuniones","Es propio de los líderes carismáticos con gran autoridad personal"],"e":"Hay libertad completa con mínima intervención; el «presunto líder» no participa."},{"id":"nbgzn7","l":"L37","u":"U3","s":"mat","q":"Según Reyes Ponce, los dos enfoques DECISIVOS para la toma de decisiones son:","o":["El psicológico y el económico","El matemático y el lógico","El intuitivo y el empírico","El legal y el ético"],"e":"El psicológico analiza los motivos; el económico busca maximizar los resultados."},{"id":"o32y63","l":"L37","u":"U3","s":"mat","q":"El primer paso para tomar decisiones según Reyes Ponce es:","o":["Identificar con toda claridad el problema","Establecer un sistema de control","Tomar las decisiones complementarias","Eliminar alternativas"],"e":"«Problema bien planteado es problema ya resuelto parcialmente»."},{"id":"1ik53v0","l":"L37","u":"U3","s":"mat","q":"Mary Parker Follett define la disciplina positiva como:","o":["Autocontrol organizado","Castigo gradual","Obediencia ciega","Control estadístico"],"e":"Reyes Ponce: es el orden que se obtiene por la obediencia espontánea a las reglas, gracias a sistemas que favorecen el autocontrol."},{"id":"1c1zzau","l":"L37","u":"U3","s":"mat","q":"Cerrar físicamente un paso, en lugar de poner un letrero de «prohibido el paso», es un ejemplo de:","o":["Disciplina positiva","Disciplina negativa","Recompensa extraordinaria","Calificación de méritos"],"e":"Impedir físicamente la violación de una norma es uno de los medios de disciplina positiva."},{"id":"pp6wjs","l":"L37","u":"U3","s":"mat","q":"¿Cuál de las siguientes es una regla para aplicar la disciplina negativa (sanciones)?","o":["Buscar el efecto medicinal y preventivo más que el vindicativo","Aplicar primero la sanción más severa","Retractarse después de notificar la sanción si el trabajador protesta","Personalizar el castigo para que sea ejemplar"],"e":"Además: no lesionar la dignidad, aplicarla con impersonalidad, de forma gradual, y meditar antes, porque una vez notificada no se retracta."},{"id":"uj46iz","l":"L37","u":"U3","s":"mat","q":"Según Reyes Ponce, la disciplina negativa:","o":["Es el auxiliar del mando menos recomendable, porque implica que la disciplina positiva ha fallado","Es el auxiliar más recomendable, porque produce resultados inmediatos y duraderos","Nunca es necesaria si la empresa cuenta con un buen sistema de sugerencias","Sustituye a la autoridad cuando los subordinados no aceptan las órdenes"],"e":"Aun así, siempre será necesaria como último recurso."},{"id":"1rfyl5o","l":"L37","u":"U3","s":"mat","q":"La calificación de méritos se distingue del análisis de puestos en que:","o":["La calificación mide la realización PERSONAL del trabajador; el análisis fija el contenido IMPERSONAL del puesto","Son lo mismo: ambos miden la calidad del trabajo realizado por cada empleado","El análisis de puestos evalúa a cada trabajador y la calificación describe el puesto","La calificación de méritos describe las funciones y los requisitos de cada puesto"],"e":"Sistemas de calificación: comparación, escalas y listas verificables."},{"id":"1iu4myj","l":"L37","u":"U3","s":"mat","q":"Las tres etapas de la queja según Reyes Ponce son:","o":["Insatisfacción, queja y agravio","Queja, demanda y huelga","Reclamo, sanción y despido","Escucha, análisis y respuesta"],"e":"Hay agravio cuando el empleado cree que su queja no se resolvió con justicia o que no será oída."},{"id":"1bldf9o","l":"L37","u":"U3","s":"mat","q":"Las quejas basadas en la apreciación del quejoso, como la forma en que lo trata su jefe, son quejas:","o":["Subjetivas","Objetivas","Mixtas","Agravios"],"e":"Son las más numerosas y difíciles; aunque sean imaginarias, para el quejoso son tan reales como las verdaderas."},{"id":"1qs09bv","l":"L37","u":"U3","s":"mat","q":"Según Reyes Ponce, la mejor resolución de una queja es:","o":["La que se da en el primer paso, lo más cerca posible de su origen","La que da el director general","La que se difiere para que se calme el ánimo","La que decide un juez laboral"],"e":"Además, nunca hay que resolverla por la primera impresión, pero sí en un plazo breve."},{"id":"1xpkf6p","l":"L37","u":"U3","s":"mat","q":"Según Reyes Ponce, ¿qué afirmación sobre la delegación es correcta?","o":["Tanto la autoridad como la responsabilidad se delegan, pero la responsabilidad sigue siendo solidaria entre el delegante y el delegado","La autoridad se delega, pero la responsabilidad nunca se comparte entre delegante y delegado","La responsabilidad se transfiere por completo al delegado y el delegante queda liberado de ella","La autoridad delegada debe reasumirse con frecuencia para no perder el control"],"e":"Reyes Ponce matiza la frase hecha «la autoridad se delega y la responsabilidad se comparte»: es verdadera pero imprecisa."},{"id":"18zd2lh","l":"L37","u":"U3","s":"mat","q":"La MAYOR desventaja de la delegación según Reyes Ponce es que:","o":["Debilita el control","Favorece la especialización","Permite atender lo importante","Las decisiones se toman con más base en la realidad"],"e":"Otras desventajas: aumenta los riesgos, divide el mando y reduce la uniformidad."},{"id":"1vxam8s","l":"L37","u":"U3","s":"mat","q":"La relación entre delegación y descentralización es que:","o":["La delegación es la causa y la descentralización el efecto","La descentralización es la causa y la delegación el efecto","Son sinónimos","La delegación es geográfica y la descentralización no"],"e":"Además, la delegación puede darse en una sola línea; la descentralización supone hacerlo de forma más o menos homogénea en todas las líneas."},{"id":"p985m","l":"L37","u":"U3","s":"mat","q":"Una empresa que delega más autoridad y además traslada sus oficinas a otras ciudades realiza una:","o":["Desconcentración","Centralización","Delegación concreta","Unidad de mando"],"e":"Toda desconcentración implica descentralización, pero puede haber descentralización sin desconcentración."},{"id":"k7h3l8","l":"L37","u":"U3","s":"mat","q":"En la delegación GENERAL:","o":["Se concede al jefe toda la autoridad en su área y se señalan los casos de excepción (por tiempo, por monto o por función)","Se le señalan al jefe solo los aspectos concretos en que puede decidir; en todo lo demás debe consultar","No se delega autoridad, solo responsabilidad, para mantener la centralización","Se usa principalmente para los supervisores de bajo nivel, con facultades limitadas"],"e":"Es la que se sigue en los altos niveles; la delegación sobre funciones concretas se usa para supervisores de bajo nivel."},{"id":"12at6ag","l":"L37","u":"U3","s":"mat","q":"¿Cuál es una regla de la delegación según Reyes Ponce?","o":["Debe delegarse gradualmente y con base en políticas y reglas","Debe delegarse por ensayo y error","Debe delegarse de golpe todo lo posible","Debe centralizarse y delegarse alternadamente"],"e":"También: fijar controles, preparar al delegado, dar información, que sea clara, estable y con resultados por obtener."},{"id":"1wrax6w","l":"L37","u":"U3","s":"mat","q":"El criterio para distinguir la supervisión del control es que:","o":["La supervisión es simultánea a la ejecución y el control es posterior","La supervisión es posterior y el control simultáneo","La supervisión la hacen los altos directivos y el control los obreros","No hay diferencia"],"e":"Supervisar es «ver sobre», es decir, ver que las cosas se hagan como fueron ordenadas."},{"id":"1jixh9z","l":"L37","u":"U3","s":"mat","q":"La regla de supervisión de la «doble preparación» establece que el supervisor necesita:","o":["Prepararse en la técnica que va a manejar y en la técnica de ser jefe","Contar con dos títulos universitarios, uno técnico y otro administrativo","Depender de dos jefes inmediatos, uno de línea y otro de staff","Recibir preparación teórica en el aula y preparación física en la planta"],"e":"Error frecuente: elegir como jefe de mecánicos al mejor mecánico sin prepararlo como jefe."},{"id":"1omt209","l":"L38","u":"U3","s":"mat","q":"Koontz y Weihrich definen el control como:","o":["La medición y corrección del desempeño para garantizar el cumplimiento de los objetivos y los planes","La vigilancia simultánea de que las órdenes se ejecuten tal como fueron dadas","La selección, inducción y capacitación del personal que ejecutará los planes","La fijación de objetivos de largo plazo y de los cursos de acción para lograrlos"],"e":"La vigilancia simultánea es la supervisión (Reyes Ponce)."},{"id":"o8f01j","l":"L38","u":"U3","s":"mat","q":"Koontz y Weihrich comparan la planeación y el control con:","o":["Las hojas de una misma tijera","El corazón y el cerebro","Las dos caras de Jano","El termostato y la caldera"],"e":"La tijera no funciona sin sus dos hojas: sin planes, el control es imposible."},{"id":"8s7zxo","l":"L38","u":"U3","s":"mat","q":"Los tres pasos del proceso básico de control son:","o":["Establecimiento de normas, medición del desempeño y corrección de las desviaciones","Planeación de normas, organización de recursos y dirección del personal","Previsión de objetivos, investigación de factores y cursos alternativos","Emisión de la orden, ejecución de la orden y verificación del cumplimiento"],"e":"Es igual para el dinero, los procedimientos, la moral o la calidad."},{"id":"g8zmgu","l":"L38","u":"U3","s":"mat","q":"Según Koontz, el control es responsabilidad de:","o":["Todos los administradores, desde el presidente hasta los supervisores","Solo el departamento de contraloría y auditoría interna","Solo la alta dirección, que fija los planes generales","Los auditores externos contratados por la empresa"],"e":"Algunos administradores de niveles inferiores olvidan que el control también les corresponde."},{"id":"1suinj8","l":"L38","u":"U3","s":"mat","q":"Las normas, por definición, son:","o":["Criterios de desempeño: puntos seleccionados para medir cómo marchan los planes","Los reglamentos internos que regulan la conducta de los trabajadores","Las sanciones disciplinarias que se aplican ante una desviación","Las órdenes concretas que el jefe da a sus subordinados"],"e":"Las mejores son las metas u objetivos verificables."},{"id":"pkev14","l":"L38","u":"U3","s":"mat","q":"La corrección de desviaciones es el punto donde el control:","o":["Se conecta con las demás funciones administrativas (replanear, reorganizar, integrar personal, dirigir mejor)","Termina definitivamente el proceso administrativo hasta el siguiente ejercicio","Se vuelve independiente de la planeación y de las demás funciones","Se transfiere al departamento de finanzas para su registro contable"],"e":"Corregir puede implicar rediseñar planes, reasignar deberes, capacitar o despedir, o dirigir mejor."},{"id":"1bbb5f4","l":"L38","u":"U3","s":"mat","q":"El principio de control de puntos críticos establece que:","o":["El control eficaz requiere especial atención a los factores críticos para evaluar el desempeño","Se debe vigilar personalmente cada paso de la ejecución de los planes","Solo deben controlarse los costos, porque son lo más fácil de medir","El control debe aplicarse de forma aleatoria para evitar predecibilidad"],"e":"Así el administrador puede manejar a más subordinados (mayor tramo) y ahorrar costos."},{"id":"1qdh1z","l":"L38","u":"U3","s":"mat","q":"Las horas-hombre por unidad producida o las unidades por máquina-hora son normas:","o":["Físicas","De costos","De capital","De ingresos"],"e":"Son medidas no monetarias propias del nivel operativo; también pueden reflejar calidad."},{"id":"2ke7kd","l":"L38","u":"U3","s":"mat","q":"El rendimiento sobre la inversión y las razones entre el activo y el pasivo circulante son normas:","o":["De capital","De costos","Físicas","Intangibles"],"e":"Se relacionan con el balance general, no con el estado de resultados."},{"id":"1eivklb","l":"L38","u":"U3","s":"mat","q":"Las normas que no se expresan en medidas físicas ni monetarias, como la lealtad de los supervisores o la aptitud del director de personal, son normas:","o":["Intangibles","De programas","De capital","Físicas"],"e":"Son difíciles de establecer; su uso disminuye conforme se adoptan metas verificables."},{"id":"hjmcfo","l":"L38","u":"U3","s":"mat","q":"El benchmarking consiste en:","o":["Fijar metas y medidas de productividad con base en las mejores prácticas, aunque provengan de otra industria","Copiar el organigrama y los procesos del principal competidor de la industria","Fijar metas con base en la intuición y la experiencia del gerente","Comparar el desempeño actual solo con los resultados de años anteriores"],"e":"Si una empresa de otra industria surte pedidos en 4 días, esa se vuelve la referencia, aunque el competidor tarde 5."},{"id":"7g03a9","l":"L38","u":"U3","s":"mat","q":"El benchmarking que se centra en funciones de apoyo como la logística, los sistemas de información o los recursos humanos es el:","o":["Administrativo","Estratégico","Operativo","Financiero"],"e":"El estratégico compara estrategias; el operativo, los costos relativos y la diferenciación."},{"id":"cslk3f","l":"L38","u":"U3","s":"mat","q":"Koontz explica el control administrativo como un sistema de retroalimentación semejante a:","o":["El termostato doméstico","Una línea de montaje","Un organigrama circular","El ciclo de vida de un producto"],"e":"Mide, compara con la norma y activa la corrección."},{"id":"ksfvqa","l":"L38","u":"U3","s":"mat","q":"Según Koontz, la información en tiempo real:","o":["No hace posible un control en tiempo real, porque el análisis y la corrección de las desviaciones toman tiempo","Garantiza un control en tiempo real, porque las desviaciones se corrigen al instante","Elimina la necesidad de fijar normas, porque los datos muestran todo lo que ocurre","Solo es útil en las aerolíneas y no justifica su costo en ninguna otra industria"],"e":"Los rezagos en el proceso de corrección son inevitables."},{"id":"142lo7b","l":"L38","u":"U3","s":"mat","q":"Saber en noviembre que se perdió dinero en octubre por algo hecho en julio ilustra la deficiencia de:","o":["Controlar solo con datos históricos (retroalimentación simple)","El control anticipante o de corrección preliminar","El benchmarking operativo y estratégico","Los controles flexibles basados en presupuestos variables"],"e":"Esa retroalimentación es casi un «aviso postmortem»: nadie puede modificar el pasado."},{"id":"1v7cs6w","l":"L38","u":"U3","s":"mat","q":"El control con corrección anticipante (feedforward) se caracteriza por:","o":["Vigilar los insumos del proceso para corregir antes de que se afecten los resultados","Medir solo los productos finales y compararlos con las normas","Esperar los informes contables para detectar las desviaciones","Aplicarse solo en sistemas mecánicos, como el termostato"],"e":"También se le llama control preliminar o control de dirección."},{"id":"obt9hs","l":"L38","u":"U3","s":"mat","q":"Un automovilista que presiona el acelerador ANTES de que la subida reduzca su velocidad ejemplifica:","o":["El control anticipante","La retroalimentación simple","El benchmarking","El principio de excepción"],"e":"Otro ejemplo de Koontz: el cazador que apunta delante de la trayectoria del pato."},{"id":"reihfv","l":"L38","u":"U3","s":"mat","q":"En los sistemas de control anticipante, las «perturbaciones» son:","o":["Factores no considerados en el modelo de insumos que pueden afectar el resultado","Las desviaciones del presupuesto que ya se registraron contablemente","Los errores que cometen los subordinados al ejecutar las órdenes","Las quejas de los clientes que llegan por el sistema de sugerencias"],"e":"Ejemplo: la quiebra imprevista de un proveedor importante."},{"id":"3pqx4z","l":"L38","u":"U3","s":"mat","q":"Según Koontz, ¿cuál es un requisito de los controles eficaces?","o":["Ser flexibles, para seguir funcionando ante cambios en los planes","Ser lo más sofisticados posible, aunque nadie los entienda","Aplicarse igual a todos los puestos","Ignorar la cultura organizacional"],"e":"Otros: ajustarse a los planes, puestos y personas, señalar excepciones en puntos críticos, ser objetivos y económicos y llevar a acciones correctivas."},{"id":"1c4ekwd","l":"L38","u":"U3","s":"mat","q":"«Más vale obtener el 80% de los beneficios de un sistema tosco que ningún beneficio de un sistema perfecto pero inabordable». ¿Qué requisito de control ilustra?","o":["Ajustar los controles a cada administrador en lo individual (que sean comprensibles)","Que los controles sean económicos y justifiquen su costo","Que los controles sean flexibles ante cambios en los planes","Que el control se dirija al futuro mediante la corrección anticipante"],"e":"Nadie confía en lo que no comprende, y lo que no se confía no se usa."},{"id":"sv3oce","l":"L38","u":"U3","s":"mat","q":"El principio de excepción, según Koontz, debe acompañarse del:","o":["Principio de control de puntos críticos","Principio de unidad de mando","Principio de especialización","Principio de bilateralidad"],"e":"No basta con buscar excepciones: hay que buscarlas en los puntos críticos (5% en el personal de oficina puede importar más que 20% en estampillas)."},{"id":"14moxi1","l":"L38","u":"U3","s":"mat","q":"Un presupuesto que refleja las variaciones en el volumen de ventas, en lugar de quedarse fijo, responde al requisito de:","o":["Flexibilidad (presupuesto variable)","Objetividad","Puntos críticos","Ajuste a la cultura"],"e":"Los presupuestos inflexibles se desacreditan cuando las ventas reales difieren mucho del pronóstico."},{"id":"49mkcs","l":"L38","u":"U3","s":"mat","q":"En una organización con mucha libertad y participación, un sistema de control rígido estaría condenado al fracaso. Esto refleja el requisito de:","o":["Ajustar el control a la cultura organizacional","Economía de los controles","Objetividad de los controles","Control anticipante"],"e":"Y al revés: la gente poco acostumbrada a participar prefiere normas y medidas claras."},{"id":"156fjdj","l":"L38","u":"U3","s":"mat","q":"Según Koontz, en países como Japón, donde impera el trabajo en equipo, un medio muy eficaz de control es:","o":["La presión de los compañeros","La sanción individual pública","El despido inmediato","La auditoría externa"],"e":"El control debe ser flexible según las condiciones de cada país."},{"id":"wamk2l","l":"L41","u":"U4","s":"gen","q":"Las cuatro áreas funcionales básicas que contempla el programa de Fundamentos de Administración son:","o":["Recursos humanos, finanzas, mercadotecnia y operaciones","Planeación, organización, dirección y control","Ventas, compras, almacén y contabilidad","Dirección, staff, línea y comités"],"e":"El proceso administrativo (planear, organizar, dirigir, controlar) se aplica dentro de cada área funcional."},{"id":"qjd81g","l":"L41","u":"U4","s":"gen","q":"La relación entre el proceso administrativo y las áreas funcionales es que:","o":["El proceso administrativo se aplica dentro de cada área funcional","Las áreas funcionales sustituyen al proceso administrativo","Solo el área de recursos humanos aplica el proceso","Cada etapa del proceso corresponde a un área"],"e":"Por ejemplo, mercadotecnia planea, organiza, dirige y controla sus propias actividades."},{"id":"1xajfoy","l":"L41","u":"U4","s":"gen","q":"El objetivo del área de recursos humanos es:","o":["Contar con el personal adecuado, desarrollarlo y mantenerlo productivo y satisfecho","Obtener los recursos financieros y aplicarlos de forma óptima","Transformar los insumos en bienes o servicios de calidad","Identificar y satisfacer las necesidades del cliente de forma rentable"],"e":"Las otras opciones corresponden a finanzas, operaciones y mercadotecnia."},{"id":"1d1vtmo","l":"L41","u":"U4","s":"gen","q":"El proceso de ATRAER candidatos potencialmente calificados para ocupar un puesto es:","o":["Reclutamiento","Selección","Inducción","Contratación"],"e":"El reclutamiento atrae; la selección elige al más idóneo; la inducción integra al nuevo empleado a la organización."},{"id":"8h6f4t","l":"L41","u":"U4","s":"gen","q":"El proceso de ELEGIR, entre los candidatos reclutados, al más idóneo para el puesto es:","o":["Selección","Reclutamiento","Capacitación","Evaluación del desempeño"],"e":"Utiliza entrevistas, pruebas psicométricas y de conocimientos, estudios socioeconómicos, etc."},{"id":"cub00b","l":"L41","u":"U4","s":"gen","q":"La actividad que familiariza al nuevo empleado con la empresa, su cultura, sus políticas y su puesto se llama:","o":["Inducción (introducción)","Reclutamiento","Selección","Evaluación"],"e":"Reyes Ponce la incluye en la integración como «introducción». Se vincula con la socialización organizacional de Ivancevich."},{"id":"1ums2mt","l":"L41","u":"U4","s":"gen","q":"¿Cuál de las siguientes es una subfunción del área de recursos humanos?","o":["Sueldos y salarios (compensaciones)","Crédito y cobranza","Investigación de mercados","Control de calidad"],"e":"Crédito y cobranza es de finanzas; investigación de mercados, de mercadotecnia; control de calidad, de operaciones."},{"id":"1pv8u3h","l":"L41","u":"U4","s":"gen","q":"El objetivo principal del área de finanzas es:","o":["Obtener los recursos financieros necesarios y aplicarlos óptimamente, maximizando el valor de la empresa","Vender la mayor cantidad posible de productos al mejor precio del mercado","Contratar, capacitar y retener al mejor personal disponible","Producir con la mayor calidad posible al menor costo unitario"],"e":"Busca liquidez, solvencia y rentabilidad."},{"id":"6utdsl","l":"L41","u":"U4","s":"gen","q":"¿Cuál es una subfunción del área de FINANZAS?","o":["Tesorería","Publicidad","Mantenimiento","Inducción"],"e":"Otras: contabilidad, presupuestos, crédito y cobranza, financiamiento, inversiones y la función fiscal."},{"id":"1nhtw78","l":"L41","u":"U4","s":"gen","q":"La decisión financiera sobre DE DÓNDE obtener los recursos (préstamos bancarios, emisión de acciones, proveedores) es la decisión de:","o":["Financiamiento","Inversión","Dividendos","Producción"],"e":"La decisión de inversión responde en qué aplicar los recursos; la de dividendos, cuánto repartir a los accionistas."},{"id":"1uxv8mo","l":"L41","u":"U4","s":"gen","q":"El objetivo del área de mercadotecnia es:","o":["Identificar y satisfacer las necesidades del cliente de forma rentable","Registrar y controlar las operaciones contables de la empresa","Transformar insumos en productos con calidad y oportunidad","Reclutar, seleccionar y capacitar al personal de ventas"],"e":"Crear, comunicar y entregar valor al cliente."},{"id":"1ijs6l","l":"L41","u":"U4","s":"gen","q":"La mezcla de mercadotecnia (las 4P) está formada por:","o":["Producto, precio, plaza y promoción","Planeación, producción, personal y presupuesto","Producto, proceso, personas y planta","Precio, publicidad, pronóstico y política"],"e":"Propuesta por E. Jerome McCarthy. Plaza = distribución."},{"id":"g3e24c","l":"L41","u":"U4","s":"gen","q":"¿Cuál es una subfunción de MERCADO
