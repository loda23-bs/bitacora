<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Panel del dueño: coches, servicios y etiquetas QR.">
<title>Panel del Taller · Bitácora QR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#EDF0F1; --surface:#FFFFFF; --ink:#15191C; --muted:#5A646B; --line:#D2D8DC;
  --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FBE7DB; --ok:#1F7A4D; --danger:#B42318;
  --plate-bg:#FBFBF8; --plate-ink:#111417; --plate-band:#7B2350; --wa:#1E8A4C; --wa-ink:#FFFFFF; --bar:#C2410C;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1214; --surface:#181C1F; --ink:#E8ECEE; --muted:#9AA4AB; --line:#2B3236;
  --accent:#F0793A; --accent-ink:#1B0D05; --accent-soft:#3A2216; --ok:#4CC38A; --danger:#F97066;
  --wa:#3CC97A; --wa-ink:#05200F; --bar:#DB6A33; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px} h2{font-size:24px} h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:10px;padding-block:18px 12px;border-bottom:2px solid var(--ink)}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.shop-name{font-size:28px;text-transform:uppercase;letter-spacing:.02em}
.sel{user-select:all}
.mode{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 8px;border-radius:4px;background:var(--ink);color:var(--bg)}
.btn{font:inherit;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:8px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.small{font-size:13px;padding:6px 10px;border-width:1px}
.btn.link{border:none;padding:4px 0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink);align-self:flex-start}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
form.stack{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;border:1px dashed var(--muted);background:transparent;color:var(--ink);cursor:pointer}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.tag.late{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.private{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.private::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--muted);margin-right:5px;vertical-align:1px}
.msg{padding:11px 14px;border-radius:8px;font-weight:500;border:1px solid var(--line);background:var(--surface)}
.msg.ok{border-color:var(--ok);color:var(--ok)}
.msg.err{border-color:var(--danger);color:var(--danger)}
.note{font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.plate{display:inline-flex;flex-direction:column;align-items:center;background:var(--plate-bg);color:var(--plate-ink);
  border:3px solid var(--plate-ink);border-radius:10px;padding:2px 18px 6px;box-shadow:inset 0 0 0 3px var(--plate-bg),inset 0 0 0 4.5px var(--plate-ink);max-width:100%}
.plate-band{font-size:10px;font-weight:700;letter-spacing:.3em;color:var(--plate-band);padding-top:4px}
.plate-num{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;letter-spacing:.06em;overflow-wrap:anywhere;text-align:center}
.mini-plate{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.05em;background:var(--plate-bg);color:var(--plate-ink);
  border:2px solid var(--plate-ink);border-radius:5px;padding:1px 8px;white-space:nowrap}
.car-head{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.vehicle{font-size:17px;font-weight:600}
.sticker{background:var(--surface);border:2px dashed var(--accent);border-radius:14px;overflow:hidden}
.sticker-head{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);padding:8px 14px}
.sticker-head span:first-child{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.06em}
.sticker-body{padding:14px;display:flex;flex-direction:column;gap:10px}
.sticker-date{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1}
.sticker-ago{font-size:13px;font-weight:600;color:var(--accent)}
.sticker-what{font-size:17px;font-weight:600;white-space:pre-line}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted);font-weight:500}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.price{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{border-top:2px solid var(--ink);padding-top:6px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist-item{display:flex;flex-direction:column;gap:4px;padding:14px 0 14px 18px;border-left:2px solid var(--line);position:relative}
.hist-item::before{content:"";position:absolute;left:-6px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.hist-item:first-child::before{background:var(--accent);border-color:var(--accent)}
.hist-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hist-date{font-weight:700}
.hist-top .price{margin-left:auto}
.hist-what{font-weight:600;white-space:pre-line}
.hist-meta{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-line}
.next{display:flex;flex-direction:column;gap:8px;padding:14px;border:1.5px solid var(--ink);border-radius:12px;background:var(--surface)}
.next-main{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.next-date,.next-km{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1}
.due{align-self:flex-start;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.due.ok{color:var(--ok)} .due.soon{color:var(--accent)} .due.late{color:var(--danger)}
.wa-box{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.cost{display:flex;flex-direction:column;gap:5px;border-top:1px dashed var(--line);padding-top:10px}
.cost-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cost-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.cost-row>span:first-child{min-width:0;overflow-wrap:anywhere}
.cost-row .price{white-space:nowrap}
.cost-sub{color:var(--muted);border-top:1px solid var(--line);padding-top:5px}
.cost-sub+.cost-sub{border-top:0;padding-top:0}
.cost-final{font-weight:700;font-size:16px;border-top:2px solid var(--ink);padding-top:6px;margin-top:2px}
.cost-more{margin-top:4px}
.cost-more summary{cursor:pointer;color:var(--accent);font-size:13.5px;font-weight:600;padding:4px 0}
.cost-more .cost{margin-top:6px}
.parts{display:flex;flex-direction:column;gap:8px}
.part-row{display:grid;grid-template-columns:minmax(0,1fr) 112px 40px;gap:8px;align-items:center}
.part-del{font:inherit;font-size:20px;line-height:1;height:40px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.totals{display:flex;flex-direction:column;gap:5px;padding:12px 14px;border-radius:10px;background:var(--accent-soft)}
.totals .cost-row{font-size:15px}
.totals .cost-final{font-size:18px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.opt input{width:20px;height:20px;flex:none;margin-top:2px}
.opt small{display:block;color:var(--muted);font-size:13px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:4px}
.foot{font-size:12.5px;color:var(--muted);text-align:center;padding-top:10px}
@media (prefers-reduced-motion: no-preference){.sticker{animation:pop .35s ease-out both}@keyframes pop{from{transform:translateY(6px)}to{transform:none}}}
.car-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.car-row,.due-row{font:inherit;color:inherit;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  padding:13px 4px;border:none;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;width:100%}
.car-row-main{display:flex;flex-direction:column;min-width:0}
.car-row-main span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due-row .car-row-main span{white-space:normal}
.chev{font-size:22px;color:var(--muted)}
.stat-btn{font:inherit;color:inherit;text-align:left;background:none;border:0;border-top:2px solid var(--ink);cursor:pointer}
.label-prev{display:flex;gap:14px;align-items:center;background:#fff;color:#111;border:1px dashed #99a3a8;border-radius:10px;padding:12px;max-width:380px}
.label-prev svg{flex:none}
.lp-shop{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#C2410C}
.lp-plate{font-family:var(--f-display);font-weight:700;font-size:24px;border:2px solid #111;border-radius:5px;padding:0 8px;display:inline-block;margin:4px 0}
.lp-txt{font-size:12px;color:#333}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{width:20px;height:20px;flex:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--ink);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{font:inherit;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;border:none;background:transparent;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{color:var(--ink)}
.tab[aria-current="true"]::after{content:"";position:absolute;top:-2px;left:22%;right:22%;height:3px;background:var(--accent)}
.tab.plus{color:var(--accent)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:var(--surface);font-size:10.5px;line-height:17px;text-align:center}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;align-self:flex-start}
.seg button{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.gan-hero{display:flex;flex-direction:column;gap:4px}
.gan-big{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.gan-sub{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--muted)}
.gan-sub b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.gchart{position:relative;height:190px;padding:18px 0 26px 46px}
.gchart-grid{position:absolute;left:46px;right:0;border-top:1px dashed var(--line)}
.gchart-grid span{position:absolute;right:calc(100% + 6px);top:-8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.gchart-base{position:absolute;left:46px;right:0;bottom:26px;border-top:1px solid var(--muted)}
.gchart-cols{position:relative;height:100%;display:flex;gap:2px}
.gbar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;border:0;background:transparent;padding:0;cursor:pointer;color:var(--muted);font:inherit}
.gbar-fill{width:min(24px,70%);background:var(--bar);border-radius:4px 4px 0 0;opacity:.42;min-height:0}
.gbar[aria-pressed="true"] .gbar-fill{opacity:1}
.gbar:hover .gbar-fill,.gbar:focus-visible .gbar-fill{opacity:.8}
.gbar-x{position:absolute;bottom:-22px;font-size:11px;white-space:nowrap}
.gbar[aria-pressed="true"] .gbar-x{color:var(--ink);font-weight:700}
.gbar-v{font-size:11px;font-weight:700;color:var(--ink);margin-bottom:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.gan-row{font:inherit;color:inherit;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;width:100%}
.gan-row .car-row-main span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gan-amt{text-align:right;display:flex;flex-direction:column}
.gan-amt b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gan-amt small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
body.has-tabs{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
</style>

<body>
<div id="app"><div class="wrap"><p class="muted" style="padding-top:28px">Cargando…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
// ================== CONFIGURACIÓN ==================
// Copia estos dos datos de Supabase → Project Settings → API.
const SUPABASE_URL      = 'https://zjqkllhnwaxeznskyvok.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qxicgEPIwS7hlVfJD7YbCQ_l2ulIa9R';
// Dirección de la página de clientes. Si subes cliente.html junto a este archivo, déjalo así.
const CLIENTE_URL = (function(){ try { return new URL('cliente.html', location.href).href; } catch (e) { return 'cliente.html'; } })();
// Pon false si quieres dar de alta tú mismo a cada taller (desde Supabase → Authentication → Add user).
const PERMITIR_REGISTRO = true;
// ====================================================

/* ---------- utilidades compartidas ---------- */
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MXN=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function today(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function fdate(iso){if(!iso)return '';const a=String(iso).slice(0,10).split('-').map(Number);return a[2]+' '+MES[a[1]-1]+' '+a[0];}
function daysTo(iso){const a=String(iso).slice(0,10).split('-').map(Number),t=new Date();
  return Math.round((Date.UTC(a[0],a[1]-1,a[2])-Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))/864e5);}
function ago(iso){const n=-daysTo(iso);if(n<0)return 'fecha futura';if(n===0)return 'hoy';if(n===1)return 'ayer';
  if(n<60)return 'hace '+n+' días';if(n<730)return 'hace '+Math.round(n/30.4)+' meses';return 'hace '+Math.round(n/365)+' años';}
function dueTxt(n){if(n<0)return 'Vencido hace '+(n===-1?'1 día':(-n)+' días');if(n===0)return 'Toca hoy';if(n===1)return 'Toca mañana';
  if(n<60)return 'En '+n+' días';return 'En '+Math.round(n/30.4)+' meses';}
function dueClass(n){return n<0?'late':n<=14?'soon':'ok';}
function addMonths(iso,m){const a=iso.split('-').map(Number),d=new Date(a[0],a[1]-1+m,a[2]);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function money(v){return (v===null||v===undefined||v===''||isNaN(v))?'—':MXN.format(Number(v));}
function kmf(v){return (v===''||v==null||isNaN(v))?'':Number(v).toLocaleString('es-MX')+' km';}
function folio(n){return 'Orden #'+String(n).padStart(4,'0');}
function vehicle(c){return [c.marca,c.modelo,c.anio].filter(Boolean).join(' ')+(c.color?' · '+c.color:'');}
function plateHtml(placas){return '<div class="plate"><span class="plate-band">PLACAS</span><span class="plate-num">'+esc(placas)+'</span></div>';}
function waLink(numero,placas){let d=String(numero||'').replace(/\D/g,'');if(d.length===10)d='52'+d;if(!d)return '';
  return 'https://wa.me/'+d+'?text='+encodeURIComponent('Hola, quiero agendar un servicio para mi auto con placas '+placas+'.');}
function nextHtml(s){
  if(!s||!(s.prox_fecha||s.prox_km))return '';
  const n=s.prox_fecha?daysTo(s.prox_fecha):null;
  return '<section class="next" aria-label="Próximo servicio"><p class="eyebrow">Próximo servicio</p><div class="next-main">'+
    (s.prox_fecha?'<span class="next-date">'+fdate(s.prox_fecha)+'</span>':'')+
    (s.prox_fecha&&s.prox_km?'<span class="muted">o a los</span>':'')+
    (s.prox_km?'<span class="next-km">'+kmf(s.prox_km)+'</span>':'')+'</div>'+
    (n!==null?'<span class="due '+dueClass(n)+'">'+dueTxt(n)+'</span>':'')+
    (s.prox_fecha&&s.prox_km?'<p class="hint">Lo que ocurra primero.</p>':'')+'</section>';
}
function partesOf(s){return Array.isArray(s.partes)?s.partes.filter(p=>p&&(p.nombre||p.precio!=null)):[];}
function hasCost(s){return s.precio!=null||s.precio_refacciones!=null||s.precio_mano_obra!=null;}
function hasDesglose(s){return partesOf(s).length>0||Number(s.precio_refacciones)>0||Number(s.precio_mano_obra)>0;}
/* modo: 'desglose' (cada refacción, subtotales y total), 'total' (solo total) o 'nada'.
   Un apartado sin datos (sin refacciones o sin mano de obra) no se muestra. */
function costHtml(s,modo){
  if(modo==='nada'||!hasCost(s))return '';
  const fin='<div class="cost-row cost-final"><span>Total</span><span class="price">'+money(s.precio)+'</span></div>';
  if(modo!=='desglose'||!hasDesglose(s))return '<div class="cost">'+fin+'</div>';
  const partes=partesOf(s),hasRef=partes.length>0||Number(s.precio_refacciones)>0,hasMo=Number(s.precio_mano_obra)>0;
  return '<div class="cost">'+
    (hasRef?'<p class="cost-title">Refacciones</p>'+partes.map(p=>'<div class="cost-row"><span>'+esc(p.nombre||'Refacción')+'</span><span class="price">'+money(p.precio)+'</span></div>').join('')+
      '<div class="cost-row cost-sub"><span>Total refacciones</span><span class="price">'+money(s.precio_refacciones||0)+'</span></div>':'')+
    (hasMo?'<div class="cost-row cost-sub"><span>Mano de obra</span><span class="price">'+money(s.precio_mano_obra)+'</span></div>':'')+fin+'</div>';
}
/* o = {modo, owner}: owner agrega el nombre del cliente (solo panel del dueño) */
function stickerHtml(s,o){
  const showParts=o.modo==='desglose'&&partesOf(s).length>0;
  return '<section class="sticker" aria-label="'+(o.title||'Último servicio')+'"><div class="sticker-head"><span>'+(o.title||'Último servicio')+'</span><span class="mono">'+folio(s.folio)+'</span></div>'+
    '<div class="sticker-body"><div><div class="sticker-date">'+fdate(s.fecha)+'</div><div class="sticker-ago">'+ago(s.fecha)+'</div></div>'+
    '<p class="sticker-what">'+esc(s.servicio)+'</p><dl class="kv">'+
    (s.km!=null?'<dt>Kilometraje</dt><dd class="price">'+kmf(s.km)+'</dd>':'')+
    (s.aceite?'<dt>Aceite</dt><dd>'+esc(s.aceite)+'</dd>':'')+
    (s.filtros?'<dt>Filtros</dt><dd>'+esc(s.filtros)+'</dd>':'')+
    (s.refacciones&&!showParts?'<dt>Refacciones</dt><dd>'+esc(s.refacciones)+'</dd>':'')+
    (s.mecanico?'<dt>Mecánico</dt><dd>'+esc(s.mecanico)+'</dd>':'')+
    (o.owner?'<dt>Cliente</dt><dd>'+esc(s.cliente||'—')+'</dd>':'')+
    '</dl>'+costHtml(s,o.modo)+'</div></section>';
}
/* extra(s) agrega botones en el panel del dueño */
function histHtml(list,o,extra){
  if(!list.length)return '';
  return '<section class="stack"><h2>Historial</h2><ol class="hist">'+list.map(s=>{
    const showParts=o.modo==='desglose'&&partesOf(s).length>0,meta=[];
    if(s.km!=null)meta.push('Kilometraje: '+kmf(s.km));
    if(s.aceite)meta.push('Aceite: '+s.aceite);
    if(s.filtros)meta.push('Filtros: '+s.filtros);
    if(s.refacciones&&!showParts)meta.push('Refacciones: '+s.refacciones);
    if(s.mecanico)meta.push('Mecánico: '+s.mecanico);
    if(o.owner&&s.cliente)meta.push('Cliente: '+s.cliente);
    return '<li class="hist-item"><div class="hist-top"><span class="hist-date">'+fdate(s.fecha)+'</span><span class="mono muted">'+folio(s.folio)+'</span>'+
      (o.modo!=='nada'&&s.precio!=null?'<span class="price">'+money(s.precio)+'</span>':'')+'</div><p class="hist-what">'+esc(s.servicio)+'</p>'+
      (meta.length?'<p class="hist-meta">'+esc(meta.join('\n'))+'</p>':'')+
      (o.modo==='desglose'&&hasDesglose(s)?'<details class="cost-more"><summary>Ver desglose</summary>'+costHtml(s,'desglose')+'</details>':'')+
      (extra?extra(s):'')+'</li>';
  }).join('')+'</ol></section>';
}

function qrMatrix(text){const q=qrcode(0,'M');q.addData(text);q.make();return q;}
function qrSvg(text){const q=qrMatrix(text),n=q.getModuleCount();let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+c+' '+r+'h1v1h-1z';
  return '<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" width="120" height="120" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect x="-2" y="-2" width="'+(n+4)+'" height="'+(n+4)+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';}
function labelsPdf(list){
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'letter'});
  const W=215.9,H=279.4,cols=2,rows=4,mx=10,my=12,gap=4,lw=(W-2*mx-gap)/cols,lh=(H-2*my-gap*(rows-1))/rows;
  list.forEach((car,i)=>{const k=i%(cols*rows);if(i>0&&k===0)doc.addPage();
    const x=mx+(k%cols)*(lw+gap),y=my+Math.floor(k/cols)*(lh+gap);
    doc.setDrawColor(170);doc.setLineWidth(0.2);doc.setLineDashPattern([1.2,1.2],0);doc.roundedRect(x,y,lw,lh,3,3,'S');doc.setLineDashPattern([],0);
    const q=qrMatrix(carUrl(car)),n=q.getModuleCount(),qs=lh-12,cell=qs/n,qx=x+6,qy=y+6;doc.setFillColor(0,0,0);
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))doc.rect(qx+c*cell,qy+r*cell,cell+0.03,cell+0.03,'F');
    const tx=qx+qs+5,tw=x+lw-tx-4;
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(194,65,12);doc.text(doc.splitTextToSize(taller.nombre.toUpperCase(),tw)[0],tx,y+11);
    doc.setDrawColor(0);doc.setLineWidth(0.6);doc.roundedRect(tx,y+15,tw,14,2,2,'S');
    let fs=22;doc.setTextColor(0);doc.setFontSize(fs);while(fs>9&&doc.getTextWidth(car.placas)>tw-4){fs--;doc.setFontSize(fs);}
    doc.text(car.placas,tx+tw/2,y+22+fs*0.13,{align:'center'});
    doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(40);doc.text(doc.splitTextToSize(vehicle(car)||' ',tw).slice(0,2),tx,y+35);
    doc.setFontSize(7.5);doc.setTextColor(90);
    const bottom=doc.splitTextToSize('Escanea para ver el historial y tu próximo servicio.'+(taller.whatsapp?' Citas por WhatsApp: '+taller.whatsapp:(taller.telefono?' Tel. '+taller.telefono:'')),tw).slice(0,3);
    doc.text(bottom,tx,y+lh-6-(bottom.length-1)*3.2);});
  return doc;
}
function loadPdf(){if(window.jspdf)return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

}

  const n=r.querySelector('[name=part_nombre]').value.trim(),p=r.querySelector('[name=part_precio]').value.trim();
  return {nombre:n,precio:p===''?null:r2(Number(p))};}).filter(p=>p.nombre||p.precio!=null);}
function calcTotals(partes,mo,fallback){
  const conPrecio=partes.filter(p=>p.precio!=null),ref=conPrecio.length?r2(conPrecio.reduce((t,p)=>t+p.precio,0)):null;
  if(ref==null&&mo==null)return {ref:null,mo:null,tot:fallback==null?null:fallback};
  return {ref,mo,tot:r2((ref||0)+(mo||0))};
}
function currentSvc(){return ui.edit?servicios.find(x=>x.id===ui.edit):null;}
function updateTotals(){
  const el=document.getElementById('t-tot');if(!el)return;

  const t=calcTotals(readParts(),mv===''?null:r2(Number(mv)),legacyOnly(s)?s.precio:null);
  document.getElementById('t-ref').textContent=money(t.ref||0);
  document.getElementById('t-mo').textContent=money(t.mo||0);
  el.textContent=money(t.tot||0);
  document.getElementById('r-ref').hidden=!(t.ref>0);document.getElementById('r-mo').hidden=!(t.mo>0);
}

/* ---------- ganancias (solo dueño): se calcula con la mano de obra ---------- */
const MESES_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseIso=x=>{const a=String(x).slice(0,10).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function periods(per){
  const out=[],now=new Date();
  if(per==='semana'){let w=weekStart(now);for(let i=0;i<8;i++){const s=new Date(w);s.setDate(s.getDate()-7*i);const e=new Date(s);e.setDate(e.getDate()+6);
      out.unshift({key:iso(s),from:iso(s),to:iso(e),x:s.getDate()+' '+MES[s.getMonth()],
        label:'Semana del '+s.getDate()+' '+MES[s.getMonth()]+' al '+e.getDate()+' '+MES[e.getMonth()]});}}
  else{for(let i=0;i<6;i++){const s=new Date(now.getFullYear(),now.getMonth()-i,1),e=new Date(s.getFullYear(),s.getMonth()+1,0);
      out.unshift({key:iso(s),from:iso(s),to:iso(e),x:MES[s.getMonth()],label:MESES_L[s.getMonth()][0].toUpperCase()+MESES_L[s.getMonth()].slice(1)+' '+s.getFullYear()});}}
  return out.map(p=>{const svcs=servicios.filter(s=>s.fecha>=p.from&&s.fecha<=p.to).sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:b.folio-a.folio);
    const sum=k=>r2(svcs.reduce((t,s)=>t+(Number(s[k])||0),0));
    return Object.assign(p,{svcs,mo:sum('precio_mano_obra'),ref:sum('precio_refacciones'),tot:sum('precio')});});
}
function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function shortMoney(v){return v>=1000?'$'+(Math.round(v/100)/10).toLocaleString('es-MX')+'k':'$'+Math.round(v);}
function ganView(){
  const g=ui.gan||(ui.gan={per:'mes',key:null}),ps=periods(g.per),sel=ps.find(p=>p.key===g.key)||ps[ps.length-1];
  const top=niceMax(Math.max(...ps.map(p=>p.mo)));
  let h='<section class="stack"><div><h2>Ganancias</h2><p class="hint">Se calculan con la mano de obra de cada servicio. Solo tú las ves.</p></div>'+
    '<div class="seg" role="group" aria-label="Agrupar por"><button data-act="ganPer" data-p="semana" aria-pressed="'+(g.per==='semana')+'">Por semana</button><button data-act="ganPer" data-p="mes" aria-pressed="'+(g.per==='mes')+'">Por mes</button></div>'+
    '<div class="gan-hero"><p class="eyebrow">'+esc(sel.label)+'</p><div class="gan-big">'+money(sel.mo)+'</div><p class="muted">de mano de obra</p>'+
    '<div class="gan-sub"><span>Servicios <b>'+sel.svcs.length+'</b></span><span>Refacciones <b>'+money(sel.ref)+'</b></span><span>Total cobrado <b>'+money(sel.tot)+'</b></span></div></div>'+
    '<div class="gchart" role="group" aria-label="Mano de obra por '+(g.per==='mes'?'mes':'semana')+'">'+
      [1,.5].map(f=>'<div class="gchart-grid" style="bottom:calc(26px + '+(f*100)+'% - '+(f*44)+'px)"><span>'+shortMoney(top*f)+'</span></div>').join('')+
      '<div class="gchart-base"></div><div class="gchart-cols">'+
      ps.map(p=>{const on=p.key===sel.key,pct=p.mo/top*100;
        return '<button class="gbar" data-act="ganSel" data-k="'+p.key+'" aria-pressed="'+on+'" aria-label="'+esc(p.label)+': '+money(p.mo)+' de mano de obra" title="'+esc(p.label)+': '+money(p.mo)+'">'+
          (on&&p.mo>0?'<span class="gbar-v">'+shortMoney(p.mo)+'</span>':'')+
          '<span class="gbar-fill" style="height:'+(p.mo>0?Math.max(pct,2):0)+'%"></span><span class="gbar-x">'+esc(p.x)+'</span></button>';}).join('')+
      '</div></div></section>';
  h+='<section class="stack"><div><h3>Servicios de '+esc(g.per==='mes'?sel.label.toLowerCase():sel.label.replace('Semana','la semana'))+'</h3><p class="hint">Toca uno para ver todos sus detalles.</p></div>';
  if(!sel.svcs.length)return h+'<p class="note">No hay servicios registrados en este periodo.</p></section>';
  return h+'<div class="car-list">'+sel.svcs.map(s=>{const c=carOf(s.coche_id)||{placas:'—'};
    return '<button class="gan-row" data-act="svcOpen" data-id="'+s.id+'"><span class="mini-plate">'+esc(c.placas)+'</span><span class="car-row-main"><strong>'+esc(s.servicio)+'</strong>'+
      '<span>'+fdate(s.fecha)+' · '+esc(s.cliente||c.cliente||'Sin cliente')+'</span></span>'+
      '<span class="gan-amt"><b>'+money(Number(s.precio_mano_obra)||0)+'</b><small>Total '+money(s.precio)+'</small></span></button>';}).join('')+'</div></section>';
}

    Object.assign(data,{partes,refacciones:partes.map(p=>p.nombre).filter(Boolean).join(', '),precio_refacciones:t.ref,precio_mano_obra:t.mo,precio:t.tot});
    const r=ui.edit?await sb.from('servicios').update(data).eq('id',ui.edit).select().single()
                   :await sb.from('servicios').insert(Object.assign({coche_id:ui.car,taller_id:taller.id},data)).select().single();
    if(r.error){ui.err=errText(r.error);return;}
    const was=ui.edit;servicios=servicios.filter(s=>s.id!==r.data.id).concat(r.data);ui.err=null;
    go('car',{edit:null,msg:{t:'ok',s:was?'Servicio actualizado.':'Servicio guardado. El cliente ya lo ve al escanear el QR.'}});})
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||ui.busy)return;const f=act[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b);}});
document.addEventListener('submit',e=>{e.preventDefault();const f=forms[e.target.dataset.form];if(f)f(new FormData(e.target));});
document.addEventListener('input',e=>{if(e.target.name==='part_precio'||e.target.id==='s-pmo'){updateTotals();return;}if(e.target.id==='q'){ui.q=e.target.value;const l=document.getElementById('car-list');if(l)l.innerHTML=carRows();}});
document.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.sel;if(!id)return;let s=ui.sel||[];
  s=e.target.checked?(s.includes(id)?s:s.concat(id)):s.filter(x=>x!==id);ui.sel=s;render();});

/* ---------- arranque ---------- */
(async function(){
  if(SUPABASE_URL.indexOf('TU-PROYECTO')>=0){ui.loading=false;app.innerHTML='<div class="wrap">'+header()+'<p class="msg err">Falta configurar la conexión: abre este archivo y pon tu SUPABASE_URL y SUPABASE_ANON_KEY al inicio.</p></div>';return;}
  if(!window.supabase){app.innerHTML='<div class="wrap">'+header()+'<p class="msg err">No se pudo cargar la conexión. Revisa tu internet y recarga la página.</p></div>';return;}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const {data}=await sb.auth.getSession();session=data.session;
  sb.auth.onAuthStateChange((evt,s)=>{const had=!!session;session=s;if(!s&&had){taller=null;coches=[];servicios=[];render();}});
  await load();
})();

</script>
