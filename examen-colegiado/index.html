de género:</b> herramienta de análisis para identificar desigualdades y discriminación basadas en el género y proponer acciones para eliminarlas.<br><b>Igualdad sustantiva:</b> igualdad de hecho (no solo en la ley)."},{"h":"Género en las organizaciones","b":"<b>Techo de cristal:</b> barreras invisibles que impiden a las mujeres llegar a puestos directivos. <b>Suelo pegajoso:</b> las retiene en los puestos bajos.<br><b>Brecha salarial</b> de género. Acciones afirmativas, corresponsabilidad, lenguaje incluyente, protocolos contra el hostigamiento y el acoso.<br>En México: <b>NMX-R-025-SCFI-2015</b> en Igualdad Laboral y No Discriminación (certificación voluntaria) y NOM-035 (riesgos psicosociales)."},{"h":"Inclusión","b":"Gestionar la diversidad (ver Ivancevich) con equidad e inclusión: accesibilidad, no discriminación, igualdad de oportunidades. Beneficios: innovación, talento y atención a mercados diversos."}]},{"id":"L62","u":"U6","title":"Ética, RSE, sostenibilidad y globalización","src":"gen","ref":"Programa 2127, unidad 6; ONU; ISO 26000; CEMEFI","cards":[{"h":"Ética","b":"Disciplina que estudia lo correcto e incorrecto de la conducta humana. <b>Moral</b>: normas que una sociedad practica.<br><b>Código de ética profesional</b>: principios y deberes del administrador: honestidad, lealtad, confidencialidad, responsabilidad, respeto a la ley, evitar conflictos de interés, competencia profesional y servicio a la sociedad.<br>Dilemas éticos: cuando hay valores en conflicto."},{"h":"Responsabilidad social empresarial (RSE)","b":"Compromiso voluntario de la empresa con el bienestar de sus <b>grupos de interés (stakeholders)</b>, más allá de la ley.<br><b>Pirámide de Carroll:</b> económica (base) → legal → ética → filantrópica (cima).<br><b>ISO 26000:</b> guía, <b>no certificable</b>.<br>En México: Distintivo <b>ESR</b> (CEMEFI).<br><b>Pacto Mundial de la ONU:</b> 10 principios en 4 áreas: DDHH, normas laborales, medio ambiente y anticorrupción."},{"h":"Sostenibilidad","b":"<b>Informe Brundtland (1987)</b>, «Nuestro futuro común»: desarrollo que satisface las necesidades del presente <b>sin comprometer</b> la capacidad de las generaciones futuras para satisfacer las suyas.<br><b>Triple resultado</b> (Elkington): económico, social y ambiental (<i>profit, people, planet</i>).<br><b>Agenda 2030 (2015):</b> <b>17 Objetivos de Desarrollo Sostenible (ODS)</b>.<br>Criterios <b>ASG/ESG</b>: ambiental, social y gobernanza."},{"h":"Acuerdos ambientales (línea del tiempo)","b":"Estocolmo (1972, primera conferencia de la ONU sobre el medio ambiente) → Montreal (1987, capa de ozono) → Cumbre de la Tierra de Río (1992, Agenda 21) → <b>Kioto</b> (1997, reducción de gases de efecto invernadero) → Objetivos de Desarrollo del Milenio (2000) → <b>Acuerdo de París</b> (2015, limitar el calentamiento muy por debajo de 2 °C y procurar 1.5 °C) → Agenda 2030."},{"h":"Globalización","b":"Proceso de creciente <b>interdependencia</b> económica, tecnológica, cultural y política entre países: libre flujo de bienes, capitales, información y personas.<br>Efectos en la administración: competencia global, empresas multinacionales y trasnacionales, cadenas globales de suministro y diversidad cultural (Hofstede).<br>México: TLCAN (1994) → <b>T-MEC</b> (2020).<br>Retos: desigualdad, impacto ambiental y adaptación cultural."}]}];
const BANK=[{"id":"14d3ntk","l":"L11","u":"U1","s":"mat","q":"Según su etimología, la palabra «administración» proviene de:","o":["ad (hacia) y ministratio (servir)","ad (hacia) y magister (autoridad)","admin (orden) y stratio (estrategia)","ad (junto) y ministrare (mandar)"],"e":"Ad = hacia; ministratio = servir. Minister viene de minus (subordinación); se opone a magister, que viene de magis (autoridad). Administrar es servir, no solo mandar."},{"id":"1om3ssx","l":"L11","u":"U1","s":"mat","q":"En la etimología de «administración», el término «minister» se opone a «magister». ¿Qué expresa «magis»?","o":["Autoridad, superioridad o mando","Subordinación o servicio","Comparación entre dos términos","Orden y método"],"e":"Magis = autoridad o superioridad; minus = subordinación o servicio bajo el mando de otro. El sufijo ter funciona como término de comparación."},{"id":"1gfz89c","l":"L11","u":"U1","s":"mat","q":"¿Qué autor definió la administración como «lograr un objetivo predeterminado mediante el esfuerzo ajeno»?","o":["George R. Terry","Henri Fayol","E. F. L. Brech","J. D. Mooney"],"e":"La definición de Terry se centra en el trabajo a través de otros (el esfuerzo ajeno). Fayol la define como prever, organizar, mandar, coordinar y controlar."},{"id":"1y4k9x7","l":"L11","u":"U1","s":"mat","q":"«Es el arte o técnica de dirigir e inspirar a los demás, con base en un profundo y claro conocimiento de la naturaleza humana». Esta definición corresponde a:","o":["J. D. Mooney","Koontz y O'Donnell","Wilburg Jiménez Castro","Peterson y Plowman"],"e":"Mooney subraya la dirección e inspiración basada en conocer la naturaleza humana. Koontz y O'Donnell hablan de la habilidad de conducir a los integrantes de un organismo social."},{"id":"68s5ms","l":"L11","u":"U1","s":"mat","q":"La definición que concibe la administración como «una ciencia compuesta de principios, técnicas y prácticas que permite establecer sistemas racionales de esfuerzo cooperativo» es de:","o":["Wilburg Jiménez Castro","José Antonio Fernández Arena","F. Tannenbaum","E. F. L. Brech"],"e":"Jiménez Castro: sistemas racionales de esfuerzo cooperativo. Fernández Arena: ciencia social que persigue objetivos institucionales mediante una estructura."},{"id":"1pewrv9","l":"L11","u":"U1","s":"mat","q":"Para Reyes Ponce, el OBJETO sobre el que recae la administración es:","o":["El organismo social","La máxima eficiencia","La empresa lucrativa","El capital y los recursos materiales"],"e":"El objeto es el organismo social (personas unidas para un fin común); el objeto específico es la coordinación de medios. La máxima eficiencia es la FINALIDAD, no el objeto."},{"id":"fd8laj","l":"L11","u":"U1","s":"mat","q":"La finalidad de la administración, según Reyes Ponce, es:","o":["Obtener resultados de máxima eficiencia en la coordinación","Lograr la mayor utilidad para los accionistas","Mandar y ser obedecido por el organismo social","Aplicar principios científicos inmutables"],"e":"La finalidad es la máxima eficiencia en la coordinación: la coordinación no solo suma esfuerzos, los multiplica (el ejemplo de las 10 personas que mueven una piedra)."},{"id":"vnu3ex","l":"L11","u":"U1","s":"mat","q":"La distinción entre «mecánica administrativa» y «dinámica administrativa» fue formalizada por:","o":["Lyndall Urwick","Henri Fayol","Ernest Dale","George R. Terry"],"e":"Urwick distingue la mecánica (estructuración: cómo deben ser las relaciones) de la dinámica (operación: cómo son de hecho)."},{"id":"icr1ff","l":"L11","u":"U1","s":"mat","q":"El plano arquitectónico de una casa ilustra la ___ administrativa; vivir en la casa y resolver los problemas cotidianos ilustra la ___.","o":["mecánica / dinámica","dinámica / mecánica","previsión / planeación","organización / integración"],"e":"La mecánica es la fase teórica de estructuración (cómo debe ser); la dinámica es la fase de operación (cómo es de hecho)."},{"id":"1g8dnir","l":"L11","u":"U1","s":"mat","q":"Una de las siguientes afirmaciones describe la MECÁNICA administrativa. ¿Cuál?","o":["Mira hacia el futuro y se refiere a cómo deben ser las relaciones","Se refiere al manejo real de personas y bienes en el presente","Es la fase en la que se integra, dirige y controla","Trata los problemas tal como se presentan en la práctica"],"e":"La mecánica es teórica y prospectiva: construye el marco. Integrar, dirigir y controlar pertenecen a la dinámica."},{"id":"yet7sa","l":"L11","u":"U1","s":"mat","q":"Para Reyes Ponce, la administración es:","o":["Una técnica basada en principios científicos","Un empirismo basado en la experiencia de cada caso","Una ciencia especulativa de principios inmutables","Un arte que depende exclusivamente del talento personal"],"e":"Reyes Ponce rechaza el empirismo (postura que atribuye a Ernest Dale) y sostiene que es una técnica fundamentada en principios de la sociología, la psicología y la economía."},{"id":"8rzwq","l":"L11","u":"U1","s":"mat","q":"Según Reyes Ponce, la diferencia entre ciencia y técnica consiste en que:","o":["La ciencia busca la verdad (principios que se descubren) y la técnica la utilidad práctica (reglas que se crean)","La ciencia busca la utilidad práctica mediante reglas creadas y la técnica busca la verdad mediante principios descubiertos","La ciencia se basa en la experiencia casuística y la técnica en principios sistemáticos e inmutables","La técnica es especulativa y universal, mientras que la ciencia solo resuelve problemas concretos"],"e":"Ciencia: verdad y principios descubiertos. Técnica: utilidad, con reglas e instrumentos creados por el ser humano. Empirismo: solo experiencia, caso por caso."},{"id":"18excj","l":"L11","u":"U1","s":"mat","q":"¿A qué autor atribuye Reyes Ponce la postura puramente empírica de la administración, que él rechaza?","o":["Ernest Dale","Lyndall Urwick","Henri Fayol","Luther Gulick"],"e":"Ernest Dale enfatiza el método de casos y la experiencia; Reyes Ponce sostiene que la administración no es mero empirismo."},{"id":"1qxf9hm","l":"L11","u":"U1","s":"mat","q":"Completa la definición de Reyes Ponce: «La administración es el ___ para lograr la máxima eficiencia en las formas de coordinar un organismo social».","o":["conjunto sistemático de reglas","proceso social de planear y regular","arte de dirigir e inspirar","uso de la autoridad para organizar"],"e":"Su definición real: conjunto sistemático de reglas (técnica), objeto = organismo social y fin = máxima eficiencia en la coordinación."},{"id":"1tn5ptm","l":"L11","u":"U1","s":"mat","q":"La característica de la administración según la cual «se presenta dondequiera que existe un organismo social» es la:","o":["Universalidad","Especificidad","Unidad temporal","Unidad jerárquica"],"e":"Universalidad: Estado, ejército, empresa, iglesia, club deportivo. La especificidad indica que su función es única aunque se auxilie de otras disciplinas."},{"id":"1mdr5as","l":"L11","u":"U1","s":"mat","q":"Aunque en los libros el proceso se divide en etapas, en el día a día un administrador realiza todas las etapas de forma combinada. Esto corresponde a la característica de:","o":["Unidad temporal","Unidad jerárquica","Especificidad","Universalidad"],"e":"La unidad temporal indica que el fenómeno administrativo es único y simultáneo. La unidad jerárquica dice que todos los jefes forman un solo cuerpo administrativo."},{"id":"1wcvlrz","l":"L11","u":"U1","s":"mat","q":"«Todos los que tienen carácter de jefes, desde el gerente general hasta el último supervisor, forman un solo cuerpo administrativo». Es la característica de:","o":["Unidad jerárquica","Unidad temporal","Universalidad","Especificidad"],"e":"Unidad jerárquica: un solo cuerpo administrativo a todos los niveles."},{"id":"f0w8u5","l":"L11","u":"U1","s":"mat","q":"El contador o el abogado auxilian a la administración, pero la función administrativa sigue siendo única e inconfundible. ¿Qué característica ilustra esto?","o":["Especificidad","Universalidad","Unidad temporal","Flexibilidad"],"e":"La especificidad: aunque se auxilie de la contabilidad, el derecho o la producción, la función administrativa es distinta e inconfundible."},{"id":"i94vtx","l":"L11","u":"U1","s":"mat","q":"Según Reyes Ponce, ¿por qué la administración es especialmente importante para las PyMEs?","o":["Porque la eficiencia administrativa es su única posibilidad real de competir frente a los grandes corporativos","Porque las PyMEs pueden prescindir del capital si cuentan con un administrador profesional","Porque solo en las PyMEs se cumplen la unidad temporal y la unidad jerárquica","Porque las grandes empresas ya no necesitan administración al tener procesos automatizados"],"e":"Entre los puntos de su importancia: supervivencia, clave para las PyMEs, productividad social y desarrollo nacional."},{"id":"9bf9sz","l":"L11","u":"U1","s":"mat","q":"¿Cuál de las siguientes NO es una característica de la administración según Reyes Ponce?","o":["Rentabilidad","Universalidad","Especificidad","Unidad jerárquica"],"e":"Las cuatro características son universalidad, especificidad, unidad temporal y unidad jerárquica. La rentabilidad no es una de ellas."},{"id":"1p3folh","l":"L12","u":"U1","s":"gen","q":"¿Cuál afirmación sobre «organización» y «empresa» es correcta?","o":["Toda empresa es una organización, pero no toda organización es una empresa","Toda organización es una empresa, porque produce bienes o servicios","Organización y empresa son sinónimos en administración","Una empresa solo es organización si tiene fines no lucrativos"],"e":"La organización es el género (iglesias, ONG, gobierno, clubes) y la empresa es una especie, normalmente con fines económicos."},{"id":"1654sit","l":"L12","u":"U1","s":"gen","q":"Según la clasificación de Reyes Ponce por sus fines, el Estado, el ejército, los tribunales y los partidos son organizaciones:","o":["Políticas","Económicas terciarias","De fines meramente sociales","Educativas"],"e":"Las organizaciones políticas se dirigen al logro del bien común."},{"id":"1bzzguw","l":"L12","u":"U1","s":"gen","q":"Una empresa agrícola o ganadera, cuya producción proviene fundamentalmente de las fuerzas de la naturaleza, es una organización económica:","o":["Primaria","Secundaria","Terciaria","Cuaternaria"],"e":"Primarias: la naturaleza produce y el ser humano cuida el proceso. Secundarias: industria (ingenio humano). Terciarias: servicios (comercio, banca, turismo)."},{"id":"e0454t","l":"L12","u":"U1","s":"gen","q":"Un banco o una agencia de viajes es, según Reyes Ponce, una organización económica:","o":["Terciaria","Primaria","Secundaria","Política"],"e":"Las terciarias producen servicios: comerciales, bancarias, turísticas, etc."},{"id":"iy7dyh","l":"L12","u":"U1","s":"gen","q":"La organización que «surge espontáneamente de las actividades e interacciones de los participantes» y no fue planeada formalmente es la organización:","o":["Informal","Formal","Lineal","Matricial"],"e":"La informal es vital porque resuelve rápido lo no previsto, pero puede operar en contra de los fines. La formal es una estructura planeada, resultado de una decisión explícita."},{"id":"5ixfjh","l":"L12","u":"U1","s":"gen","q":"Según Robert Katz, las habilidades que más pesan en la ALTA dirección son las:","o":["Conceptuales","Técnicas","Manuales","Operativas"],"e":"Las conceptuales (ver la organización como un todo) predominan arriba; las técnicas, en los niveles bajos; las humanas son importantes en todos los niveles."},{"id":"1hlxx2b","l":"L12","u":"U1","s":"gen","q":"Las habilidades humanas, según Katz:","o":["Son importantes en todos los niveles administrativos","Solo se requieren en los mandos medios","Son exclusivas del nivel operativo","Pierden importancia conforme se asciende"],"e":"Trabajar con personas es necesario en todos los niveles."},{"id":"1r2hepu","l":"L12","u":"U1","s":"gen","q":"Henry Mintzberg agrupa los roles gerenciales en tres categorías. ¿Cuáles son?","o":["Interpersonales, informativos y decisorios","Técnicos, humanos y conceptuales","Planeación, organización y control","Estratégicos, tácticos y operativos"],"e":"Son 10 roles: interpersonales (figura, líder, enlace), informativos (monitor, difusor, portavoz) y decisorios (emprendedor, manejador de perturbaciones, asignador de recursos, negociador). La opción «técnicos, humanos y conceptuales» corresponde a las habilidades de Katz."},{"id":"w5kvjo","l":"L12","u":"U1","s":"gen","q":"Un gerente que negocia con el sindicato un nuevo contrato colectivo desempeña, según Mintzberg, un rol:","o":["Decisorio (negociador)","Interpersonal (enlace)","Informativo (portavoz)","Interpersonal (figura representativa)"],"e":"Negociador es uno de los cuatro roles decisorios."},{"id":"glhs28","l":"L12","u":"U1","s":"gen","q":"Una directora que asiste a la inauguración de una planta y corta el listón en representación de la empresa desempeña el rol de:","o":["Figura representativa (interpersonal)","Monitor (informativo)","Emprendedor (decisorio)","Asignador de recursos (decisorio)"],"e":"La figura representativa (cabeza visible) cumple deberes simbólicos, legales o ceremoniales."},{"id":"1d2j5vn","l":"L12","u":"U1","s":"gen","q":"Lograr los objetivos propuestos es ___; lograrlos con el menor uso de recursos es ___.","o":["eficacia / eficiencia","eficiencia / eficacia","efectividad / productividad","eficiencia / efectividad"],"e":"Reyes Ponce (cap. 9): «la eficacia consiste en lograr las metas u objetivos»; la eficiencia se refiere al mejor uso de los recursos."},{"id":"7g3a8f","l":"L12","u":"U1","s":"gen","q":"Según Luhmann, ¿qué sistema social se caracteriza por poner condiciones que deben aceptar quienes desean pertenecer a él como miembros?","o":["Organización","Sociedad","Interacción","Comunidad"],"e":"La sociedad abarca todas las comunicaciones posibles; la interacción es pasajera, entre personas presentes; la organización fija condiciones de membresía."},{"id":"58acmc","l":"L12","u":"U1","s":"gen","q":"Una conversación entre tres personas en un pasillo, que termina cuando se despiden, es para Luhmann un sistema de:","o":["Interacción","Organización","Sociedad","Burocracia"],"e":"La interacción es un sistema social pasajero entre personas físicamente presentes; su autopoiesis termina cuando se separan."},{"id":"11gumwp","l":"L12","u":"U1","s":"gen","q":"Según Reyes Ponce, en los altos niveles predomina la función de ___ y en los supervisores inmediatos la de ___.","o":["dirección / supervisión","supervisión / dirección","ejecución / planeación","control / previsión"],"e":"Altos directivos: dirección (qué hacer); ejecutivos y técnicos: administración (cómo); supervisores inmediatos: supervisión (vigilar que se haga)."},{"id":"12qtzxm","l":"L13","u":"U1","s":"mat","q":"Según Ivancevich, el «contrato psicológico» es:","o":["Un acuerdo no escrito sobre las expectativas mutuas de contribución y recompensa entre trabajador y empleador","El contrato individual de trabajo que firman el trabajador y el patrón ante la autoridad laboral","El conjunto de pruebas psicométricas que se aplican en el proceso de selección de personal","El reglamento interior de trabajo que establece obligaciones y sanciones para ambas partes"],"e":"Es implícito, no escrito. El «nuevo» contrato psicológico ya no garantiza empleo de por vida: el empleo depende del desempeño, y el trabajador exige honestidad, respeto a su salud y flexibilidad."},{"id":"vi75x6","l":"L13","u":"U1","s":"mat","q":"¿Cuál de las siguientes NO es una de las fuerzas ambientales que rediseñan la práctica administrativa según Ivancevich?","o":["La centralización del poder","La globalización","La diversidad cultural","El contrato psicológico"],"e":"Las fuerzas son: poder de los recursos humanos, globalización, diversidad cultural, rapidez del cambio, contrato psicológico y tecnología."},{"id":"119wx8b","l":"L13","u":"U1","s":"mat","q":"Los estudios Hawthorne, según Ivancevich, se realizaron:","o":["Entre 1924 y 1932 en la planta Hawthorne de Western Electric","Entre 1890 y 1930 en la Midvale Steel Company","En 1911 en la Ford Motor Company","Entre 1950 y 1960 en General Motors"],"e":"Mayo, Roethlisberger y Dickson, con más de 20,000 empleados. 1890-1930 es el periodo que Ivancevich asigna a la administración científica de Taylor."},{"id":"yr4wdp","l":"L13","u":"U1","s":"mat","q":"El hallazgo central de los estudios Hawthorne fue que:","o":["El comportamiento individual se modifica profundamente por los grupos informales y por saberse observado","La productividad depende principalmente de las condiciones físicas, como la iluminación del taller","Los incentivos económicos individuales son el único factor que eleva la productividad del obrero","La especialización extrema de las tareas siempre eleva la productividad, sin importar el grupo"],"e":"El efecto Hawthorne demostró el peso de lo social y emocional sobre la productividad."},{"id":"8arkh8","l":"L13","u":"U1","s":"mat","q":"¿Qué disciplina aporta al comportamiento organizacional conceptos como aprendizaje, motivación, personalidad y percepción en el nivel INDIVIDUAL?","o":["Psicología","Sociología","Ciencia política","Antropología"],"e":"Psicología → individuo. Sociología → grupo/organización. Psicología social → grupo. Antropología → cultura. Ciencia política → conflicto y poder."},{"id":"gqld6c","l":"L13","u":"U1","s":"mat","q":"El estudio del conflicto, el poder y la política intraorganizacional proviene principalmente de:","o":["Las ciencias políticas","La psicología","La antropología cultural","La economía"],"e":"Según la matriz de Robbins que retoma Ivancevich, las ciencias políticas estudian el conflicto, el poder y la política organizacional."},{"id":"1i9fiwl","l":"L13","u":"U1","s":"mat","q":"¿Cuál NO es una de las seis características del comportamiento organizacional según Ivancevich?","o":["Es una disciplina exclusivamente contable","Es multidisciplinario","Tiene orientación humanista","Usa el método científico"],"e":"Las seis: forma de pensar (3 niveles), multidisciplinario, humanista, orientado al desempeño, uso del método científico y orientación a las aplicaciones."},{"id":"cli770","l":"L13","u":"U1","s":"mat","q":"En el modelo de efectividad organizacional de Ivancevich, la SUPERVIVENCIA corresponde al:","o":["Largo plazo","Corto plazo","Mediano plazo","Plazo inmediato"],"e":"Corto: calidad, productividad, eficiencia y satisfacción. Mediano: adaptabilidad y desarrollo. Largo: supervivencia."},{"id":"1o6fzty","l":"L13","u":"U1","s":"mat","q":"La adaptabilidad y el desarrollo (invertir en capacitación e innovación) son criterios de efectividad de:","o":["Mediano plazo","Corto plazo","Largo plazo","Ningún plazo, porque son criterios de calidad"],"e":"Una empresa muy productiva hoy (corto plazo) que no se adapta ni capacita (mediano plazo) no sobrevivirá (largo plazo)."},{"id":"15zbe32","l":"L13","u":"U1","s":"mat","q":"Ver a la organización como un sistema abierto implica:","o":["Que toma insumos del entorno, los transforma y devuelve productos al entorno, en interdependencia con él","Que su estructura carece de límites y jerarquías, porque todos los miembros deciden por igual","Que funciona de manera autosuficiente, sin que el entorno influya en sus procesos internos","Que todas sus decisiones deben hacerse públicas para mantener la confianza de la sociedad"],"e":"Insumos (personas, materias primas, capital, información) → transformación → productos. «Ninguna empresa es una isla»."},{"id":"5jg3i3","l":"L13","u":"U1","s":"mat","q":"Según la lectura de Drucker «Manejarse a uno mismo», el análisis de retroalimentación sirve para:","o":["Descubrir tus fortalezas comparando lo que esperabas con los resultados reales","Evaluar el desempeño de tus subordinados comparando sus metas con las de la empresa","Medir la satisfacción del cliente comparando sus expectativas con el servicio recibido","Fijar el presupuesto anual comparando los gastos reales con los gastos planeados"],"e":"Drucker también propone conocer tu estilo de aprendizaje (lector u oyente) y alinear tus valores con los de la organización."},{"id":"qiwr36","l":"L13","u":"U1","s":"mat","q":"Para Ivancevich (con base en Deming y Juran), la calidad es:","o":["La satisfacción de las necesidades y expectativas del cliente","Lo más brillante o costoso de un producto","El cumplimiento de las normas internas de fabricación","La ausencia total de costos"],"e":"La calidad es un criterio transversal que conecta el corto, el mediano y el largo plazo: sin calidad percibida no hay supervivencia."},{"id":"18slj39","l":"L13","u":"U1","s":"mat","q":"En el marco de análisis del CO, el liderazgo, el poder y el conflicto se estudian en el nivel del:","o":["Grupo","Individuo","Proceso","Ambiente externo"],"e":"Individuo: percepción, valores, motivación. Grupo: liderazgo, poder, conflicto. Procesos: comunicación, decisiones. Estructura: diseño, cambio e innovación."},{"id":"v60186","l":"L21","u":"U2","s":"gen","q":"La obra «Principios de la administración científica» (1911) es de:","o":["Frederick W. Taylor","Henri Fayol","Henry Ford","Elton Mayo"],"e":"Taylor publicó Principles of Scientific Management en 1911. La obra de Fayol es Administración industrial y general (1916)."},{"id":"exfu0a","l":"L21","u":"U2","s":"gen","q":"El énfasis del enfoque científico de Taylor está en:","o":["Las tareas y la eficiencia del nivel operativo","La estructura de la organización como un todo","Las relaciones humanas y los grupos informales","El entorno y la adaptación de la organización"],"e":"Taylor trabaja de abajo hacia arriba (el obrero y la tarea). Fayol pone el énfasis en la estructura, de arriba hacia abajo."},{"id":"q84lo1","l":"L21","u":"U2","s":"gen","q":"¿Cuál de los siguientes NO es uno de los cuatro principios de la administración científica de Taylor?","o":["Unidad de dirección","Planeación","Preparación","Control"],"e":"Los de Taylor son planeación, preparación, control y ejecución. La unidad de dirección es uno de los 14 principios de Fayol."},{"id":"1jk9nh8","l":"L21","u":"U2","s":"gen","q":"El principio de Taylor que consiste en «sustituir la improvisación y el criterio individual por métodos basados en procedimientos científicos» es el de:","o":["Planeación","Ejecución","Control","Preparación"],"e":"Preparación = seleccionar y entrenar científicamente; control = verificar que el trabajo se haga según lo planeado; ejecución = distribuir atribuciones y responsabilidades."},{"id":"5gh2ol","l":"L21","u":"U2","s":"gen","q":"La concepción del trabajador como alguien motivado esencialmente por el dinero (homo economicus) es característica del enfoque:","o":["Científico","Humano-relacionista","Neohumano-relacionista","Estructuralista"],"e":"Taylor creía en los incentivos salariales. El humano-relacionismo concibe al homo social."},{"id":"194sfe3","l":"L21","u":"U2","s":"gen","q":"La gráfica de barras para programar y controlar actividades en el tiempo fue desarrollada por:","o":["Henry L. Gantt","Frank Gilbreth","Harrington Emerson","Frederick Taylor"],"e":"Gantt, colaborador de Taylor, creó la gráfica de Gantt y un sistema de bonos por tarea."},{"id":"1iysgf","l":"L21","u":"U2","s":"gen","q":"El estudio sistemático de los movimientos (los «therbligs») y de la fatiga se asocia con:","o":["Frank y Lillian Gilbreth","Henry Ford","Henri Fayol","Max Weber"],"e":"Los Gilbreth descompusieron el trabajo en movimientos elementales; therblig es Gilbreth escrito casi al revés."},{"id":"bzu7ui","l":"L21","u":"U2","s":"gen","q":"La línea de montaje y la producción en masa, con los principios de intensificación, economicidad y productividad, se asocian con:","o":["Henry Ford","Frederick Taylor","Henri Fayol","Elton Mayo"],"e":"Ford aplicó la línea de montaje móvil (Modelo T)."},{"id":"2iyeuc","l":"L21","u":"U2","s":"gen","q":"¿Cuál de las seis funciones básicas de la empresa según Fayol coordina a las demás?","o":["Las administrativas","Las técnicas","Las comerciales","Las financieras"],"e":"Las seis funciones son técnicas, comerciales, financieras, de seguridad, contables y administrativas. Las administrativas (prever, organizar, mandar, coordinar, controlar) integran a las otras cinco."},{"id":"gbl4zk","l":"L21","u":"U2","s":"gen","q":"Para Fayol, administrar es:","o":["Prever, organizar, mandar, coordinar y controlar","Planear, organizar, integrar, dirigir y controlar","Planear, organizar y supervisar","Planear, organizar, ejecutar y controlar"],"e":"Son los elementos de Fayol. La de cinco elementos con integración es de Koontz y O'Donnell; la de tres, de la AMA; la de cuatro, de Terry."},{"id":"160tvw2","l":"L21","u":"U2","s":"gen","q":"El principio de Fayol según el cual «cada empleado debe recibir órdenes de un solo superior» es:","o":["Unidad de mando","Unidad de dirección","Jerarquía o cadena escalar","Centralización"],"e":"Unidad de mando = un solo jefe. Unidad de dirección = un solo plan y un solo jefe para un grupo de actividades con el mismo objetivo."},{"id":"8let1f","l":"L21","u":"U2","s":"gen","q":"«Un solo jefe y un solo plan para un conjunto de actividades que persiguen el mismo objetivo». ¿Qué principio de Fayol es?","o":["Unidad de dirección","Unidad de mando","Orden","Espíritu de equipo"],"e":"No confundir: unidad de MANDO se refiere a las personas (un jefe por persona); unidad de DIRECCIÓN, a los planes y objetivos."},{"id":"1dh0ij3","l":"L21","u":"U2","s":"gen","q":"¿Cuál NO es uno de los 14 principios de Fayol?","o":["Estudio de tiempos y movimientos","Estabilidad del personal","Equidad","Espíritu de equipo"],"e":"El estudio de tiempos y movimientos es una herramienta de Taylor y de la administración científica."},{"id":"1ly6fvs","l":"L21","u":"U2","s":"gen","q":"Una diferencia clave entre Taylor y Fayol es que:","o":["Taylor analiza de abajo hacia arriba (la tarea) y Fayol de arriba hacia abajo (la estructura y la dirección)","Taylor se enfocó en la estructura de la dirección general y Fayol en la tarea del obrero en el taller","Taylor desarrolló su obra en Francia, en una empresa minera, y Fayol en la industria estadounidense","Fayol rechazaba la división del trabajo, mientras que Taylor la consideraba el principio fundamental"],"e":"Taylor era estadounidense (taller). Fayol era francés (dirección general de una empresa minera)."},{"id":"dl74ta","l":"L21","u":"U2","s":"gen","q":"Antecedente histórico que aportó a la administración la cadena de mando y el concepto de staff (estado mayor):","o":["La organización militar","El Código de Hammurabi","La Revolución Francesa","El feudalismo"],"e":"El ejército aportó la jerarquía, la unidad de mando y el staff. La Iglesia católica aportó la jerarquía de autoridad."},{"id":"7tb5a8","l":"L21","u":"U2","s":"gen","q":"¿Qué hecho histórico generó la necesidad de una administración sistemática de grandes fábricas a finales del s. XVIII y en el s. XIX?","o":["La Revolución Industrial","La caída del Imperio romano","El Renacimiento","La Segunda Guerra Mundial"],"e":"La Revolución Industrial concentró a miles de trabajadores en fábricas y, con ello, nacieron los problemas de productividad que atacó la administración científica."},{"id":"hicdim","l":"L22","u":"U2","s":"gen","q":"El enfoque humano-relacionista surge principalmente como reacción a:","o":["El mecanicismo y la deshumanización del enfoque clásico y científico","La rigidez de la burocracia de Weber y su apego a las normas escritas","El uso excesivo de modelos matemáticos de la investigación de operaciones","La visión del enfoque de sistemas, que ignoraba al individuo"],"e":"Mayo y su grupo destacaron los factores sociales y emocionales que el taylorismo ignoraba."},{"id":"jr49ba","l":"L22","u":"U2","s":"gen","q":"La figura central del enfoque humano-relacionista es:","o":["Elton Mayo","Abraham Maslow","Douglas McGregor","Max Weber"],"e":"Mayo dirigió los estudios Hawthorne. Maslow y McGregor pertenecen al neohumano-relacionismo (conductismo)."},{"id":"1vrj9pl","l":"L22","u":"U2","s":"gen","q":"Los experimentos de Hawthorne comenzaron estudiando la relación entre la productividad y:","o":["La iluminación del lugar de trabajo","El salario por destajo","El estilo de liderazgo","La estructura de los organigramas"],"e":"La productividad subía incluso al bajar la luz. Así se descubrió que el factor decisivo era social: la atención, la pertenencia y las normas del grupo."},{"id":"su37ym","l":"L22","u":"U2","s":"gen","q":"Para Mary Parker Follett, la mejor forma de resolver un conflicto es por:","o":["Integración","Dominación","Compromiso","Supresión"],"e":"Por dominación una parte gana todo; por compromiso ambas ceden; por integración ambas logran lo que buscan al replantear el problema. Reyes Ponce lo retoma en el principio del aprovechamiento del conflicto."},{"id":"11jmcex","l":"L22","u":"U2","s":"gen","q":"Según Maslow, ¿qué necesidad aparece inmediatamente después de satisfacer las fisiológicas?","o":["Seguridad","Pertenencia o afecto","Estima","Autorrealización"],"e":"El orden es fisiológicas → seguridad → pertenencia → estima → autorrealización."},{"id":"ibc3fh","l":"L22","u":"U2","s":"gen","q":"Un principio fundamental de Maslow es que:","o":["Una necesidad satisfecha deja de ser motivante","El dinero es el único motivador universal","Las necesidades superiores aparecen antes que las fisiológicas","Todas las necesidades motivan con la misma fuerza a la vez"],"e":"Ejemplo de Reyes Ponce: quien trabaja para comprar un coche deja de estar motivado por ese coche al adquirirlo."},{"id":"lv8zf","l":"L22","u":"U2","s":"gen","q":"La Teoría X de McGregor supone que el trabajador:","o":["Rechaza el trabajo y necesita ser controlado y amenazado","Busca responsabilidades y se autodirige","Es creativo y se compromete con los objetivos","Trabaja por autorrealización"],"e":"La Teoría Y supone lo contrario: el trabajo es natural y hay autocontrol y compromiso."},{"id":"d4peo5","l":"L22","u":"U2","s":"gen","q":"Según Herzberg, el salario, las condiciones de trabajo y la supervisión son factores:","o":["Higiénicos: evitan la insatisfacción, pero no motivan","Motivadores: generan satisfacción duradera","Autorrealizadores","De pertenencia"],"e":"Los motivadores son el logro, el reconocimiento, el trabajo en sí, la responsabilidad y el crecimiento."},{"id":"rm9h6a","l":"L22","u":"U2","s":"gen","q":"En la clasificación de Likert, el sistema en el que los subordinados participan plenamente en las decisiones es el:","o":["Sistema 4: participativo","Sistema 1: autoritario-coercitivo","Sistema 2: autoritario-benevolente","Sistema 3: consultivo"],"e":"El material de estructura asocia el modelo orgánico con el Sistema 4 y el mecanicista con el Sistema 1."},{"id":"1adt7it","l":"L22","u":"U2","s":"gen","q":"La «ley de la situación» de Follett, según la cual la orden debe surgir de lo que exige la situación y no del capricho del jefe, la retoma Reyes Ponce como el principio de:","o":["Impersonalidad del mando","Vía jerárquica","Unidad de mando","Coordinación de intereses"],"e":"Cuanto más se presenta una orden como una exigencia de la situación (y no de la voluntad del que manda), mejor se obedece."},{"id":"19q1sk2","l":"L22","u":"U2","s":"gen","q":"¿Cuál autor NO pertenece al enfoque neohumano-relacionista (conductista)?","o":["Frederick Taylor","Douglas McGregor","Frederick Herzberg","Chris Argyris"],"e":"Taylor es de la administración científica. McGregor, Herzberg, Argyris, Maslow, Likert y McClelland son neohumano-relacionistas."},{"id":"1uybkal","l":"L22","u":"U2","s":"gen","q":"El neohumano-relacionismo se distingue del humano-relacionismo en que:","o":["Busca integrar las necesidades de las personas con los objetivos de la organización, con apoyo de las ciencias de la conducta","Rechaza el estudio de los grupos informales y se centra solo en la estructura formal de la organización","Vuelve a concebir al trabajador como homo economicus, motivado esencialmente por el salario","Sustituye las ciencias de la conducta por modelos matemáticos para la toma de decisiones"],"e":"No solo busca la felicidad del trabajador (crítica al humano-relacionismo): concilia la motivación con la productividad."},{"id":"1kdpsyy","l":"L23","u":"U2","s":"gen","q":"Para Max Weber, la burocracia es:","o":["La forma más eficiente y racional de administrar organizaciones grandes y complejas","Una forma de administración pública lenta, ineficiente y basada en trámites excesivos","Un tipo de autoridad que descansa en las cualidades extraordinarias de un líder","Una forma de organización informal que surge espontáneamente en los grupos de trabajo"],"e":"Reyes Ponce aclara que burocracia no significa algo bueno o malo de suyo: se refiere a ciertas características del diseño organizacional."},{"id":"hl0mpq","l":"L23","u":"U2","s":"gen","q":"El tipo de autoridad que sustenta a la burocracia según Weber es la:","o":["Racional-legal","Carismática","Tradicional","Patrimonial"],"e":"Weber distingue la autoridad tradicional, la carismática y la racional-legal; la burocracia descansa en la racional-legal."},{"id":"r0m2sm","l":"L23","u":"U2","s":"gen","q":"Según Hall (citado por Reyes Ponce), de las seis dimensiones de la burocracia, las tres PRINCIPALES son:","o":["División del trabajo, jerarquía de autoridad e impersonalidad","Reglas, procedimientos y competencia técnica","Jerarquía, salarios y antigüedad","Impersonalidad, comités y staff"],"e":"Las seis son: división del trabajo por especialización, jerarquía definida, impersonalidad, reglas, procedimientos y selección por competencia técnica."},{"id":"19s6mi3","l":"L23","u":"U2","s":"gen","q":"La crítica de Merton a la burocracia sostiene que:","o":["El apego rígido a las reglas por sí mismas puede desplazar el objetivo principal de la organización","La burocracia es demasiado flexible, lo que provoca desorden y falta de control","La burocracia ignora la especialización y la competencia técnica de sus miembros","La burocracia elimina la jerarquía y genera conflictos entre los departamentos"],"e":"Es el desplazamiento de fines: los medios (reglas) se convierten en fines."},{"id":"1wet55a","l":"L23","u":"U2","s":"gen","q":"Según Reyes Ponce, la forma burocrática es más apropiada para:","o":["Actividades rutinarias donde el objetivo es la productividad","Organizaciones que requieren alta creatividad e innovación","Proyectos temporales como los de la NASA","Equipos autodirigidos"],"e":"No es adecuada para organizaciones no rutinarias, donde importan la creatividad y la innovación."},{"id":"1i3wug3","l":"L23","u":"U2","s":"gen","q":"Luhmann reconoce como aporte de la burocracia weberiana que:","o":["Elimina el favoritismo y la arbitrariedad en la cúspide y los reemplaza por la igualdad y la norma escrita","Supone una obediencia perfecta de los subordinados, que en la realidad sí se cumple","Elimina por completo la organización informal y las negociaciones en los niveles bajos","Hace innecesarias las normas generales, porque cada caso se resuelve personalmente"],"e":"El límite que Luhmann señala es que supone una obediencia perfecta que no existe: abajo siempre hay margen de interpretación y colusiones."},{"id":"hqc23y","l":"L23","u":"U2","s":"gen","q":"Amitai Etzioni clasificó las organizaciones, según el tipo de control que usan, en:","o":["Coercitivas, utilitarias y normativas","Primarias, secundarias y terciarias","Lineales, funcionales y staff","Mecánicas, orgánicas y matriciales"],"e":"Coercitivas (prisiones), utilitarias (empresas: incentivos económicos) y normativas (iglesias, voluntariado: compromiso moral)."},{"id":"1hp1ujo","l":"L23","u":"U2","s":"gen","q":"El enfoque estructuralista se caracteriza por:","o":["Estudiar conjuntamente la organización formal e informal y aceptar el conflicto como inevitable","Enfocarse exclusivamente en la tarea del obrero y en el estudio de tiempos y movimientos","Rechazar el estudio de la burocracia y centrarse solo en las relaciones humanas","Usar únicamente modelos matemáticos para eliminar el conflicto organizacional"],"e":"Integra la visión clásica y la humanista; concibe al hombre organizacional, que desempeña múltiples roles."},{"id":"xjfctx","l":"L23","u":"U2","s":"gen","q":"El enfoque neoclásico se caracteriza por:","o":["Su pragmatismo, el énfasis en objetivos y resultados y el eclecticismo, retomando los postulados clásicos","Rechazar por completo los principios de Fayol y sustituirlos por la psicología del trabajador","Centrarse en las necesidades psicológicas del trabajador por encima de los resultados","Basarse en la teoría general de sistemas y en los modelos de la investigación de operaciones"],"e":"Autores: Drucker, Koontz y O'Donnell, Dale y Newman. Aporte central: la administración por objetivos (APO)."},{"id":"8kxylb","l":"L23","u":"U2","s":"gen","q":"¿Quién es reconocido como el catalizador de la administración por objetivos (APO) en 1954?","o":["Peter F. Drucker","Douglas McGregor","Harold Koontz","Henri Fayol"],"e":"Koontz y Weihrich: Drucker insistió en fijar objetivos en todas las áreas y sentó una filosofía de autocontrol y autodirección. McGregor (1957) la llevó a la evaluación del desempeño."},{"id":"1v8r783","l":"L23","u":"U2","s":"gen","q":"Según Koontz y Weihrich, Douglas McGregor (1957) propuso usar la APO para:","o":["Evaluar el desempeño con base en metas que fija el propio subordinado, en lugar de rasgos de personalidad","Imponer metas desde la alta dirección y evaluar los rasgos de personalidad del subordinado","Sustituir la evaluación del desempeño por un sistema de presupuestos y pronósticos","Centralizar en el superior la fijación de metas y la calificación de cada empleado"],"e":"Énfasis en el desempeño, no en la personalidad; el superior actúa como asesor y conserva el veto."},{"id":"3g3f6g","l":"L24","u":"U2","s":"gen","q":"La Teoría General de Sistemas fue propuesta por:","o":["Ludwig von Bertalanffy","Herbert Simon","Edgar Morin","Peter Drucker"],"e":"Bertalanffy, biólogo; Katz y Kahn la aplicaron a las organizaciones como sistemas abiertos."},{"id":"sxcuas","l":"L24","u":"U2","s":"gen","q":"El concepto de «sinergia» significa que:","o":["El todo es mayor que la suma de sus partes","El sistema tiende al desorden y al desgaste","El sistema mantiene su equilibrio dinámico","Se puede llegar al mismo resultado por caminos distintos"],"e":"Koontz lo ilustra como «2 + 2 = 5». Entropía = desorden; homeostasis = equilibrio; equifinalidad = caminos distintos al mismo fin."},{"id":"3sa4k2","l":"L24","u":"U2","s":"gen","q":"La tendencia de todo sistema al desgaste y la desorganización se llama:","o":["Entropía","Homeostasis","Sinergia","Equifinalidad"],"e":"Los sistemas abiertos combaten la entropía importando energía del entorno (negentropía)."},{"id":"3nwm7o","l":"L24","u":"U2","s":"gen","q":"Que dos empresas lleguen al mismo nivel de éxito con estrategias diferentes ilustra el concepto sistémico de:","o":["Equifinalidad","Entropía","Homeostasis","Retroalimentación negativa"],"e":"Equifinalidad: un mismo estado final desde distintas condiciones iniciales o por distintos caminos."},{"id":"7otvgz","l":"L24","u":"U2","s":"gen","q":"Según Luhmann (cap. 1), la función primaria del sistema organizativo frente a su entorno es:","o":["Reducir la complejidad externa para poder tomar decisiones viables","Aumentar la complejidad interna para igualar la del entorno","Aislarse por completo del entorno","Maximizar el número de alternativas analizadas"],"e":"El entorno es infinitamente más complejo que la organización, por eso el sistema filtra y reduce esa complejidad (homeostasis)."},{"id":"dkfx73","l":"L24","u":"U2","s":"gen","q":"El enfoque matemático o cuantitativo de la administración tuvo su origen principal en:","o":["La investigación de operaciones durante la Segunda Guerra Mundial","Los estudios de la planta Hawthorne de la Western Electric","La Revolución Francesa y los trabajos de Saint-Simon","El movimiento de la calidad total en el Japón de la posguerra"],"e":"Equipos interdisciplinarios aplicaron modelos matemáticos a problemas militares; luego pasaron a las empresas."},{"id":"ij7n49","l":"L24","u":"U2","s":"gen","q":"¿Cuál de las siguientes es una herramienta del enfoque matemático?","o":["Programación lineal y teoría de juegos","Pirámide de necesidades","Los 14 principios de administración","El modelo de tres capas de la cultura"],"e":"También la teoría de colas, PERT/CPM, la simulación y la teoría de decisiones."},{"id":"bg7are","l":"L24","u":"U2","s":"gen","q":"El ciclo PHVA (Planear-Hacer-Verificar-Actuar), difundido por Deming, fue ideado originalmente por:","o":["Walter Shewhart","Joseph Juran","Philip Crosby","Kaoru Ishikawa"],"e":"Por eso también se le llama ciclo de Shewhart o de Deming."},{"id":"d1m1y3","l":"L24","u":"U2","s":"gen","q":"La «trilogía de la calidad» (planificación, control y mejora) se debe a:","o":["Joseph M. Juran","W. Edwards Deming","Philip Crosby","Armand Feigenbaum"],"e":"Juran también definió la calidad como adecuación al uso."},{"id":"152p39z","l":"L24","u":"U2","s":"gen","q":"El concepto de «cero defectos» y la frase «la calidad es gratis» son de:","o":["Philip Crosby","Kaoru Ishikawa","Joseph Juran","Taiichi Ohno"],"e":"Crosby sostuvo que hacer las cosas bien a la primera cuesta menos que corregir errores."},{"id":"1atlpmn","l":"L24","u":"U2","s":"gen","q":"El diagrama causa-efecto (espina de pescado) y los círculos de calidad se asocian con:","o":["Kaoru Ishikawa","W. Edwards Deming","Philip Crosby","Ludwig von Bertalanffy"],"e":"Ishikawa impulsó la participación de los trabajadores en la mejora (círculos de calidad)."},{"id":"16sw32e","l":"L24","u":"U2","s":"gen","q":"El pensamiento complejo es propuesto por:","o":["Edgar Morin","Niklas Luhmann","Herbert Simon","Peter Senge"],"e":"Morin plantea religar saberes frente al pensamiento simplificador que separa y reduce."},{"id":"1168k71","l":"L24","u":"U2","s":"gen","q":"El principio de Morin según el cual «la parte está en el todo y el todo está en la parte» es el principio:","o":["Hologramático","Dialógico","De recursividad organizacional","De equifinalidad"],"e":"Dialógico: dos lógicas opuestas que se complementan. Recursividad: los productos y efectos son también causas y productores."},{"id":"157eppa","l":"L24","u":"U2","s":"gen","q":"El modelo del bote de basura (garbage can) de Cohen, March y Olsen sostiene que:","o":["En entornos ambiguos, problemas, soluciones, participantes y oportunidades de elección circulan de forma independiente","Toda decisión sigue un orden lineal: primero se define el problema, luego se analiza y al final se elige la solución","Las organizaciones deben desechar las soluciones anteriores y crear una nueva para cada problema que surge","Solo la alta dirección es capaz de decidir racionalmente, porque concentra toda la información necesaria"],"e":"A veces las empresas tienen «soluciones guardadas en el cajón» que buscan un problema que resolver."},{"id":"v5o5er","l":"L24","u":"U2","s":"gen","q":"Karl Weick, con el concepto de «enactment», sostiene que:","o":["La organización construye y delimita su propio entorno con sus experiencias y decisiones","El entorno es algo objetivo y dado de antemano, al que la organización solo puede reaccionar","La organización debe adaptarse pasivamente a los cambios del mercado sin intentar influir en ellos","La cultura y las experiencias pasadas no influyen en la forma en que se decide"],"e":"Es el giro construccionista que retoma Luhmann. El enfoque institucionalista (Meyer y Rowan) habla de imitar estructuras para ganar legitimidad (isomorfismo)."},{"id":"3gzpnf","l":"L24","u":"U2","s":"gen","q":"Según el enfoque institucionalista (Meyer y Rowan; DiMaggio y Powell), las organizaciones adoptan ciertas estructuras:","o":["Para ganar legitimidad social imitando mitos institucionales (isomorfismo)","Exclusivamente por razones de eficiencia técnica y reducción de costos","Para reducir el número de niveles jerárquicos y acelerar las decisiones","Porque así lo determina su autopoiesis, sin influencia de otras organizaciones"],"e":"No solo por eficiencia: también por legitimidad cultural."},{"id":"1q28x7w","l":"L25","u":"U2","s":"mat","q":"Para March y Simon, ¿cuál es la concepción del miembro de la organización propia del enfoque de Simon?","o":["Tomador de decisiones y solucionador de problemas","Instrumento pasivo","Portador de actitudes y motivos","Hombre económico maximizador"],"e":"Instrumento pasivo = taylorismo; portador de actitudes y motivos = relaciones humanas (Mayo); tomador de decisiones = Simon."},{"id":"100iswh","l":"L25","u":"U2","s":"mat","q":"Concebir al trabajador como «portador de actitudes y motivos» corresponde, según March y Simon, a:","o":["Las relaciones humanas (Elton Mayo)","La administración científica","El enfoque de Simon","La burocracia de Weber"],"e":"El trabajador tiene valores, emociones y necesidades que deben estimularse."},{"id":"1uxx6uq","l":"L25","u":"U2","s":"mat","q":"Al concebir al individuo como decisor, Simon:","o":["Le reconoce un espacio de autonomía y critica implícitamente el control impositivo de la administración científica","Elimina toda autonomía del trabajador, porque las decisiones se fijan desde la cúspide","Regresa a la idea taylorista del trabajador como pieza de una máquina","Niega la importancia de la autoridad y de la división del trabajo en la organización"],"e":"Ninguna empresa controla el 100% de lo que hace un trabajador: siempre hay un margen donde decide con su criterio."},{"id":"rrp8sl","l":"L25","u":"U2","s":"mat","q":"Simon critica los «principios» tradicionales de la administración porque:","o":["Son vagos: antes de desarrollar principios, una ciencia debe poseer conceptos operativos","Son demasiado matemáticos y difíciles de aplicar en la administración pública","Fueron creados por sociólogos que no conocían la práctica de las empresas","Ignoran el estudio de tiempos y movimientos y la medición del trabajo"],"e":"Benveniste: toda ciencia se legitima al crear una terminología propia."},{"id":"1bu8dle","l":"L25","u":"U2","s":"mat","q":"Según Simon, los dos principios sustanciales de la acción administrativa son:","o":["Impersonalidad e intencionalidad","Autoridad y obediencia","Especialización y jerarquía","Eficiencia y eficacia"],"e":"Impersonalidad: responde a intereses colectivos, no a deseos egoístas. Intencionalidad: orientada conscientemente a metas."},{"id":"3nv3l6","l":"L25","u":"U2","s":"mat","q":"¿Cuál es el carácter EXTERNO de la organización según March y Simon?","o":["Funciona como catalizador del esfuerzo social para generar satisfactores comunes a la sociedad","Orienta las acciones individuales mediante la división de funciones","Define el organigrama formal","Determina la cultura organizacional"],"e":"El carácter interno es el que orienta las acciones individuales mediante la división de funciones."},{"id":"telppn","l":"L25","u":"U2","s":"mat","q":"Para Simon, la «organización» se refiere a:","o":["El complejo diseño de comunicaciones y demás relaciones existentes dentro de un grupo de seres humanos","El organigrama, los manuales y demás documentos formales que definen los puestos","El conjunto de bienes materiales y financieros de que dispone un grupo humano","La relación de mando y obediencia que existe entre los jefes y los subordinados"],"e":"Transmite información, supuestos y actitudes para decidir, y es un sistema de expectativas y roles."},{"id":"1kl78lk","l":"L25","u":"U2","s":"mat","q":"Simon define la AUTORIDAD como:","o":["El poder de tomar decisiones que guíen las acciones de otros","El derecho de propiedad sobre la empresa","La capacidad de castigar al subordinado","El prestigio técnico de un especialista"],"e":"Además, la autoridad existe solo si el subordinado realmente ajusta su conducta a la decisión transmitida."},{"id":"1vtzwk6","l":"L25","u":"U2","s":"mat","q":"Para Simon, la COMUNICACIÓN es:","o":["El proceso mediante el cual las premisas decisorias se transmiten de un miembro a otro","Una función exclusiva del departamento de relaciones públicas","El organigrama de la empresa","Un sinónimo de autoridad"],"e":"Proporciona los insumos para decidir."},{"id":"1f4yvjh","l":"L25","u":"U2","s":"mat","q":"¿Cuál es la diferencia entre cooperación y coordinación según Simon?","o":["Cooperación es la voluntad de compartir un fin común; coordinación es informar a cada miembro sobre el comportamiento proyectado de los demás","Son sinónimos: ambos términos se refieren a la voluntad de trabajar juntos por un fin común","Coordinación es la voluntad de compartir un fin; cooperación es la estructura formal de puestos","Cooperación ocurre entre niveles jerárquicos (vertical) y coordinación entre departamentos (horizontal)"],"e":"Tener ganas de trabajar juntos (cooperación) no sirve si no se sabe qué le toca a cada quién (coordinación)."},{"id":"21djse","l":"L25","u":"U2","s":"mat","q":"La división del trabajo de decisión y mando entre distintos niveles jerárquicos es, según Simon, la especialización:","o":["Vertical","Horizontal","Funcional","Geográfica"],"e":"La horizontal distribuye tareas distintas entre personas del mismo nivel (departamentos)."},{"id":"nfji7i","l":"L25","u":"U2","s":"mat","q":"Según Barnard y Simon, la decisión PERSONAL:","o":["Es subjetiva, se basa en los intereses del individuo y es indelegable","Es objetiva, orientada a metas del grupo y delegable","Es tomada por un comité","Se transmite siempre de arriba hacia abajo"],"e":"La decisión impersonal u organizacional es objetiva, delegable y analiza medios y fines."},{"id":"g5qxr3","l":"L25","u":"U2","s":"mat","q":"El «hombre administrativo» de Simon, a diferencia del «hombre económico»:","o":["Busca satisfacer (una opción «lo bastante buena») con información incompleta","Busca maximizar (la opción 100% perfecta) con información completa","Evalúa todas las alternativas posibles antes de elegir la óptima","Actúa con racionalidad ilimitada, porque conoce todas las consecuencias"],"e":"Es la racionalidad limitada: no conocemos todas las alternativas ni prevemos todas las consecuencias."},{"id":"1bb5f0l","l":"L25","u":"U2","s":"mat","q":"Los dos elementos de la racionalidad limitada son:","o":["La incapacidad de conocer todas las opciones y la tendencia a simplificar el mundo con reglas sencillas","La falta de autoridad formal y las fallas en los canales de comunicación de la empresa","El exceso de información disponible y la lentitud de los procesos burocráticos","La falta de lealtad hacia la organización y la escasa capacidad técnica del personal"],"e":"La mente tiene límites físicos, de conocimiento, de experiencia y de valores."},{"id":"1v77697","l":"L25","u":"U2","s":"mat","q":"¿Cuál NO es una de las tres limitaciones individuales que, según la teoría de roles, debe considerar la empresa?","o":["El salario del trabajador","Capacidad, hábitos y reflejos","Lealtad hacia la organización","Grado de conocimiento"],"e":"Si falta lealtad, los móviles personales estorban la eficiencia."},{"id":"esi3g6","l":"L25","u":"U2","s":"mat","q":"Para Simon, todo proceso administrativo es, en esencia, un proceso de:","o":["Decisión","Control","Producción","Supervisión"],"e":"Las acciones surgen de elegir y transmitir lineamientos."},{"id":"12zxun9","l":"L25","u":"U2","s":"mat","q":"Según Simon, ¿cuál NO es una de las tres justificaciones para estudiar las organizaciones?","o":["Son el único lugar donde se genera riqueza","Las ciencias sociales les habían prestado poca atención","Moldean la conducta humana, porque los adultos pasan ahí la mayor parte de su vida","Son plataformas de autoridad e influencia"],"e":"Foucault las ve como «observatorios privilegiados» del poder; Whyte escribió El hombre organización."},{"id":"g8zw6s","l":"L26","u":"U2","s":"mat","q":"Luhmann afirma que los sistemas sociales son autopoiéticos. Esto significa que:","o":["Se producen a sí mismos, generando sus propios componentes","Dependen totalmente de un diseñador externo","Son máquinas triviales y predecibles","No tienen relación con su entorno"],"e":"Concepto de Maturana y Varela (1984). En los sistemas sociales, la unidad básica son las comunicaciones."},{"id":"1yufizd","l":"L26","u":"U2","s":"mat","q":"Para Luhmann, las organizaciones son sistemas sociales autopoiéticos compuestos por:","o":["Decisiones","Personas","Edificios y recursos","Contratos"],"e":"Reinterpreta las distinciones clásicas bajo una premisa: la organización es un sistema autopoiético hecho de decisiones."},{"id":"i54wsn","l":"L26","u":"U2","s":"mat","q":"La relación permanente de un sistema social con su entorno se llama, en Luhmann:","o":["Acoplamiento estructural","Equifinalidad","Unidad de mando","Departamentalización"],"e":"El sistema está acoplado permanentemente con su entorno, sin confundirse con él."},{"id":"zpbow7","l":"L26","u":"U2","s":"mat","q":"Según Luhmann, el uso sociológico del término «organización» nace:","o":["En el siglo XIX, tras la Revolución Francesa (Saint-Simon, Comte)","En la Edad Media, con las corporaciones y los gremios de artesanos","En la Antigua Grecia, con la organización de la ciudad-Estado","A principios del siglo XX, con la administración científica de Taylor"],"e":"En la Edad Media el orden descansaba en la estratificación familiar y corporativa."},{"id":"1njlo7l","l":"L26","u":"U2","s":"mat","q":"Según Luhmann, ¿cuál es el principal límite del modelo burocrático de Weber?","o":["Supone una obediencia perfecta que no existe; abajo siempre hay margen de interpretación y negociación","Fomenta el favoritismo y la arbitrariedad en la cúspide de la organización","No utiliza normas escritas, por lo que cada jefe decide según su criterio","Es demasiado informal, ya que se basa en relaciones espontáneas de confianza"],"e":"Los niveles inferiores generan negociaciones o «colusiones»."},{"id":"1iiwdp1","l":"L26","u":"U2","s":"mat","q":"Heinz von Foerster describe al grupo humano como una «máquina no trivial» porque:","o":["No responde igual a los mismos estímulos: su conducta depende de su estado interno e historia","Funciona como una línea de montaje: el mismo estímulo siempre produce la misma respuesta","Siempre responde de manera predecible si se aplican los incentivos económicos adecuados","No tiene estructura ni historia, por lo que no puede estudiarse científicamente"],"e":"Los experimentos de Hawthorne demostraron algo similar."},{"id":"5c2qao","l":"L26","u":"U2","s":"mat","q":"Luhmann sustituye la distinción clásica «todo y partes» por la distinción:","o":["Sistema / entorno","Formal / informal","Fin / medio","Orden / obediencia"],"e":"Fin/medio → racionalidad limitada y contingencia; entrada/salida → autorreferencia y decisiones; adaptación pasiva → construcción del entorno."},{"id":"2ivqts","l":"L26","u":"U2","s":"mat","q":"Ante el esquema clásico de «fin y medio», Luhmann señala como problema:","o":["El desplazamiento de fines: los medios terminan convirtiéndose en fines en sí mismos","Que los fines fijados por la cúspide siempre se cumplen si los medios son suficientes","Que la cúspide nunca fija fines y deja toda la decisión a los niveles inferiores","Que los medios son irrelevantes, porque solo importa alcanzar los fines establecidos"],"e":"Ejemplo: cumplir la norma por cumplirla, aunque no resuelva el problema del cliente."},{"id":"11o0gbg","l":"L26","u":"U2","s":"mat","q":"¿Qué propuso Simon, según Luhmann, frente a la imposibilidad de calcular todas las consecuencias?","o":["Fijar premisas decisorias para guiar las decisiones sin exigir una perfección imposible","Centralizar todas las decisiones en la cúspide para evitar errores en los niveles bajos","Eliminar la jerarquía y dejar que cada miembro decida según sus intereses","Usar exclusivamente modelos matemáticos que calculen todas las consecuencias posibles"],"e":"Es su aporte de la racionalidad limitada."},{"id":"99xdx2","l":"L26","u":"U2","s":"mat","q":"La distinción clásica «entrada/salida» (caja negra) es reemplazada por Luhmann por:","o":["Autorreferencia y decisiones","Sistema/entorno","Redes formales e informales de poder","Construcción del entorno"],"e":"La caja negra no explica cómo el sistema genera sus propias reglas."},{"id":"1fuipg3","l":"L26","u":"U2","s":"mat","q":"La «adaptación pasiva» al entorno es reemplazada por Luhmann por:","o":["La construcción del entorno (enactment)","El acoplamiento estructural","La unidad de mando","La burocracia"],"e":"La adaptación pasiva asume un entorno fijo e independiente."},{"id":"11vt8zl","l":"L26","u":"U2","s":"mat","q":"¿Cuál de las siguientes NO es una fuente no sociológica de la que se nutre el estudio de las organizaciones, según la introducción a Luhmann?","o":["Teología","Psicología social","Cibernética","Biología"],"e":"La lista incluye administración, psicología social, psiquiatría, cibernética, matemáticas y biología."},{"id":"jipb6r","l":"L31","u":"U3","s":"mat","q":"Según Reyes Ponce, el proceso administrativo se divide en etapas porque:","o":["Es útil para estudiar y fijar reglas a cada aspecto, aunque en la realidad el fenómeno es único y simultáneo","En la realidad las etapas ocurren estrictamente una después de otra, sin traslaparse","Cada etapa la debe realizar un departamento diferente de la empresa","La ley mexicana exige que el proceso se documente por etapas separadas"],"e":"El fenómeno es único, continuo e inseparable; dividirlo es una herramienta pedagógica y técnica, como en la medicina."},{"id":"suczh9","l":"L31","u":"U3","s":"mat","q":"¿Qué autor propuso la división del proceso en planeación, organización, integración, dirección y control?","o":["Koontz y O'Donnell","Henri Fayol","George R. Terry","Lyndall Urwick"],"e":"Fayol: prever, organizar, mandar, coordinar, controlar. Terry: planeación, organización, ejecución y control. Urwick: 6 elementos, con previsión."},{"id":"3aolx6","l":"L31","u":"U3","s":"mat","q":"El autor que separa la PREVISIÓN de la planeación y propone seis elementos es:","o":["Lyndall Urwick","Henri Fayol","Koontz y O'Donnell","American Management Association"],"e":"Urwick: previsión, planeación, organización, integración, dirección y control."},{"id":"1ru9dqy","l":"L31","u":"U3","s":"mat","q":"La división tripartita «planeación, organización y supervisión» corresponde a:","o":["La American Management Association (Appley)","George R. Terry","Ernest Dale","Luther Gulick"],"e":"Es la división simplificada que menciona Reyes Ponce."},{"id":"7zpn4i","l":"L31","u":"U3","s":"mat","q":"¿Qué autor añade la función de innovación y representación al proceso administrativo?","o":["Ernest Dale","Luther Gulick","Lyndall Urwick","George Terry"],"e":"Dale propone 6 elementos, incluida la función jurídica de representación y la de innovación."},{"id":"1t8fbkl","l":"L31","u":"U3","s":"mat","q":"El desglose de 8 elementos del proceso, pensado para la administración pública, es de:","o":["Luther Gulick","Henri Fayol","Koontz y O'Donnell","George R. Terry"],"e":"Gulick: planeación, organización, integración, dirección, coordinación, operación, comunicación y control presupuestal (POSDCORB)."},{"id":"mobaxc","l":"L31","u":"U3","s":"mat","q":"¿Qué autor identificó la COORDINACIÓN como un elemento del proceso administrativo?","o":["Henri Fayol","George R. Terry","Koontz y O'Donnell","Agustín Reyes Ponce"],"e":"Fayol: prever, organizar, mandar, coordinar y controlar. Reyes Ponce, en cambio, ve la coordinación como la esencia de toda la administración, no como una etapa."},{"id":"oq6vi4","l":"L31","u":"U3","s":"mat","q":"En la síntesis de Reyes Ponce, las etapas de la MECÁNICA administrativa son:","o":["Previsión, planeación y organización","Integración, dirección y control","Planeación, organización e integración","Previsión, dirección y control"],"e":"Dinámica: integración, dirección y control."},{"id":"pwluy0","l":"L31","u":"U3","s":"mat","q":"La pregunta clave «¿Con qué y con quién se va a hacer?» corresponde a la etapa de:","o":["Integración","Organización","Planeación","Dirección"],"e":"Previsión: ¿qué puede hacerse? Planeación: ¿qué se va a hacer? Organización: ¿cómo se va a hacer? Integración: ¿con qué y con quién? Dirección: ver que se haga. Control: ¿cómo se ha realizado?"},{"id":"1e09rr1","l":"L31","u":"U3","s":"mat","q":"La pregunta «¿Cómo se va a hacer?» corresponde, según Reyes Ponce, a la etapa de:","o":["Organización","Planeación","Dirección","Previsión"],"e":"La organización estructura técnicamente funciones, jerarquías y obligaciones."},{"id":"1j64rvo","l":"L31","u":"U3","s":"mat","q":"¿En qué etapa ubica Reyes Ponce la selección, la introducción (inducción) y el desarrollo (capacitación) del personal?","o":["Integración","Organización","Dirección","Control"],"e":"La integración dota al organismo de personas y recursos: selección, introducción, desarrollo e integración de las cosas."},{"id":"1c8q7o6","l":"L31","u":"U3","s":"mat","q":"El «mito de Jano», en el proceso administrativo, explica que:","o":["El control, que mira al pasado, se conecta inmediatamente con la previsión, que mira al futuro","La dirección tiene dos caras inseparables: la autoridad y la comunicación","La organización formal y la informal son opuestas y no pueden coexistir","El administrador debe responder a dos jefes, uno de línea y otro de staff"],"e":"Jano, dios romano de dos rostros: el proceso es cíclico."},{"id":"nu2oxf","l":"L31","u":"U3","s":"mat","q":"Según Luis F. Anderson, toda regla administrativa se sostiene en tres pilares:","o":["Principios, proceso e instrumentos o medios técnicos","Planeación, organización y control","Ciencia, arte y técnica","Autoridad, responsabilidad y delegación"],"e":"Ejemplos de instrumentos: tests de selección, organigramas, gráficas de salarios, calificación de méritos, presupuestos y modelos matemáticos."},{"id":"1rrt7yh","l":"L31","u":"U3","s":"mat","q":"Un organigrama, un test de selección y un presupuesto son, según el método de Anderson:","o":["Instrumentos o medios técnicos","Principios administrativos","Etapas del proceso","Objetivos colaterales"],"e":"Materializan los resultados del proceso."},{"id":"wta6bs","l":"L31","u":"U3","s":"mat","q":"En los elementos de la «administración de cosas» (criterio de Fayol, en Reyes Ponce), las operaciones de mantenimiento y protección de activos son las de:","o":["Conservación","Registro","Compras","Producción"],"e":"Las 6 áreas son: financieras, productivas, de ventas o distribución, de conservación, de registro (contable y estadístico) y de compras."},{"id":"19s4lhf","l":"L32","u":"U3","s":"mat","q":"La previsión responde a la pregunta:","o":["¿Qué puede hacerse?","¿Qué se va a hacer?","¿Cómo se va a hacer?","¿Cómo se ha realizado?"],"e":"La planeación responde «¿qué se va a hacer?»."},{"id":"1bfphpl","l":"L32","u":"U3","s":"mat","q":"¿Cuáles son los tres elementos que requiere la previsión según Reyes Ponce?","o":["Objetivos, investigaciones y cursos alternativos de acción","Políticas, procedimientos y programas","Funciones, jerarquías y obligaciones","Autoridad, comunicación y supervisión"],"e":"Fijar objetivos, investigar los factores positivos y negativos y coordinar medios en cursos alternativos de acción."},{"id":"wgqn9i","l":"L32","u":"U3","s":"mat","q":"Comenzar directamente por la planeación, sin previsión, encierra el peligro de lo que Drucker llama:","o":["La falacia del único camino","La respuesta correcta a la pregunta equivocada","El desplazamiento de fines","La racionalidad limitada"],"e":"Elegir a priori el curso «obvio» sin investigar alternativas. «La respuesta correcta a la pregunta equivocada» se relaciona con las reglas negativas para fijar objetivos."},{"id":"1mg1dy3","l":"L32","u":"U3","s":"mat","q":"El principio de la previsibilidad establece que las previsiones administrativas:","o":["Nunca alcanzan certeza completa, pero descansan en una certeza moral o probabilidad seria","Son profecías exactas siempre que se apoyen en estadística y cálculo de probabilidades","Son imposibles, porque la empresa es una aventura totalmente incierta y arriesgada","Deben basarse en la intuición y la experiencia personal del dueño de la empresa"],"e":"Fayol: la previsión no es profecía, sino una reducción del riesgo."},{"id":"k5xpt4","l":"L32","u":"U3","s":"mat","q":"Que ocurra un eclipse en una fecha determinada es un ejemplo de certeza:","o":["Física","Metafísica","Moral","Probable"],"e":"Metafísica: un círculo no puede ser cuadrado. Física: leyes de la naturaleza (eclipse). Moral: oferta y demanda en grupos grandes."},{"id":"dsepzl","l":"L32","u":"U3","s":"mat","q":"El cumplimiento de la ley de la oferta y la demanda en grupos sociales grandes es, según Reyes Ponce, un ejemplo de certeza:","o":["Moral","Física","Metafísica","Absoluta"],"e":"Hay una seguridad muy difícil de frustrar, pero no infalible."},{"id":"geb498","l":"L32","u":"U3","s":"mat","q":"Si un estudio concluye con fundamentos que una nueva empresa fracasará, para Reyes Ponce eso es:","o":["Certeza (desfavorable)","Incertidumbre","Probabilidad mínima","Riesgo neutro"],"e":"La certeza puede ser favorable o desfavorable; la incertidumbre se da cuando no se puede llegar a ninguna conclusión."},{"id":"1xsim1j","l":"L32","u":"U3","s":"mat","q":"¿Cuál es el estado mental en el que, sin seguridad, se tienen motivos serios y fundados para concluir que un hecho ocurrirá más en un sentido que en otro?","o":["Probabilidad","Certeza","Incertidumbre","Riesgo cero"],"e":"La probabilidad puede ir desde casi la incertidumbre hasta una enorme certeza moral."},{"id":"v8b94d","l":"L32","u":"U3","s":"mat","q":"«Las previsiones deben descansar en hechos más que en opiniones subjetivas» es el principio de:","o":["Objetividad","Medición","Previsibilidad","Unidad de mando"],"e":"Ejemplo: usar presupuestos basados en datos de años anteriores, no en encuestas de opinión cargadas de rutina o de presiones."},{"id":"1l4r6ov","l":"L32","u":"U3","s":"mat","q":"El principio de la medición establece que las previsiones son más seguras cuanto más:","o":["Puedan apreciarse de forma cuantitativa","Se basen en la experiencia del jefe","Se repitan año con año sin cambios","Se mantengan en secreto"],"e":"Cuando no se puede medir directamente, se fijan estándares por definición óptima."},{"id":"1n4xirb","l":"L32","u":"U3","s":"mat","q":"Según Reyes Ponce, los objetivos a MEDIANO plazo son aquellos que se esperan lograr en:","o":["Más de 1 año y hasta 5 años","Hasta 1 año","Más de 5 años","Entre 6 meses y 2 años"],"e":"Corto: un año como máximo. Mediano: más de 1 y hasta 5. Largo: más de 5 años."},{"id":"2quwd9","l":"L32","u":"U3","s":"mat","q":"Los objetivos que se fijan en los niveles intermedios, sirven de conexión entre los estratégicos y los operativos y determinan el «cómo», son los:","o":["Técnicos","Colaterales","Arbitrarios","Individuales"],"e":"Estratégicos: alto nivel, largo plazo. Técnicos: intermedio, mediano plazo. Operativos: nivel bajo, corto plazo."},{"id":"kn2cvf","l":"L32","u":"U3","s":"mat","q":"La publicidad busca aumentar las ventas, pero bien enfocada también mejora las relaciones públicas. Esa mejora es un objetivo:","o":["Colateral","Secundario","Arbitrario","Estratégico"],"e":"Los colaterales se obtienen casi espontáneamente al buscar los secundarios, sin buscarse directamente."},{"id":"tpzefs","l":"L32","u":"U3","s":"mat","q":"El fin natural de una empresa lucrativa es generar beneficios; si el empresario la mantiene para lograr prestigio social, ese objetivo es:","o":["Arbitrario o subjetivo","Natural","Colateral","Técnico"],"e":"El objetivo arbitrario lo propone el empresario y es distinto a la naturaleza propia de la actividad."},{"id":"1u667gn","l":"L32","u":"U3","s":"mat","q":"Según Reyes Ponce, los objetivos generales y supremos los fijan ordinariamente:","o":["Los dueños o empresarios","Los supervisores inmediatos","El departamento de personal","Los trabajadores mediante votación"],"e":"Al administrador le corresponde el «cómo» y «ver que se haga»; además fija los objetivos particulares y de corto plazo."},{"id":"mmatar","l":"L32","u":"U3","s":"mat","q":"«No debe tomarse como objetivo lo que puede ser tan solo su síntoma o efecto» es una regla:","o":["Negativa para fijar objetivos","Positiva para fijar objetivos","Del principio de medición","De la planeación"],"e":"Las reglas negativas evitan lo que Drucker llama «la respuesta correcta a la pregunta equivocada»."},{"id":"n2agq8","l":"L32","u":"U3","s":"mat","q":"Creer que la única forma de mejorar la producción es cambiar la maquinaria viola la regla negativa:","o":["No confundir el objetivo con uno de los medios para alcanzarlo","No tomar como objetivo sus síntomas","No tomar como contradictorio lo que solo es contrario","Buscar semejanzas y diferencias con objetivos parecidos"],"e":"Hay otros medios: mejores sistemas, mejor adiestramiento, etc."},{"id":"1hfq2ln","l":"L32","u":"U3","s":"mat","q":"Plantear un dilema como «hacer esto o no hacerlo», ignorando opciones intermedias, viola la regla de:","o":["No tomar como contradictorias posibilidades que solo son contrarias","No tomar como objetivo lo que solo son sus síntomas o efectos","No confundir el objetivo con uno de los medios para alcanzarlo","Buscar las semejanzas y diferencias con los objetivos más parecidos"],"e":"Drucker: el espíritu tiende a pensar en blanco y negro, aunque existe toda una gama de grises."},{"id":"jyt9os","l":"L32","u":"U3","s":"mat","q":"¿Cuál de las siguientes es una regla POSITIVA para fijar objetivos?","o":["El objetivo debe fijarse por escrito en los casos de mayor importancia","No confundir el objetivo con sus medios","No tomar los síntomas como objetivo","No tomar como contradictorio lo que es contrario"],"e":"Positivas: oír opiniones diversas, fijarlo por escrito, aplicar las 6 preguntas, que sea conocido y querido por todos y que sea estable."},{"id":"18m7xqc","l":"L32","u":"U3","s":"mat","q":"Según Reyes Ponce, en la fijación de objetivos es indispensable la ___ en la decisión, pero más deseable la ___ en la deliberación.","o":["unidad / pluralidad","pluralidad / unidad","autoridad / obediencia","rapidez / lentitud"],"e":"Por eso son importantes los comités, las juntas y los seminarios."},{"id":"1on0xt4","l":"L32","u":"U3","s":"mat","q":"De las seis preguntas para fijar objetivos, Reyes Ponce destaca por su importancia:","o":["Qué, cómo y por qué","Quién, dónde y cuándo","Cuánto, cuándo y dónde","Quién, cómo y cuándo"],"e":"Las seis son qué, cómo, quién, dónde, cuándo y por qué (también se puede agregar cuánto)."},{"id":"ue1rmu","l":"L32","u":"U3","s":"mat","q":"El término que Reyes Ponce describe como «el factor más genérico, que esquematiza de manera filosófica las orientaciones de toda la empresa» es:","o":["Misión","Meta","Resultado","Premisa"],"e":"Las metas requieren precisión (cifras de costo, calidad y tiempo); el resultado es el objetivo ya logrado; la premisa es lo que viene antes."},{"id":"1lvhmfw","l":"L32","u":"U3","s":"mat","q":"Según Reyes Ponce, «los objetivos que se logran» son los:","o":["Resultados","Propósitos","Fines","Metas colaterales"],"e":"Objetivos = resultados que se desean obtener; resultados = objetivos que se logran."},{"id":"1weh5gm","l":"L33","u":"U3","s":"mat","q":"Según Koontz y Weihrich, la función administrativa MÁS BÁSICA de todas es:","o":["La planeación","La dirección","El control","La organización"],"e":"Implica seleccionar misiones y objetivos y las acciones para cumplirlos. Ojo: Reyes Ponce dice que la dirección es la esencia y el corazón de la administración. ¡Atiende al autor que te pregunten!"},{"id":"mjn50c","l":"L33","u":"U3","s":"mat","q":"Koontz y Weihrich llaman a la planeación y el control:","o":["Los hermanos siameses de la administración","Las dos caras de Jano","Los pilares de Anderson","La mecánica y la dinámica"],"e":"En el capítulo de control también los describen como las «hojas de la misma tijera»."},{"id":"ulvbc9","l":"L33","u":"U3","s":"mat","q":"Enunciados o criterios generales que orientan o encauzan el PENSAMIENTO en la toma de decisiones y dejan cierta discrecionalidad son:","o":["Políticas","Reglas","Procedimientos","Presupuestos"],"e":"Las reglas no permiten discrecionalidad; los procedimientos son guías de acción, no de pensamiento."},{"id":"16u13al","l":"L33","u":"U3","s":"mat","q":"«No fumar» es un ejemplo de:","o":["Regla","Política","Procedimiento","Programa"],"e":"La regla expone acciones u omisiones específicas, sin discrecionalidad; es el tipo de plan más simple."},{"id":"1a0v6vd","l":"L33","u":"U3","s":"mat","q":"Los planes que establecen secuencias cronológicas de acciones requeridas y son «guías de acción, no de pensamiento» son:","o":["Procedimientos","Políticas","Estrategias","Misiones"],"e":"Suelen cruzar fronteras departamentales (por ejemplo, el trámite de pedidos)."},{"id":"gntj5f","l":"L33","u":"U3","s":"mat","q":"Un conjunto de metas, políticas, procedimientos, reglas, asignaciones de tareas, pasos y recursos para llevar a cabo un curso de acción es:","o":["Un programa","Un presupuesto","Una estrategia","Una regla"],"e":"Los programas suelen apoyarse en presupuestos; un programa principal puede requerir muchos programas de apoyo."},{"id":"13fmlh6","l":"L33","u":"U3","s":"mat","q":"Un programa «en cifras», que expresa los resultados esperados en términos numéricos, es:","o":["Un presupuesto","Una política","Un procedimiento","Una premisa"],"e":"Puede expresarse en dinero, horas-hombre o unidades; al presupuesto financiero operacional se le llama «plan de utilidades»."},{"id":"11i8ugd","l":"L33","u":"U3","s":"mat","q":"Koontz y Weihrich definen la ESTRATEGIA como:","o":["La determinación de los objetivos básicos a largo plazo y la adopción de los cursos de acción y la asignación de recursos para cumplirlos","Los enunciados o criterios generales que orientan el pensamiento en la toma de decisiones","Las secuencias cronológicas de acciones requeridas para manejar actividades futuras","La función o tarea básica que la sociedad asigna a una empresa o institución"],"e":"La tarea básica es la misión o propósito."},{"id":"ljo72p","l":"L33","u":"U3","s":"mat","q":"El VERDADERO punto de partida de la planeación, aunque esté fuera del proceso en sentido estricto, es:","o":["La atención a las oportunidades","El establecimiento de objetivos","La formulación de presupuestos","La selección de un curso de acción"],"e":"Implica analizar el mercado, la competencia, los clientes y las propias fortalezas y debilidades."},{"id":"1gxejwz","l":"L33","u":"U3","s":"mat","q":"En los pasos de la planeación de Koontz, el punto en el que «se adopta el plan» y se toma realmente la decisión es:","o":["La selección de un curso de acción","La evaluación de cursos alternativos","El desarrollo de premisas","La formulación de planes derivados"],"e":"Es el paso 6 de 8."},{"id":"nge46e","l":"L33","u":"U3","s":"mat","q":"El ÚLTIMO paso de la planeación según Koontz y Weihrich es:","o":["Traducir los planes a cifras mediante la presupuestación","Formular planes derivados que apoyen al plan básico","Seleccionar el curso de acción más conveniente","Evaluar los cursos alternativos a la luz de premisas y metas"],"e":"Orden: oportunidades → objetivos → premisas → alternativas → evaluación → selección → planes derivados → presupuestos."},{"id":"931wf0","l":"L33","u":"U3","s":"mat","q":"Los pronósticos, las políticas básicas aplicables y los planes ya existentes son, en la planeación:","o":["Premisas","Objetivos","Programas","Reglas"],"e":"Son supuestos sobre las condiciones en que el plan operará; cuanto mayor sea el acuerdo sobre ellos, más coordinada será la planeación."},{"id":"1v8q16l","l":"L33","u":"U3","s":"mat","q":"Según Koontz, el problema más común con los cursos alternativos de acción es:","o":["Reducir su número para analizar los más prometedores","Encontrar alguna alternativa","Que siempre existe una sola alternativa","Que no se pueden evaluar"],"e":"Casi siempre hay alternativas, y a menudo la menos obvia es la mejor."},{"id":"chjtxk","l":"L33","u":"U3","s":"mat","q":"¿Cuál de los siguientes objetivos es VERIFICABLE?","o":["Obten
